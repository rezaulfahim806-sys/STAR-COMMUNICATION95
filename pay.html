<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAR COMMUNICATION - Customer Payment</title>
<style>body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:480px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 4px 18px #00000012}.logo{width:76px;height:76px;display:block;margin:auto;border-radius:18px}.brand{text-align:center}.brand h1{font-size:22px;margin:8px 0 3px}.muted{color:#718096;font-size:14px}.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.row b{text-align:right}.due{font-size:22px;color:#c62828}.bkash{background:#fdf1f7}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:#e2136e;color:#fff;margin-top:10px}.note{font-size:13px;line-height:1.5;color:#687386}</style>
</head>
<body><div class="wrap">
<div class="card brand"><img class="logo" src="logo.svg" onerror="this.style.display='none'"><h1>STAR COMMUNICATION</h1><div class="muted">Customer Bill Payment</div></div>
<div id="app"></div>
<script>
const customers={
SC001:{name:'Demo Customer',location:'',package:'30 Mb',bill:500,previousDue:0,totalDue:500}
};
const p=new URLSearchParams(location.search); const code=(p.get('code')||'').trim();
const c=customers[code];
const app=document.getElementById('app');
function money(n){return '৳'+Number(n||0).toLocaleString('en-BD');}
if(!code||!c){app.innerHTML='<div class="card"><h2>Customer not found</h2><p class="muted">Please use the payment link sent by STAR COMMUNICATION.</p></div>'}
else {app.innerHTML=`<div class="card"><div class="row"><span>Client Code</span><b>${code}</b></div><div class="row"><span>Customer Name</span><b>${c.name}</b></div><div class="row"><span>Location</span><b>${c.location||'-'}</b></div><div class="row"><span>Package</span><b>${c.package}</b></div><div class="row"><span>Monthly Bill</span><b>${money(c.bill)}</b></div><div class="row"><span>Previous Due</span><b>${money(c.previousDue)}</b></div><div class="row"><span>Total Due</span><b class="due">${money(c.totalDue)}</b></div></div><div class="card bkash"><h3>💳 bKash Payment</h3><div class="row"><span>Payment Number</span><b>01897-099850</b></div><p class="note">Send your bill payment to the number above and use your Client Code as reference.</p><button class="btn" onclick="pay()">Pay Bill</button></div>`}
function pay(){navigator.clipboard?navigator.clipboard.writeText('01897099850').then(()=>alert('bKash payment number copied.')):alert('bKash: 01897-099850');}
</script></body></html>
