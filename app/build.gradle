plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starcommunication.isp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.starcommunication.isp'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        stable {
            storeFile file("star-release-key.jks")
            storePassword System.getenv("STAR_SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("STAR_SIGNING_KEY_ALIAS")
            keyPassword System.getenv("STAR_SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
