plugins {
    id 'com.android.application'
}

def hasStableSigning = file("star-release-key.jks").exists() &&
        System.getenv("STAR_SIGNING_STORE_PASSWORD") &&
        System.getenv("STAR_SIGNING_KEY_ALIAS") &&
        System.getenv("STAR_SIGNING_KEY_PASSWORD")

android {
    namespace 'com.starcommunication.isp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.starcommunication.isp'
        minSdk 23
        targetSdk 35
        versionCode 17
        versionName '1.16'
    }

    signingConfigs {
        if (hasStableSigning) {
            stable {
                storeFile file("star-release-key.jks")
                storePassword System.getenv("STAR_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("STAR_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("STAR_SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
