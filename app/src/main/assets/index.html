<style>

ark{background:var(--navy)}.btn.light{background:#eef3fa;color:var(--navy)}.full{width:100%}.searchbox{margin-bottom:11px}.customer{background:#fff;border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:0 4px 13px #0000000a}.cmain{display:flex;gap:11px;align-items:center}.avatar{width:43px;height:43px;border-radius:13px;background:#e8f2ff;color:#0877dc;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}.grow{flex:1;min-width:0}.name{font-weight:900;font-size:16px}.muted{color:#667085;font-size:12px;margin-top:3px}.badge{display:inline-block;padding:5px 8px;border-radius:18px;font-size:10px;font-weight:900}.active,.paid{background:#dcfce7;color:#15803d}.inactive{background:#e5e7eb;color:#475569}.expired{background:#fee2e2;color:#b91c1c}.unpaid{background:#ffedd5;color:#c2410c}.actions{display:flex;gap:6px;margin-top:10px}.small{border:0;border-radius:9px;padding:8px 9px;font-size:12px;font-weight:800}.wa{background:#25d366;color:#fff}.call{background:#e8f1ff;color:#1267c7}.view{background:#edf0f5;color:#334155}.pay{background:var(--green);color:#fff}.back{border:0;background:transparent;color:var(--navy);font-weight:900;padding:0 0 12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{border:0;background:#e9eef6;color:#536176;border-radius:20px;padding:9px 12px;white-space:nowrap}.tab.on{background:var(--blue);color:#fff}.detail{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f4;gap:15px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:78px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:30}.bottom button{flex:1;border:0;background:#fff;color:#555;font-size:12px}.bottom button.on{color:#0877c9;font-weight:900}.bottom span{display:block;font-size:26px;margin-bottom:2px}.drawerShade{display:none;position:fixed;inset:0;background:#0008;z-index:50}.drawerShade.show{display:block}.drawer{width:300px;max-width:84%;height:100%;background:var(--navy);color:#fff;padding:18px 15px;overflow:auto}.drawer h2{font-size:20px;margin:8px 0 2px}.drawer small{color:#ccd6e9}.close{float:right;border:0;background:transparent;color:#fff;font-size:28px}.menu{margin-top:24px}.menu button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:14px 10px;border-radius:10px;font-weight:800}.menu button:hover{background:#ffffff14}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:19px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:11px;display:none;z-index:80}.toast.show{display:block}.empty{text-align:center;padding:20px;color:#667085}.mini{font-size:13px}.divider{height:1px;background:#edf0f4;margin:12px 0}.chart{background:#fff;border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 6px 18px #0000000c}.charthead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.charttitle{font-size:18px;font-weight:900}.chartsub{font-size:12px;color:#667085;margin-top:3px}.chartgrid{height:190px;display:flex;align-items:flex-end;gap:7px;margin-top:18px;padding:0 2px}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.barvalue{font-size:10px;font-weight:900;margin-bottom:4px}.bar{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#2d83cf,#14244b);min-height:3px}.barlabel{font-size:9px;color:#667085;margin-top:7px}.chartbadge{font-size:10px;font-weight:900;background:#e8f2ff;color:#1267c7;padding:6px 8px;border-radius:14px}.chartfoot{font-size:11px;color:#667085;margin-top:12px}.oltStatus{display:flex;align-items:center;gap:8px;font-weight:900}.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}.dot.on{background:#16a34a}.dot.bad{background:#ef1d28}

</style></head><body><div class="app">
<header><div class="top"><button class="icon" onclick="openDrawer()">☰</button><div class="brand" id="brand">STAR COMMUNICATION</div><button class="icon search" onclick="go('customers')">⌕</button></div></header>
<main id="content" class="content"></main>
<nav class="bottom"><button id="nav-dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button id="nav-customers" onclick="go('customers')"><span>👥</span>Customer</button><button id="nav-olt" onclick="go('olt')"><span>🌐</span>OLT</button><button id="nav-billing" onclick="go('billing')"><span>💳</span>Billing</button><button id="nav-accounts" onclick="go('accounts')"><span>💰</span>Hesab</button></nav></div>
<div id="shade" class="drawerShade" onclick="closeDrawer()"><aside class="drawer" onclick="event.stopPropagation()"><button class="close" onclick="closeDrawer()">×</button><div style="clear:both"></div><h2 id="drawerBrand">STAR COMMUNICATION</h2><small>ISP Manager</small><div class="menu"><button onclick="go('dashboard');closeDrawer()">🏠 &nbsp; Dashboard</button><button onclick="go('customers');closeDrawer()">👥 &nbsp; Customer</button><button onclick="go('olt');closeDrawer()">🌐 &nbsp; OLT Monitoring</button><button onclick="go('billing');closeDrawer()">💳 &nbsp; Billing & Payment</button><button onclick="go('accounts');closeDrawer()">💰 &nbsp; Hesab</button><button onclick="openCloudLogin()">☁️ &nbsp; Server Login</button><button onclick="openSettings()">⚙️ &nbsp; Settings</button></div></aside></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const API={base:(localStorage.getItem('star_api_url')||''),token:(localStorage.getItem('star_api_token')||'')};
async function apiFetch(path,opt={}){if(!API.base)throw new Error('API URL not set');const h=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(API.token)h.Authorization='Bearer '+API.token;const r=await fetch(API.base.replace(/\/$/,'')+path,{...opt,headers:h});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch(e){data={raw:text}}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));return data}
async function cloudLogin(base,user,pass){API.base=base.replace(/\/$/,'');const x=await apiFetch('/api/auth/login',{method:'POST',body:JSON.stringify({username:user,password:pass})});API.token=x.token;localStorage.setItem('star_api_url',API.base);localStorage.setItem('star_api_token',API.token);return x}
function clearCloud(){API.token='';localStorage.removeItem('star_api_token')}
function mapCustomer(c){return {id:c.id,name:c.name,phone:c.mobile,pkg:c.packageName,fee:Number(c.monthlyFee||0),user:c.pppoeUsername||'',pass:c.pppoePassword||'',onu:c.onuId||'',expiry:c.expiryDate?String(c.expiryDate).slice(0,10):'',status:String(c.status||'ACTIVE').toLowerCase(),prevDue:Number(c.previousDue||0),runningBill:Number(c.runningBill||0),created:String(c.createdAt||'').slice(0,10)}}
async function refreshCloud(){if(!API.token)return false;const [cs,ps,hs,bt]=await Promise.all([apiFetch('/api/customers'),apiFetch('/api/billing/payments'),apiFetch('/api/billing/history'),apiFetch('/api/bkash/transactions')]);d.customers=cs.map(mapCustomer);d.payments=ps.map(x=>({id:x.id,customer:x.customerId,amount:Number(x.amount||0),date:String(x.createdAt||'').slice(0,10),month:x.month,method:x.method==='BKASH'?'bKash':x.method,txid:x.transactionId||''}));d.history=hs.map(x=>({month:x.month,label:monthLabel(x.month),closedAt:x.closedAt,income:Number(x.income||0),expense:Number(x.expense||0),net:Number(x.net||0),customers:[]}));d.bkashIncoming=bt.map(x=>({id:x.id,sender:x.sender,receiver:x.receiver,amount:Number(x.amount||0),txid:x.transactionId,status:String(x.status||'PENDING').toLowerCase(),suggestedCustomer:x.suggestedCustomerId,customer:x.matchedCustomerId,matchFound:!!x.suggestedCustomerId}));save();return true}
async function ensureCloudLogin(){if(API.token)return true;return false}
const KEY='star_communication_final_v1';
const fresh={customers:[],payments:[],expenses:[],history:[],settings:{app:'STAR COMMUNICATION',admin:'admin',password:'1234',olt:{ip:'192.168.8.100',user:'admin',vendor:'vsol',protocol:'ssh',port:22},bkash:{numbers:['01897099850']},api:'',apiKey:''}};
let d=JSON.parse(localStorage.getItem(KEY)||'null');
if(!d){try{d=JSON.parse(localStorage.getItem('ispdb')||'null')||JSON.parse(localStorage.getItem('ispdb_monthly')||'null')}catch(e){}}
d=d||fresh; d.customers=d.customers||[];d.payments=d.payments||[];d.expenses=d.expenses||[];d.history=d.history||[];d.settings=d.settings||fresh.settings;d.settings.olt=d.settings.olt||fresh.settings.olt;d.settings.olt.vendor=d.settings.olt.vendor||'vsol';d.settings.olt.protocol=d.settings.olt.protocol||'ssh';d.settings.olt.port=d.settings.olt.port||((d.settings.olt.protocol==='telnet')?23:22);d.settings.olt.ip=d.settings.olt.ip||((d.settings.olt.vendor==='vsol')?'192.168.8.100':''); d.settings.bkash=d.settings.bkash||{numbers:['01897099850']}; d.settings.bkash.numbers=[d.settings.bkash.numbers?.[0]||'01897099850']; d.customers.forEach(c=>{if(c.prevDue==null)c.prevDue=0});
let page='dashboard', opts={};
const money=n=>'৳'+Number(n||0).toLocaleString('en-US');
function pad2(n){return String(n).padStart(2,'0')}
function today(){const x=new Date();return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate())}
function month(){return today().slice(0,7)}
function monthLabel(m){const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}function ensureMonth(){
  const cur=month(), last=d._currentMonth||cur;
  if(last!==cur){
    const previous=last, prevPayments=d.payments.filter(x=>x.month===previous), prevExpenses=d.expenses.filter(x=>x.month===previous||(!x.month&&String(x.date||'').slice(0,7)===previous));
    const snap=d.customers.map(c=>{
      const paid=prevPayments.filter(x=>x.customer===c.id).reduce((a,x)=>a+(+x.amount||0),0);
      const fee=+c.fee||0;
      const runningDue=Math.max(0,fee-paid);
      return {id:c.id,name:c.name,fee,status:c.status,paid,runningDue,previousDue:+c.prevDue||0,totalDue:(+c.prevDue||0)+runningDue};
    });
    const income=prevPayments.reduce((a,x)=>a+(+x.amount||0),0)+prevExpenses.filter(x=>x.type==='income').reduce((a,x)=>a+(+x.amount||0),0);
    const expense=prevExpenses.filter(x=>x.type==='expense').reduce((a,x)=>a+(+x.amount||0),0);
    if(!d.history.some(h=>h.month===previous)) d.history.push({month:previous,label:monthLabel(previous),closedAt:new Date().toISOString(),income,expense,net:income-expense,customers:snap});
    d.customers.forEach(c=>{
      const s=snap.find(x=>x.id===c.id), paid=s?s.paid:0, fee=+c.fee||0;
      c.prevDue=s?Math.max(0,(+s.previousDue||0)+Math.max(0,fee-paid)):0;
      if(c.status!=='inactive') c.status=c.prevDue>0?'expired':'active';
    });
    d._currentMonth=cur;
    save();
  }else if(!d._currentMonth){
    d._currentMonth=cur;
    save()
  }
}

ensureMonth();

function save(){
  localStorage.setItem(KEY,JSON.stringify(d));
}

function toast(t){
  const x=document.getElementById('toast');
  x.textContent=t;
  x.classList.add('show');
  setTimeout(()=>x.classList.remove('show'),1500)
}

function openDrawer(){
  document.getElementById('shade').classList.add('show')
}

function closeDrawer(){
  document.getElementById('shade').classList.remove('show')
}

function go(p,o={}){
  page=p;
  opts=o;
  window.oltList=null;
  render();
  window.scrollTo(0,0)
}

function setNav(p){
  ['dashboard','customers','olt','billing','accounts'].forEach(x=>
    document.getElementById('nav-'+x)?.classList.toggle('on',x===p)
  )
}

function monthPaid(c){
  return d.payments.filter(x=>x.customer===c.id&&x.month===month()).reduce((s,x)=>s+x.amount,0)
}

function due(c){
  return Math.max(0,(+c.prevDue||0)+(+c.fee||0)-monthPaid(c))
}

function runningDue(c){
  return Math.max(0,(+c.fee||0)-Math.max(0,monthPaid(c)-Math.max(0,+c.prevDue||0)))
}

function paidCustomers(){
  return d.customers.filter(c=>c.status!=='inactive'&&due(c)<=0&&(+c.fee||0)>0)
}

function unpaidCustomers(){
  return d.customers.filter(c=>c.status!=='inactive'&&due(c)>0)
}

function totalPaid(){
  return d.payments.filter(x=>x.month===month()).reduce((s,x)=>s+x.amount,0)
}

function totalUnpaid(){
  return unpaidCustomers().reduce((s,c)=>s+due(c),0)
}

function totalIncome(){
  return d.payments.reduce((s,x)=>s+x.amount,0)+d.expenses.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0)
}

function totalExpense(){
  return d.expenses.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)
}

function lineGrowthData(){
  let y=String(new Date().getFullYear()),a=Array(12).fill(0);
  d.customers.forEach(c=>{
    let raw=c.connectionDate||c.joinDate||c.createdAt||c.created||c.date||'';
    let m=String(raw).slice(0,7);
    if(m.startsWith(y+'-')){
      let n=+m.slice(5,7)-1;
      if(n>=0&&n<12)a[n]++
    }
  });
  return a
}

function lineGrowthChart(){
  let a=lineGrowthData(),max=Math.max(1,...a),total=a.reduce((x,y)=>x+y,0),best=Math.max(...a),bi=a.indexOf(best);
  let names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `<div class="chart"><div class="charthead"><div><div class="charttitle">📈 Line Growth</div><div class="chartsub">Monthly new connections — ${new Date().getFullYear()}</div></div><span class="chartbadge">12 MONTHS</span></div><div class="chartgrid">${a.map((v,i)=>`<div class="barcol"><div class="barvalue">${v}</div><div class="bar" style="height:${Math.max(3,Math.round(v/max*150))}px"></div><div class="barlabel">${names[i]}</div></div>`).join('')}</div><div class="chartfoot">Total new lines: <b>${total}</b> • Best month: <b>${names[bi]}</b> (${best})</div></div>`
}

function billCollectionGrowthData(){
  let y=new Date().getFullYear(),a=Array(12).fill(0);
  d.payments.forEach(x=>{
    let m=String(x.month||x.date||'').slice(0,7);
    if(m.startsWith(y+'-')){
      let n=+m.slice(5,7)-1;
      if(n>=0&&n<12)a[n]+=Number(x.amount)||0
    }
  });
  return a
}

function billCollectionGrowthChart(){
  let a=billCollectionGrowthData(),max=Math.max(1,...a),total=a.reduce((x,y)=>x+y,0),best=Math.max(...a),bi=a.indexOf(best),names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `<div class="chart"><div class="charthead"><div><div class="charttitle">💳 Monthly Bill Collection Growth</div><div class="chartsub">Customer bill collection — ${new Date().getFullYear()}</div></div><span class="chartbadge">12 MONTHS</span></div><div class="chartgrid">${a.map((v,i)=>`<div class="barcol"><div class="barvalue">${money(v)}</div><div class="bar" title="${names[i]} collection: ${money(v)}" style="height:${Math.max(3,Math.round(v/max*150))}px;background:linear-gradient(180deg,var(--green),var(--navy))"></div><div class="barlabel">${names[i]}</div></div>`).join('')}</div><div class="chartfoot">Total collected: <b>${money(total)}</b> • Best month: <b>${names[bi]}</b> (${money(best)})</div><div class="muted" style="margin-top:6px">প্রতি মাসের customer payment অনুযায়ী collection দেখানো হচ্ছে। আগের মাসের তুলনায় growth হিসাবও payment data থেকে হবে।</div></div>`
}

function dashboard(){
  let t=d.customers.length,
      a=d.customers.filter(c=>c.status==='active').length,
      i=d.customers.filter(c=>c.status==='inactive').length,
      e=d.customers.filter(c=>c.status==='expired').length,
      p=totalPaid(),
      u=totalUnpaid(),
      inc=d.payments.filter(x=>x.date===today()).reduce((s,x)=>s+x.amount,0)+d.expenses.filter(x=>x.type==='income'&&x.date===today()).reduce((s,x)=>s+x.amount,0),
      ex=d.expenses.filter(x=>x.type==='expense'&&x.date===today()).reduce((s,x)=>s+x.amount,0);

  return `<h1 class="title">Dashboard</h1><div class="muted" style="margin:-6px 6px 12px">Billing Month: <b>${monthLabel(month())}</b> • হিসাব ১ তারিখ থেকে মাসের শেষ দিন পর্যন্ত</div><div class="grid">
  <div class="stat blue click" onclick="go('customers',{filter:'all'})"><div class="label">Total Customer</div><div class="num">${t}</div></div>
  <div class="stat green click" onclick="go('customers',{filter:'active'})"><div class="label">Active Customer</div><div class="num">${a}</div></div>
  <div class="stat slate click" onclick="go('customers',{filter:'inactive'})"><div class="label">Inactive Customer</div><div class="num">${i}</div></div>
  <div class="stat red click" onclick="go('customers',{filter:'expired'})"><div class="label">Expired</div><div class="num">${e}</div></div>
  <div class="stat purple click" onclick="go('customers',{filter:'paid'})"><div class="label">Total Paid</div><div class="num">${money(p)}</div></div>
  <div class="stat orange click" onclick="go('customers',{filter:'unpaid'})"><div class="label">Total Unpaid</div><div class="num">${money(u)}</div></div>
  <div class="stat cyan"><div class="label">Today Income</div><div class="num">${money(inc)}</div></div>
  <div class="stat pink"><div class="label">Today Expense</div><div class="num">${money(ex)}</div></div></div>${lineGrowthChart()}${billCollectionGrowthChart()}<div class="profit"><div class="muted">Net Profit / Balance</div><b>${money(inc-ex)}</b><div class="muted">Today: Income − Expense</div></div>`
  </div>${lineGrowthChart()}${billCollectionGrowthChart()}<div class="profit"><div class="muted">Net Profit / Balance</div><b>${money(inc-ex)}</b><div class="muted">Today: Income − Expense</div></div>`}

function card(c){let duev=due(c),ps=monthPaid(c);return `<div class="customer"><div class="cmain"><div class="avatar">${(c.name||'?').charAt(0).toUpperCase()}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone||'')} • ${esc(c.pkg||'')}</div></div><span class="badge ${c.status}">${c.status.toUpperCase()}</span></div><div class="detail"><span>Bill</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue||0)}</b></div><div class="detail"><span>Running Bill</span><b>${money(runningDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(duev)}</b></div><div class="detail"><span>This Month Paid</span><b>${ps?money(ps):'৳0'}</b></div><div class="actions"><button class="small wa" onclick="whatsapp(${c.id})">WhatsApp</button><button class="small call" onclick="call(${c.id})">Call</button><button class="small view" onclick="go('details',{id:${c.id}})">View</button>${duev&&c.status!=='inactive'?`<button class="small pay" onclick="payOpen(${c.id})">Pay</button>`:''}</div></div>`}

function customers(){let f=opts.filter||'all',arr=d.customers;if(f==='active')arr=arr.filter(c=>c.status==='active');if(f==='inactive')arr=arr.filter(c=>c.status==='inactive');if(f==='expired')arr=arr.filter(c=>c.status==='expired');if(f==='paid')arr=paidCustomers();if(f==='unpaid')arr=unpaidCustomers();let title={all:'Customer List',active:'Active Customers',inactive:'Inactive Customers',expired:'Expired Customers',paid:'Paid Customers',unpaid:'Unpaid Customers'}[f];return `<h1 class="title">${title}</h1><div class="row" style="margin-bottom:10px"><button class="btn green" onclick="go('add')">+ Add Customer</button><button class="btn light" onclick="go('customers',{filter:'all'})">All</button></div><input class="input searchbox" id="cs" placeholder="Search name, mobile, PPPoE username..." oninput="filterCustomers()"><div id="clist">${arr.map(card).join('')||'<div class="section empty">No customer found</div>'}</div>`}

function filterCustomers(){let q=(document.getElementById('cs').value||'').toLowerCase();let f=opts.filter||'all';let arr=d.customers.filter(c=>(f==='all'||(f==='paid'&&paidCustomers().includes(c))||(f==='unpaid'&&unpaidCustomers().includes(c))||c.status===f)&&((c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.user||'').toLowerCase().includes(q)));document.getElementById('clist').innerHTML=arr.map(card).join('')||'<div class="section empty">No customer found</div>'}

function addCustomer(){return `<button class="back" onclick="go('customers',{filter:'all'})">← Back</button><h1 class="title">Add Customer</h1><div class="section"><input id="cn" class="input" placeholder="Customer Name"><br><br><input id="cp" class="input" placeholder="Mobile Number" inputmode="tel"><br><br><div class="row"><input id="cg" class="input" placeholder="Package (e.g. 50 Mbps)"><input id="cf" class="input" type="number" placeholder="Monthly Fee"></div><br><input id="cu" class="input" placeholder="PPPoE Username"><br><br><input id="cw" class="input" placeholder="PPPoE Password" type="text"><br><br><div class="row"><input id="co" class="input" placeholder="ONU ID"><input id="cd" class="input" type="date" title="Connection Date"></div><br><input id="ce" class="input" type="date" title="Expiry Date"><br><select id="cst" class="select"><option value="active">Active</option><option value="inactive">Inactive</option><option value="expired">Expired</option></select><br><br><button class="btn green full" onclick="addCustomerSave()">Save Customer</button></div>`}

async function addCustomerSave(){let name=cn.value.trim(),phone=cp.value.trim(),pkg=cg.value.trim(),fee=+cf.value,user=cu.value.trim(),pass=cw.value,onu=co.value.trim(),connectionDate=cd.value||today(),expiry=ce.value,status=cst.value;if(!name||!fee)return alert('Customer name এবং monthly fee দিন');try{if(API.token){await apiFetch('/api/customers',{method:'POST',body:JSON.stringify({name,mobile:phone,packageName:pkg,monthlyFee:fee,pppoeUsername:user,pppoePassword:pass,onuId:onu,expiryDate:expiry||null,connectionDate,status:status.toUpperCase()})});await refreshCloud()}else{d.customers.push({id:Date.now(),name,phone,pkg,fee,user,pass,onu,expiry,status,prevDue:0,created:today(),connectionDate});save()}toast('Customer added');go('customers',{filter:'all'})}catch(e){alert(e.message)}}

function details(id){let c=d.customers.find(x=>x.id===id);if(!c)return go('customers');let hist=d.payments.filter(x=>x.customer===id).slice().reverse();return `<button class="back" onclick="go('customers',{filter:'all'})">← Back</button><h1 class="title">Customer Details</h1><div class="section"><div class="cmain"><div class="avatar">${c.name.charAt(0).toUpperCase()}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone)}</div></div><span class="badge ${c.status}">${c.status.toUpperCase()}</span></div><div class="detail"><span>Package</span><b>${esc(c.pkg)}</b></div><div class="detail"><span>Monthly Fee</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue||0)}</b></div><div class="detail"><span>Running Bill</span><b>${money(runningDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><div class="detail"><span>PPPoE Username</span><b>${esc(c.user||'—')}</b></div><div class="detail"><span>PPPoE Password</span><b>${esc(c.pass||'—')}</b></div><div class="detail"><span>ONU ID</span><b>${esc(c.onu||'—')}</b></div><div class="detail"><span>Expiry Date</span><b>${c.expiry||'—'}</b></div><div class="actions"><button class="small wa" onclick="whatsapp(${c.id})">WhatsApp</button><button class="small call" onclick="call(${c.id})">Call</button><button class="small pay" onclick="payOpen(${c.id})">Pay</button><button class="small" style="background:#fee2e2;color:#b91c1c" onclick="deleteCustomer(${c.id})">Delete</button></div></div><div class="section"><b>Payment History</b>${hist.map(x=>`<div class="detail"><span>${x.date}<br><small>${x.method||'Payment'}</small></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">No payment yet</div>'}</div>`}

function billing(){let arr=unpaidCustomers(), pending=(d.bkashIncoming||[]).filter(x=>x.status==='pending');return `<h1 class="title">Billing & Payment</h1><div class="section"><b>This Month: ${month()}</b><div class="muted">Previous Due + Running Bill = Total Due. Full payment হলে customer Active হবে.</div><br><button class="btn green full" onclick="payOpen()">+ Make Payment</button></div><div class="section"><b>📲 bKash Incoming</b><div class="muted">এই দুই নম্বরে টাকা এলে transaction <b>Pending</b> হবে এবং notification দেখাবে। কোনো payment auto-paid হবে না। তুমি Manual Paid বা Cancel করবে.</div><div class="detail"><span>bKash Number 1</span><b>${esc(d.settings.bkash.numbers[0]||'Not set')}</b></div><div class="detail"><span>bKash Number 2</span><b>${esc(d.settings.bkash.numbers[1]||'Not set')}</b></div><button class="btn dark full" onclick="openBkashTest()">+ Add Incoming bKash Transaction</button></div>${pending.length?`<div class="section"><b>⚠️ Unmatched / Pending</b>${pending.map((x,i)=>{let sc=x.suggestedCustomer?d.customers.find(c=>String(c.id)===String(x.suggestedCustomer)):null;return `<div class="customer"><div class="detail"><span>Sender</span><b>${esc(x.sender)}</b></div><div class="detail"><span>Amount</span><b>${money(x.amount)}</b></div><div class="detail"><span>Transaction ID</span><b>${esc(x.txid||'—')}</b></div><div class="detail"><span>Number Match</span><b>${sc?esc(sc.name):'No customer match'}</b></div><div class="muted" style="margin:8px 0">Pending — manual approval required. Personal transaction হলে Cancel করুন.</div><div class="row"><button class="btn green" onclick="manualMatchBkash(${i})">Manual Paid</button><button class="btn" style="background:#fee2e2;color:#b91c1c" onclick="cancelBkash(${i})">Cancel</button></div></div>`}).join('')}</div>`:''}<div class="tabs"><button class="tab on">Unpaid ${arr.length}</button><button class="tab" onclick="go('customers',{filter:'paid'})">Paid ${paidCustomers().length}</button></div>${arr.map(card).join('')||'<div class="section empty">সব bill paid 🎉</div>'}`}
