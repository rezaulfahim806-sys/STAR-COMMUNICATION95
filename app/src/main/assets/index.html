></div></div><div id="toast" class="toast"></div><div id="printArea" style="display:none"></div><script>'use strict';const KEY='star_communication_final_v2',LEGACY_KEY='star_communication_final_v1',DEF={customers:[],payments:[],expenses:[],pending:[],history:[],settings:{app:'STAR COMMUNICATION',password:'1234',merchantNumber:'',lastBillingMonth:'',cloud:{apiUrl:'https://star-communication-api.onrender.com',username:'',token:''},olt:{ip:'',user:'',password:'',vendor:'VSOL',protocol:'SSH',port:22}}};let d;try{d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY)||'null')}catch(e){d=null}if(!d)d=JSON.parse(JSON.stringify(DEF));else if(!localStorage.getItem(KEY)){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}['customers','payments','expenses','pending','history'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.settings=Object.assign({},DEF.settings,d.settings||{});d.settings.cloud=Object.assign({},DEF.settings.cloud,d.settings.cloud||{});if(!d.settings.cloud.apiUrl)d.settings.cloud.apiUrl='https://star-communication-api.onrender.com';d.settings.olt=Object.assign({},DEF.settings.olt,d.settings.olt||{});let page='dashboard',opts={},stack=[];const pad=n=>String(n).padStart(2,'0'),localDate=()=>{let x=new Date();return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())},today=()=>localDate(),month=()=>today().slice(0,7),money=n=>'৳'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cloudSyncTimer=0,cloudBusy=false;

let cloudLastUpdatedAt='';
function dataCount(x){return ['customers','payments','expenses','pending','history'].reduce((n,k)=>n+(Array.isArray(x[k])?x[k].length:0),0)}
function mergeRows(localRows,cloudRows){
 let out=[],map=new Map();
 (localRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(k){map.set(k,x)}else{out.push(x)}});
 (cloudRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(!k){out.push(x);return}let old=map.get(k);if(!old){map.set(k,x);return}let ot=Date.parse(old.updatedAt||old.createdAt||'')||0,nt=Date.parse(x.updatedAt||x.createdAt||'')||0;if(nt>ot)map.set(k,x)});
 return out.concat(Array.from(map.values()))
}
function mergeState(local,cloud){
 return {
  customers:mergeRows(local.customers,cloud.customers),
  payments:mergeRows(local.payments,cloud.payments),
  expenses:mergeRows(local.expenses,cloud.expenses),
  pending:mergeRows(local.pending,cloud.pending),
  history:mergeRows(local.history,cloud.history),
  settings:Object.assign({},local.settings||{},cloud.settings||{})
 }
}
async function cloudSync(pushLocal){
 let cfg=cloudConfig();if(!cfg.apiUrl||!cfg.token||cloudBusy)return false;
 cloudBusy=true;
 try{
  let r=await fetch(String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync',{headers:cloudHeaders()});
  if(r.status===401){if(d.settings&&d.settings.cloud){d.settings.cloud.token='';}save(false);throw new Error('Cloud session expired — please Login & Sync again')}
  if(!r.ok)throw new Error('Cloud sync read failed');
  let x=await r.json();
  cloudLastUpdatedAt=x.updatedAt||'';
  if(x.data&&Array.isArray(x.data.customers)){
    let localCount=dataCount(d),cloudCount=dataCount(x.data);
    if(cloudCount===0&&localCount>0&&!pushLocal){toast('Cloud is empty — local data kept safe');return false}
    if(localCount>0&&cloudCount>0){
      let merged=mergeState(d,x.data);
      let before=JSON.stringify({customers:x.data.customers||[],payments:x.data.payments||[],expenses:x.data.expenses||[],pending:x.data.pending||[],history:x.data.history||[]});
      d.customers=merged.customers;d.payments=merged.payments;d.expenses=merged.expenses;d.pending=merged.pending;d.history=merged.history;
      let after=JSON.stringify({customers:d.customers,payments:d.payments,expenses:d.expenses,pending:d.pending,history:d.history});
      if(after!==before) await cloudPush();
      cloudLastUpdatedAt=new Date().toISOString();
      localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));
      render();toast('Cloud + local data merged safely');
    }else{
      d.customers=x.data.customers||[];d.payments=x.data.payments||[];d.expenses=x.data.expenses||[];d.pending=x.data.pending||[];d.history=x.data.history||[];
      if(x.data.settings)d.settings=Object.assign({},d.settings,x.data.settings,{cloud:cfg});
      localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));
      render();toast('Cloud data loaded');
    }
  }else if(pushLocal){await cloudPush()}
  return true
 }catch(e){try{toast('Cloud sync: '+e.message)}catch(_){ }return false}finally{cloudBusy=false}
}
async function cloudPush(){
 let cfg=cloudConfig();if(!cfg.apiUrl||!cfg.token)throw new Error('Cloud login required — please Login & Sync again');
 const url=String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync';
 const payload=()=>({updatedAt:cloudLastUpdatedAt||'',data:{customers:d.customers,payments:d.payments,expenses:d.expenses,pending:d.pending,history:d.history,settings:(()=>{let s=JSON.parse(JSON.stringify(d.settings||{}));s.cloud={apiUrl:cfg.apiUrl,username:cfg.username};if(s.olt&&typeof s.olt==='object')s.olt.password='';return s})()}});
 let r=await fetch(url,{method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload())});
 if(r.status===401)throw new Error('Cloud session expired — please Login & Sync again');
 if(r.status===409){
  let conflict=await r.json().catch(()=>({}));
  if(conflict.data&&Array.isArray(conflict.data.customers)){
   let merged=mergeState(d,conflict.data);
   d.customers=merged.customers;d.payments=merged.payments;d.expenses=merged.expenses;d.pending=merged.pending;d.history=merged.history;
   d.settings=Object.assign({},d.settings||{},conflict.data.settings||{},{cloud:cfg});
   cloudLastUpdatedAt=conflict.updatedAt||'';
   localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));
   r=await fetch(url,{method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload())});
  }else throw new Error('Cloud data changed on another phone. Please sync again.');
 }
 if(!r.ok){let err=await r.json().catch(()=>({}));throw new Error(err.error||('Cloud sync upload failed (HTTP '+r.status+')'))}

async function saveEditedCustomer(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;let name=document.getElementById('en').value.trim(),phone=document.getElementById('ep').value.trim();if(!name||!phone){toast('Name and mobile required');return}Object.assign(c,{name:name,phone:phone,address:document.getElementById('ea').value.trim(),pkg:document.getElementById('epkg').value.trim(),fee:Number(document.getElementById('efee').value||0),pppoe:document.getElementById('epp').value.trim(),pppoePassword:document.getElementById('epw').value,onu:document.getElementById('eonu').value.trim(),connectionDate:document.getElementById('ecd').value||c.connectionDate||today(),expiry:document.getElementById('eex').value||'',prevDue:Number(document.getElementById('eprev').value||0),allowPackageChoice:document.getElementById('eallowpackages').checked,status:document.getElementById('est').value,updatedAt:new Date().toISOString()});save(false);closeSheet();render();if(cloudConfig().token){try{await cloudPush();toast('Customer updated and synced to cloud')}catch(e){toast('Saved on this phone, but cloud sync failed. Reconnect and retry.');console.error('Customer permission cloud sync failed',e)}}else{toast('Saved on this phone only. Cloud login required for payment link permission.')}}
function payCustomer(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;openSheet(`<h3>Customer Bill Payment</h3><div class="detail"><span>Customer</span><b>${esc(c.name)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Current Bill</span><b>${money(billDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><input id="amt" class="input" type="number" value="${due(c)}" placeholder="Payment amount"><input id="ref" class="input" placeholder="Reference / note"><button class="btn green full" onclick="savePayment('${c.id}')">Confirm Paid</button>`)}function savePayment(id){let amount=Number(document.getElementById('amt')?.value||0);if(!Number.isFinite(amount)||amount<=0){toast('Enter a valid payment amount');return}let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;let before=due(c),prevBefore=Math.max(0,Number(c.prevDue||0));if(amount>before){toast('Payment cannot exceed total due');return}let prevPaid=Math.min(prevBefore,amount),currentPaid=amount-prevPaid;if(prevPaid>0)c.prevDue=Math.max(0,prevBefore-prevPaid);if(currentPaid>0)d.payments.push({id:Date.now().toString(),customer:id,amount:currentPaid,date:today(),month:month(),status:'paid',source:'manual',ref:document.getElementById('ref')?.value||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});if(prevPaid>0)d.payments.push({id:(Date.now()+1).toString(),customer:id,amount:prevPaid,date:today(),month:'previous-due',status:'paid',source:'manual-previous-due',ref:document.getElementById('ref')?.value||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});if(c.status==='expired'&&amount>0){c.status='active';if(c.expiry&&c.expiry<today()){let dt=new Date(today()+'T12:00:00');dt.setMonth(dt.getMonth()+1);c.expiry=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}}activateAfterFullPayment(c);save();try{if(due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}closeSheet();toast('Payment recorded');render()}function details(){let c=d.customers.find(x=>String(x.id)===String(opts.id));if(!c){go('customers');return}let hist=d.payments.filter(x=>String(x.customer)===String(c.id)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `<h1 class="title">Customer Details</h1><button class="btn light" onclick="appBack()">← Back</button><div class="customer"><div class="cmain"><div class="avatar">${esc((c.name||'?')[0])}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone)}</div></div><span class="badge ${c.status}">${c.status}</span></div><div class="detail"><span>Connection Date</span><b>${esc(c.connectionDate||'—')}</b></div><div class="detail"><span>Expiry Date</span><b>${esc(c.expiry||'—')}</b></div><div class="detail"><span>Address</span><b>${esc(c.address)}</b></div><div class="detail"><span>Package</span><b>${esc(c.pkg)}</b></div><div class="detail"><span>Monthly</span><b>${money(c.fee)}</b></div><div class="detail"><span>PPPoE Username</span><b>${esc(c.pppoe||'—')}</b></div><div class="detail"><span>PPPoE Password</span><b>${esc(c.pppoePassword||'—')}</b></div><div class="detail"><span>ONU MAC</span><b>${esc(c.onu||'—')}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Running Bill</span><b>${money(billDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><div class="actions"><button class="small call" onclick="callCustomer('${esc(c.phone)}')">📞 Call</button><button class="small wa" onclick="waCustomer('${esc(c.phone)}')">WhatsApp</button><button class="small pay" onclick="payCustomer('${c.id}')">Customer Bill Payment</button></div></div><div class="section"><h3>Payment History</h3>${hist.length?hist.map(x=>`<div class="detail"><span>${esc(x.date)} • ${esc(x.month||'')} • ${esc(x.source||'manual')}</span><b>${money(x.amount)}</b></div>`).join(''):'<div class="muted">No payments yet.</div>'}</div>`}function callCustomer(n){n=String(n||'').replace(/[^0-9+]/g,'');if(n)location.href='tel:'+n}function waCustomer(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('0'))x='880'+x.slice(1);if(x.length<10){toast('Valid WhatsApp number required');return}location.href='https://wa.me/'+x}function billing(){let p=d.pending.filter(x=>x.status==='pending');return `<h1 class="title">Payment Verification</h1><div class="section"><h3>🔗 Customer Payment Links</h3><div class="muted">Create a payment link from the customer card and send it to the customer. Verified customer payments will appear below as pending.</div><input id="payCustomerSearch" class="input" placeholder="🔎 Search customer name or phone" oninput="filterPaymentCustomers()" style="margin-top:10px"><select id="payselect" class="select"><option value="">Select customer</option>${d.customers.map(c=>`<option value="${c.id}">${esc(c.name)} • ${esc(c.phone)} • Due ${money(due(c))}</option>`).join('')}</select><button class="btn green full" onclick="billingCreateLink()">Create Customer Payment Link</button><button class="btn dark full" style="margin-top:7px" onclick="billingManualPaid()">＋ Manual Bill Paid</button><button class="btn light full" style="margin-top:7px" onclick="managePackages()">📦 Manage Packages</button></div><div class="section"><h3>⏳ Pending Customer Payments</h3>${p.length?p.map(x=>`<div class="customer pending"><div class="name">${money(x.amount)} • ${esc(x.sender||'Customer')}</div><div class="muted">${esc(x.date)} • Customer: ${esc(x.customerName||'Not matched')}</div><div class="actions"><button class="small pay" onclick="confirmPending('${x.id}')">Verify & Mark Paid</button></div></div>`).join(''):'<div class="muted">No pending customer payments.</div>'}</div>`}function billingManualPaid(){let id=document.getElementById('payselect')?.value;if(!id){toast('Select a customer');return}let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;openSheet(`<h3>Manual Bill Paid</h3><div class="detail"><span>Customer</span><b>${esc(c.name)} • ${esc(c.phone)}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><input id="manualPaidAmount" class="input" type="number" min="1" value="${due(c)}" placeholder="Paid amount"><input id="manualPaidRef" class="input" placeholder="Cash / transaction reference (optional)"><button class="btn green full" onclick="saveManualBillPaid('${c.id}')">Confirm Manual Paid</button>`)}function saveManualBillPaid(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;let el=document.getElementById('manualPaidAmount'),amount=Number(el?.value||0);if(!Number.isFinite(amount)||amount<=0){toast('Enter a valid amount');return}if(amount>due(c)){toast('Amount cannot exceed current total due');return}let ref=document.getElementById('manualPaidRef')?.value||'';d.payments.push({id:Date.now().toString(),customer:id,amount,date:today(),month:month(),status:'paid',source:'manual',ref,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});let remain=Math.max(0,due(c)-amount);if(Number(c.prevDue||0)>0)c.prevDue=Math.max(0,Number(c.prevDue||0)-amount);if(due(c)<=0&&c.status==='expired')c.status='active';save();try{if(due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}closeSheet();toast('Manual payment recorded');render()}function managePackages(){let ps=Array.isArray(d.settings.packages)?d.settings.packages:[];openSheet(`<h3>📦 Manage Payment Packages</h3><div class="muted">Add your own package name/speed and monthly price. New payment links will include this latest list.</div><div id="packageRows">${ps.map((p,i)=>`<div class="detail"><span>${esc(p.speed)}</span><b>${money(p.price)}</b><button class="small dark" onclick="removePackage(${i})">Delete</button></div>`).join('')||'<div class="muted">No packages added yet.</div>'}</div><input id="newPackageSpeed" class="input" placeholder="Package name / Mbps"><input id="newPackagePrice" class="input" type="number" min="1" placeholder="Monthly price (৳)"><button class="btn green full" onclick="addPackage()">＋ Add Package</button>`)}function addPackage(){let speed=document.getElementById('newPackageSpeed')?.value.trim(),price=Number(document.getElementById('newPackagePrice')?.value||0);if(!speed||price<=0){toast('Enter package name and price');return}if(!Array.isArray(d.settings.packages))d.settings.packages=[];d.settings.packages.push({speed,price});save();managePackages();toast('Package added')}function removePackage(i){if(!Array.isArray(d.settings.packages))return;d.settings.packages.splice(i,1);save();managePackages();toast('Package removed')}
function filterPaymentCustomers(){let search=document.getElementById("payCustomerSearch"),select=document.getElementById("payselect");if(!search||!select)return;let q=search.value.trim().toLowerCase(),selected=select.value;let list=d.customers.filter(c=>(String(c.name||"")+" "+String(c.phone||"")+" "+String(c.address||"")).toLowerCase().includes(q));select.innerHTML='<option value="">Select customer ( '+list.length+' )</option>'+list.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} • ${esc(c.phone)} • Due ${money(due(c))}</option>`).join("");if(list.some(c=>String(c.id)===selected))select.value=selected}function billingCreateLink(){let id=document.getElementById('payselect')?.value;if(!id){toast('Select a customer');return}customerPaymentLink(id)}function billingPaySelected(){let id=payselect.value;if(!id){toast('Select a customer');return}payCustomer(id)}function addIncoming(){openSheet(`<h3>Incoming Merchant Transaction</h3><input id="sender" class="input" placeholder="Sender bKash number"><input id="inamt" class="input" type="number" placeholder="Amount"><input id="tid" class="input" placeholder="Transaction ID"><button class="btn full" onclick="saveIncoming()">Save as Pending</button>`)}function normalize(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('880'))x='0'+x.slice(3);return x}function saveIncoming(){let s=normalize(sender.value),c=d.customers.find(c=>normalize(c.phone).slice(-10)===s.slice(-10));d.pending.push({id:Date.now().toString(),sender:s,amount:Number(inamt.value||0),transactionId:tid.value||'',date:today(),status:'pending',customer:c?c.id:'',customerName:c?c.name:''});save();closeSheet();toast(c?'Matched customer — Pending':'Saved Pending');render()}function confirmPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(!p)return;let c=p.customer?d.customers.find(x=>String(x.id)===String(p.customer)):null;if(!c){let s=prompt('Customer mobile for manual match:');if(!s)return;c=d.customers.find(x=>normalize(x.phone).slice(-10)===normalize(s).slice(-10));if(!c){toast('Customer not found');return}p.customer=c.id;p.customerName=c.name}d.payments.push({id:Date.now().toString(),customer:c.id,amount:Number(p.amount||0),date:today(),month:month(),status:'paid',source:'merchant',ref:p.transactionId||''});p.status='paid';p.confirmedAt=today();save();try{if(c&&due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}toast('Manual Paid confirmed');render()}function cancelPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(p){p.status='cancelled';save();toast('Transaction cancelled');render()}}function analytics(){return `<h1 class="title">Growth & Analytics</h1><div class="chart"><b>🆕 New Connection Growth</b>${bars(newGrowth(),'greenbar')}</div><div class="chart"><b>💳 Monthly Bill Collection Growth</b>${bars(monthlyBills())}</div><div class="chart"><b>🏢 Company Growth</b><div class="muted">Income − expenses</div>${bars(companyGrowth())}</div>`}function accounts(){return `<h1 class="title">Accounts</h1><div class="moneygrid"><div class="moneybox"><span class="muted">Total Income</span><b>${money(totalIncome())}</b></div><div class="moneybox"><span class="muted">Total Expense</span><b>${money(totalExpense())}</b></div><div class="moneybox"><span class="muted">Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><div class="detail"><span>Bill Collection Income</span><b>${money(billIncome())}</b></div><div class="detail"><span>Other Income</span><b>${money(otherIncome())}</b></div><div class="detail"><span>Total Income</span><b>${money(totalIncome())}</b></div><div class="detail"><span>Total Expense</span><b>${money(totalExpense())}</b></div><div class="detail"><span>Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><button class="btn green full" onclick="addIncome()">＋ Add Income</button><button class="btn red full" style="margin-top:7px" onclick="addExpense()">＋ Add Expense</button></div>`}function addIncome(){openSheet(`<h3>Add Income</h3><input id="ie" class="input" type="number" placeholder="Amount"><input id="inote" class="input" placeholder="Income source / note"><button class="btn green full" onclick="saveOtherIncome()">Add Income</button>`)}function saveOtherIncome(){let v=Number(ie.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'income',amount:v,date:today(),note:inote.value||''});save();closeSheet();toast('Income added');render()}function addExpense(){openSheet(`<h3>Add Expense</h3><input id="ee" class="input" type="number" placeholder="Amount"><input id="enote" class="input" placeholder="Expense note"><button class="btn red full" onclick="saveExpense()">Add Expense</button>`)}function saveExpense(){let v=Number(ee.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'expense',amount:v,date:today(),note:enote.value||''});save();closeSheet();toast('Expense added');render()}function monitor(){return `<h1 class="title">Live Monitoring</h1><div class="section"><h3>📡 OLT Status</h3><div class="kpi"><span>Status</span><b>Not Connected</b></div><div class="kpi"><span>Online Customers</span><b>${d.customers.filter(c=>c.status==='active').length}</b></div><div class="kpi"><span>Offline / Inactive</span><b>${d.customers.filter(c=>c.status!=='active').length}</b></div><button class="btn dark full" onclick="openSettings()">Configure OLT</button></div><div class="section"><div class="muted">OLT IP, username, password and vendor are prepared in Settings. Actual live OLT API/SSH/SNMP connection still needs vendor-specific backend integration.</div></div>`}function openIspAccount(){
 closeDrawer();
 let cfg=d.settings&&d.settings.cloud||{};

 <div class="section" style="padding:10px;margin:0 0 10px">
