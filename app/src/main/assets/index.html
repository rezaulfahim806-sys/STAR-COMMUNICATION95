let cloudLastUpdatedAt='';
function dataCount(x){return ['customers','payments','expenses','pending','history'].reduce((n,k)=>n+(Array.isArray(x[k])?x[k].length:0),0)}
function mergeRows(localRows,cloudRows){
 let out=[],map=new Map();
 (localRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(k){map.set(k,x)}else{out.push(x)}});
 (cloudRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(!k){out.push(x);return}let old=map.get(k);if(!old){map.set(k,x);return}let ot=Date.parse(old.updatedAt||old.createdAt||'')||0,nt=Date.parse(x.updatedAt||x.createdAt||'')||0;let cloudPayment=!!(x.baniqOrderId||x.source==='baniq'||x.lastPaymentSource==='baniq'),oldPayment=!!(old.baniqOrderId||old.source==='baniq'||old.lastPaymentSource==='baniq');if((cloudPayment&&!oldPayment)||(cloudPayment&&oldPayment&&nt>=ot)||(!oldPayment&&nt>ot))map.set(k,x)});
 return out.concat(Array.from(map.values()))
}
function mergeState(local,cloud){
 return {
  customers:mergeRows(local.customers,cloud.customers),
  payments:mergeRows(local.payments,cloud.payments),
  expenses:mergeRows(local.expenses,cloud.expenses),
  pending:mergeRows(local.pending,cloud.pending),
  history:mergeRows(local.history,cloud.history),
  settings:Object.assign({},local.settings||{},cloud.settings||{})

}
async function cloudSync(pushLocal){
 let cfg=cloudConfig();if(!cfg.apiUrl||!cfg.token||cloudBusy)return false;
 cloudBusy=true;
 try{
  let r=await fetch(String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync',{headers:cloudHeaders()});
  if(r.status===401){if(d.settings&&d.settings.cloud){d.settings.cloud.token='';}save(false);throw new Error('Cloud session expired — please Login & Sync again')}
  if(!r.ok)throw new Error('Cloud sync read failed');
  let x=await r.json();
  cloudLastUpdatedAt=x.updatedAt||'';
  if(x.data&&Array.isArray(x.data.customers)){
    let localCount=dataCount(d),cloudCount=dataCount(x.data);
    if(cloudCount===0&&localCount>0){if(pushLocal){await cloudPush();return true}toast('Cloud is empty — local data kept safe');return false}
    if(localCount>0&&cloudCount>0){
      let merged=mergeState(d,x.data);
      let before=JSON.stringify({customers:x.data.customers||[],payments:x.data.payments||[],expenses:x.data.expenses||[],pending:x.data.pending||[],history:x.data.history||[]});
      d.customers=merged.customers;d.payments=merged.payments;d.expenses=merged.expenses;d.pending=merged.pending;d.history=merged.history;
      let after=JSON.stringify({customers:d.customers,payments:d.payments,expenses:d.expenses,pending:d.pending,history:d.history});
      if(after!==before) await cloudPush();
      cloudLastUpdatedAt=new Date().toISOString();

    }else{
      d.customers=x.data.customers||[];d.payments=x.data.payments||[];d.expenses=x.data.expenses||[];d.pending=x.data.pending||[];d.history=x.data.history||[];
      if(x.data.settings)d.settings=Object.assign({},d.settings,x.data.settings,{cloud:cfg});
      localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));
      render();toast('Cloud data loaded');
    }
  }else if(pushLocal){await cloudPush()}
  return true
 }catch(e){try{toast('Cloud sync: '+e.message)}catch(_){ }return false}
}
async function cloudPush(){
 let cfg=cloudConfig();if(!cfg.apiUrl||!cfg.token)return false;
 let r=await fetch(String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync',{method:'POST',headers:cloudHeaders(),body:JSON.stringify({updatedAt:cloudLastUpdatedAt||'',data:{customers:d.customers,payments:d.payments,expenses:d.expenses,pending:d.pending,history:d.history,settings:(()=>{let s=JSON.parse(JSON.stringify(d.settings||{}));s.cloud={apiUrl:cfg.apiUrl,username:cfg.username};if(s.olt&&typeof s.olt==='object')s.olt.password='';return s})()}})});

function payCustomer(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;openSheet(`<h3>${isExpiredCustomer(c)?'Expired Customer — Manual Payment':'Customer Bill Payment'}</h3><div class="detail"><span>Status</span><b>${esc(customerStatus(c).toUpperCase())}</b></div><div class="detail"><span>Customer</span><b>${esc(c.name)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Current Bill</span><b>${money(billDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><input id="amt" class="input" type="number" value="${due(c)||Number(c.fee||0)}" placeholder="Payment amount"><input id="ref" class="input" placeholder="Reference / note"><button class="btn green full" onclick="savePayment('${c.id}')">Confirm Paid</button>`)}function savePayment(id){let amount=Number(amt.value||0);if(amount<=0){toast('Enter a valid payment amount');return}let c=d.customers.find(x=>String(x.id)===String(id));let beforeDue=c?due(c):0;d.payments.push({id:Date.now().toString(),customer:id,amount,date:today(),month:month(),status:'paid',source:'manual',ref:ref.value||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});if(c){c.prevDue=Math.max(0,Number(c.prevDue||0)-amount);if(amount+0.01>=beforeDue){c.status='active';let base=c.expiry&&c.expiry>=today()?new Date(c.expiry+'T12:00:00'):new Date();if(Number.isNaN(base.getTime()))base=new Date();base.setMonth(base.getMonth()+1);c.expiry=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0')+'-'+String(base.getDate()).padStart(2,'0');c.updatedAt=new Date().toISOString()}}save();try{if(c&&due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}closeSheet();toast('Bill Paid');render()}function details(){let c=d.customers.find(x=>String(x.id)===String(opts.id));if(!c){go('customers');return}let hist=d.payments.filter(x=>String(x.customer)===String(c.id)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `<h1 class="title">Customer Details</h1><button class="btn light" onclick="appBack()">← Back</button><div class="customer"><div class="cmain"><div class="avatar">${esc((c.name||'?')[0])}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted"><b>${esc(c.clientCode||'')}</b> • ${esc(c.phone)}</div></div><span class="badge ${c.status}">${c.status}</span></div><div class="detail"><span>Connection Date</span><b>${esc(c.connectionDate||'—')}</b></div><div class="detail"><span>Expiry Date</span><b>${esc(c.expiry||'—')}</b></div><div class="detail"><span>Address</span><b>${esc(c.address)}</b></div><div class="detail"><span>Package</span><b>${esc(c.pkg)}</b></div><div class="detail"><span>Monthly</span><b>${money(c.fee)}</b></div><div class="detail"><span>Next Month Expected Bill</span><b>${money(expectedMonthlyBill(c))}</b></div><div class="detail"><span>PPPoE Username</span><b>${esc(c.pppoe||'—')}</b></div><div class="detail"><span>PPPoE Password</span><b>${esc(c.pppoePassword||'—')}</b></div><div class="detail"><span>ONU MAC</span><b>${esc(c.onu||'—')}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Running Bill</span><b>${money(billDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><div class="actions"><button class="small call" onclick="callCustomer('${esc(c.phone)}')">📞 Call</button><button class="small wa" onclick="waCustomer('${esc(c.phone)}')">WhatsApp</button><button class="small pay" onclick="payCustomer('${c.id}')">Customer Bill Payment</button></div></div><div class="section"><h3>Payment History</h3>${hist.length?hist.map(x=>`<div class="detail"><span>${esc(x.date)} • ${esc(x.month||'')} • ${esc(x.source||'manual')}</span><b>${money(x.amount)}</b></div>`).join(''):'<div class="muted">No payments yet.</div>'}</div>`}function callCustomer(n){n=String(n||'').replace(/[^0-9+]/g,'');if(n)location.href='tel:'+n}function waCustomer(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('0'))x='880'+x.slice(1);if(x.length<10){toast('Valid WhatsApp number required');return}location.href='https://wa.me/'+x}function expectedbills(){fix();let list=(d.customers||[]).filter(c=>expectedMonthlyBill(c)>0).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));return `<h1 class="title">Monthly Expected Bill</h1><div class="section"><div class="detail"><span>Current month (${month()})</span><b>${money(expectedMonthlyTotal())}</b></div><div class="detail"><span>Next month (${expectedNextMonth()})</span><b>${money(expectedMonthlyTotal())}</b></div><div class="muted">Forecast uses saved monthly fee for each active customer. If a customer changes package/fee or disconnects, the forecast updates automatically.</div></div><div class="section"><h3>Customer-wise Expected Bill (${list.length})</h3>${list.length?list.map(c=>`<div class="detail"><span><b>${esc(c.clientCode||'')}</b> ${esc(c.name||'')}<div class="muted">${esc(c.phone||'')} • ${esc(c.pkg||'')}</div></span><b>${money(expectedMonthlyBill(c))}</b></div>`).join(''):'<div class="muted">No billable active customers yet.</div>'}</div><button class="btn light full" onclick="go('customers')">Open Customers</button>`}function billing(){let p=d.pending.filter(x=>x.status==='pending');return `<h1 class="title">Billing & Merchant</h1><div class="section"><h3>💳 Customer Bill Payment</h3><div class="muted">Pay any customer's current bill or previous due directly from this section.</div><select id="payselect" class="select"><option value="">Select customer</option>${d.customers.map(c=>`<option value="${c.id}">${esc(c.name)} • ${esc(c.phone)} • Due ${money(due(c))}</option>`).join('')}</select><button class="btn green full" onclick="billingPaySelected()">Customer Bill Payment</button></div><div class="section"><h3>📅 This Month</h3><div class="kpi"><span>Paid Customers</span><b>${d.customers.filter(c=>due(c)<=0).length}</b></div><div class="kpi"><span>Unpaid Customers</span><b>${d.customers.filter(c=>due(c)>0).length}</b></div><button class="btn light full" onclick="go('customers',{filter:'unpaid'})">View Unpaid Customer List</button><button class="btn light full" style="margin-top:7px" onclick="go('customers',{filter:'previous'})">View Previous Due</button></div><div class="section"><h3>Company Merchant Number</h3><div class="muted">Customer payments are marked paid only after the server verifies the completed bKash transaction and matching amount. Live checkout requires valid bKash credentials in Render environment settings.</div><div class="detail"><span>Merchant</span><b>${esc(d.settings.merchantNumber||'Not set')}</b></div><button class="btn dark full" onclick="openSettings()">⚙️ Merchant Settings</button></div><div class="section"><h3>Pending Incoming Payments</h3>${p.length?p.map(x=>`<div class="customer pending"><div class="name">${money(x.amount)} • ${esc(x.sender||'Unknown')}</div><div class="muted">${esc(x.date)} • Matched: ${esc(x.customerName||'Not matched')}</div><div class="actions"><button class="small pay" onclick="verifyPending('${x.id}')">Verify API</button><button class="small view" onclick="confirmPending('${x.id}')">Manual Paid</button><button class="small view" onclick="cancelPending('${x.id}')">Cancel</button></div></div>`).join(''):'<div class="muted">No pending transactions.</div>'}</div><div class="section"><button class="btn green full" onclick="addIncoming()">＋ Add Incoming Transaction</button><div class="muted" style="margin-top:7px">Verify API checks the configured provider response and matching full bill amount before marking a transaction paid. Manual Paid remains a separate manual action.</div></div>`}function billingPaySelected(){let id=payselect.value;if(!id){toast('Select a customer');return}payCustomer(id)}function addIncoming(){openSheet(`<h3>Incoming Merchant Transaction</h3><input id="sender" class="input" placeholder="Sender bKash number"><input id="inamt" class="input" type="number" placeholder="Amount"><input id="tid" class="input" placeholder="Transaction ID"><button class="btn full" onclick="saveIncoming()">Save as Pending</button>`)}function normalize(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('880'))x='0'+x.slice(3);return x}function saveIncoming(){let s=normalize(sender.value),c=d.customers.find(c=>normalize(c.phone).slice(-10)===s.slice(-10));d.pending.push({id:Date.now().toString(),sender:s,amount:Number(inamt.value||0),transactionId:tid.value||'',date:today(),status:'pending',customer:c?c.id:'',customerName:c?c.name:''});save();closeSheet();toast(c?'Matched customer — Pending':'Saved Pending');render()}async function verifyPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(!p||p.status!=='pending')return;let c=p.customer?d.customers.find(x=>String(x.id)===String(p.customer)):null;if(!c){toast('Match this transaction to a customer first');return}let expected=due(c);if(expected<=0||Math.abs(Number(p.amount||0)-expected)>0.01){toast('Auto verification requires the exact full bill amount: '+money(expected));return}let cfg=cloudConfig();if(!cfg.token||!cfg.apiUrl){toast('Login to the company cloud account first');return}if(!p.transactionId){toast('Transaction ID is required');return}try{toast('Checking payment with provider API…');let r=await fetch(String(cfg.apiUrl).replace(/\/$/, '')+'/api/billing/verify-payment',{method:'POST',headers:cloudHeaders(),body:JSON.stringify({customerId:String(c.id),transactionId:String(p.transactionId).trim(),amount:Number(p.amount)})});let x={};try{x=await r.json()}catch(e){}if(!r.ok||!x.verified)throw new Error(x.error||'Provider could not verify this payment');if(d.payments.some(z=>String(z.ref||'')===String(p.transactionId)&&z.status==='paid')){p.status='paid';save();render();toast('This transaction is already recorded');return}d.payments.push({id:Date.now().toString(),customer:c.id,amount:Number(p.amount),date:today(),month:month(),status:'paid',source:'verified-api',ref:String(p.transactionId),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});p.status='paid';p.confirmedAt=today();p.verification='api';p.providerStatus=x.providerStatus||'verified';if(c){c.status='active';let base=c.expiry&&c.expiry>=today()?new Date(c.expiry+'T12:00:00'):new Date();if(Number.isNaN(base.getTime()))base=new Date();base.setMonth(base.getMonth()+1);c.expiry=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0')+'-'+String(base.getDate()).padStart(2,'0');c.updatedAt=new Date().toISOString()}save();try{await cloudPush()}catch(e){}closeSheet();toast('Payment verified — bill marked PAID');render()}catch(e){toast(e.message||'Payment verification failed')}}function confirmPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(!p)return;let c=p.customer?d.customers.find(x=>String(x.id)===String(p.customer)):null;if(!c){let s=prompt('Customer mobile for manual match:');if(!s)return;c=d.customers.find(x=>normalize(x.phone).slice(-10)===normalize(s).slice(-10));if(!c){toast('Customer not found');return}p.customer=c.id;p.customerName=c.name}d.payments.push({id:Date.now().toString(),customer:c.id,amount:Number(p.amount||0),date:today(),month:month(),status:'paid',source:'merchant',ref:p.transactionId||''});p.status='paid';p.confirmedAt=today();save();try{if(c&&due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}toast('Manual Paid confirmed');render()}function cancelPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(p){p.status='cancelled';save();toast('Transaction cancelled');render()}}function analytics(){return `<h1 class="title">Growth & Analytics</h1><div class="chart"><b>🆕 New Connection Growth</b>${bars(newGrowth(),'greenbar')}</div><div class="chart"><b>💳 Monthly Bill Collection Growth</b>${bars(monthlyBills())}</div><div class="chart"><b>🏢 Company Growth</b><div class="muted">Income − expenses</div>${bars(companyGrowth())}</div>`}function accounts(){return `<h1 class="title">Accounts</h1><div class="moneygrid"><div class="moneybox"><span class="muted">Total Income</span><b>${money(totalIncome())}</b></div><div class="moneybox"><span class="muted">Total Expense</span><b>${money(totalExpense())}</b></div><div class="moneybox"><span class="muted">Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><div class="detail"><span>Bill Collection Income</span><b>${money(billIncome())}</b></div><div class="detail"><span>Other Income</span><b>${money(otherIncome())}</b></div><div class="detail"><span>Total Income</span><b>${money(totalIncome())}</b></div><div class="detail"><span>Total Expense</span><b>${money(totalExpense())}</b></div><div class="detail"><span>Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><button class="btn green full" onclick="addIncome()">＋ Add Income</button><button class="btn red full" style="margin-top:7px" onclick="addExpense()">＋ Add Expense</button></div>`}function addIncome(){openSheet(`<h3>Add Income</h3><input id="ie" class="input" type="number" placeholder="Amount"><input id="inote" class="input" placeholder="Income source / note"><button class="btn green full" onclick="saveOtherIncome()">Add Income</button>`)}function saveOtherIncome(){let v=Number(ie.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'income',amount:v,date:today(),note:inote.value||''});save();closeSheet();toast('Income added');render()}function addExpense(){openSheet(`<h3>Add Expense</h3><input id="ee" class="input" type="number" placeholder="Amount"><input id="enote" class="input" placeholder="Expense note"><button class="btn red full" onclick="saveExpense()">Add Expense</button>`)}function saveExpense(){let v=Number(ee.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'expense',amount:v,date:today(),note:enote.value||''});save();closeSheet();toast('Expense added');render()}function monitor(){return `<h1 class="title">Live Monitoring</h1><div class="section"><h3>📡 OLT Status</h3><div class="kpi"><span>Status</span><b>Not Connected</b></div><div class="kpi"><span>Online Customers</span><b>${d.customers.filter(c=>c.status==='active').length}</b></div><div class="kpi"><span>Offline / Inactive</span><b>${d.customers.filter(c=>c.status!=='active').length}</b></div><button class="btn dark full" onclick="openSettings()">Configure OLT</button></div><div class="section"><div class="muted">OLT IP, username, password and vendor are prepared in Settings. Actual live OLT API/SSH/SNMP connection still needs vendor-specific backend integration.</div></div>`}function openIspAccount(){

eateCustomerPdf(JSON.stringify({title:title,rows:rows}));return}if(window.AndroidBridge&&typeof AndroidBridge.printPage==='function'){let p=document.getElementById('printArea');p.innerHTML='<div style="font-family:Arial,sans-serif;padding:10px;color:#111"><div style="text-align:center;border-bottom:2px solid #123c70;padding:0 0 10px;margin-bottom:12px"><h1 style="margin:0;color:#123c70;font-size:22px">STAR COMMUNICATION</h1><h2 style="margin:6px 0 0;font-size:16px">'+esc(title)+'</h2><div style="font-size:10px;color:#555">Generated: '+today()+' · Total: '+rows.length+'</div></div><table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:9px"><thead><tr>'+['#','Customer','Mobile','Package','Fee','Expiry','Prev Due','Running Bill','Total Due','Status'].map(function(h){return '<th style="background:#eaf1fb;border:1px solid #9aa9bc;padding:5px;text-align:left;overflow-wrap:anywhere">'+h+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr style="page-break-inside:avoid;break-inside:avoid">'+[r.serial,esc(r.name),esc(r.phone),esc(r.pkg),money(r.fee),esc(r.expiry),money(r.prevDue),money(r.runningBill),money(r.totalDue),esc(r.status)].map(function(v){return '<td style="border:1px solid #aab4c2;padding:5px;vertical-align:top;overflow-wrap:anywhere;word-break:break-word">'+v+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table><div style="margin-top:10px;font-size:9px;color:#555">STAR COMMUNICATION · Customer Report</div></div>';p.style.display='block';setTimeout(function(){AndroidBridge.printPage(title);setTimeout(function(){p.style.display='none'},5000)},100);return}window.print()}catch(e){try{toast('PDF error: '+e.message)}catch(_){alert('PDF error')}}}function loginScreen(){document.getElementById('content').innerHTML=`<div style="padding:26px 16px 100px"><div class="section" style="margin-top:35px;padding:22px"><div style="text-align:center"><img src="logo.svg" style="width:72px;height:72px;border-radius:18px"><h1 style="margin:12px 0 3px;color:#0b2145">STAR COMMUNICATION</h1><div class="muted">Secure Account Login</div></div><input id="loginApi" class="input" placeholder="HTTPS Backend API URL" value="${esc(d.settings.cloud?.apiUrl||'https://star-communication-api.onrender.com')}"><input id="loginUser" class="input" placeholder="Username" value="${esc(d.settings.cloud?.username||'')}"><input id="loginPass" class="input" type="password" placeholder="Password"><button class="btn green full" onclick="doStartupLogin()">🔐 Login & Open App</button><button class="btn dark full" style="margin-top:8px" onclick="openIspAccount()">🏢 Create Company Account</button><div class="muted" style="margin-top:8px;text-align:center">New company registrations may need administrator approval before login.</div><div class="muted" style="margin-top:8px;text-align:center">Use the same company account on multiple phones.</div><div id="loginMsg" class="muted" style="margin-top:8px;text-align:center"></div></div></div>`}

async function customerPaymentLink(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c){toast('Customer not found');return}let cloud=d.settings&&d.settings.cloud||{},cfg=cloudConfig(),company=String(cloud.owner||cloud.username||cfg.username||'').trim().toLowerCase();if(!cfg.apiUrl||!cfg.token||!company){toast('Please Login & Sync first to create a verified payment link');return}let cloudCustomer=null;try{toast('Checking company cloud…');let check=await fetch(String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync',{headers:cloudHeaders(),cache:'no-store'});let cloudData=await check.json().catch(()=>({}));if(!check.ok||!cloudData.data||!Array.isArray(cloudData.data.customers))throw new Error(cloudData.error||'Company cloud is not ready. Open Settings and tap Login & Sync.');cloudCustomer=cloudData.data.customers.find(x=>String(x.id)===String(c.id))||cloudData.data.customers.find(x=>String(x.clientCode||'').replace(/\s+/g,'').toUpperCase()===String(c.clientCode||'').replace(/\s+/g,'').toUpperCase());if(!cloudCustomer)throw new Error('Customer is not in company cloud yet. Open Settings → Login & Sync, wait for sync success, then retry.');}catch(e){toast('Payment link: '+(e.message||'Cloud check failed'));return}let canonicalClientCode=String(cloudCustomer.clientCode||c.clientCode||'').replace(/\s+/g,'').toUpperCase();if(!/^SC\d{3,}$/.test(canonicalClientCode)){toast('Customer Client Code is missing in cloud. Open customer edit, save the SC code, sync, and retry.');return}let savedPackages=(Array.isArray(d.settings.packages)?d.settings.packages:[]).filter(p=>p&&String(p.speed||p.name||'').trim()&&Number(p.price??p.fee)>0).map(p=>({speed:String(p.speed||p.name).trim(),price:Number(p.price??p.fee)}));let currentSpeed=String(c.pkg||'').trim(),currentPrice=Number(c.fee||0);if(currentSpeed&&currentPrice>0&&!savedPackages.some(p=>p.speed===currentSpeed&&Math.abs(p.price-currentPrice)<0.01))savedPackages.push({speed:currentSpeed,price:currentPrice});if(!savedPackages.length){toast('Add package names and prices in Settings first');openSettings();return}try{const r=await fetch(String(cfg.apiUrl).replace(/\/$/,'')+'/api/settings/packages',{method:'PUT',headers:cloudHeaders(),body:JSON.stringify({packages:savedPackages}),cache:'no-store'});const x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||('Package sync failed (HTTP '+r.status+')'));d.settings.packages=savedPackages;save(false)}catch(e){toast('Package sync failed: '+(e.message||'Check internet, login and cloud database'));return}let base='https://rezaulfahim806-sys.github.io/STAR-COMMUNICATION95/pay.html';let q=new URLSearchParams({code:String(cloudCustomer.id||c.id||''),clientCode:canonicalClientCode,name:String(c.name||''),location:String(c.address||''),mobile:String(c.phone||c.mobile||''),package:String(c.pkg||''),bill:String(c.fee||0),prev:String(c.prevDue||0),total:String(due(c)),api:String(cfg.apiUrl||''),company:company,packages:JSON.stringify(savedPackages)});let link=base+'?'+q.toString();window.__starPay={link:link,phone:String(c.phone||''),name:String(c.name||'Customer')};openSheet('<h3>Payment Link</h3><div class="muted">'+esc(canonicalClientCode)+' • '+esc(c.name)+'</div><textarea id="paylink" class="input" rows="4" readonly>'+esc(link)+'</textarea><button class="btn full" onclick="copyCustomerPaymentLink()">📋 Copy Link</button><button class="btn dark full" style="margin-top:7px" onclick="sendPaymentLinkSms()">✉️ Send SMS</button><button class="btn light full" style="margin-top:7px" onclick="openPaymentPage()">🌐 Open Payment Page</button>')}async function copyCustomerPaymentLink(){let x=window.__starPay?.link||'';if(!x){toast('Payment link not found');return}try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(x);toast('Payment link copied');return}let t=document.getElementById('paylink');t.focus();t.select();t.setSelectionRange(0,t.value.length);let ok=document.execCommand('copy');toast(ok?'Payment link copied':'Select and copy the link manually')}catch(e){toast('Copy failed — long press the link to copy')}}

async function sendPaymentLinkSms(){let x=window.__starPay;if(!x){toast('Payment link not found');return}let msg='STAR COMMUNICATION\\nYour bill payment link: '+x.link;let cfg=cloudConfig(),sms=d.settings&&d.settings.smsApi||{};if(sms.url&&cfg.token&&cfg.apiUrl){try{let r=await fetch(String(cfg.apiUrl).replace(/\/$/, '')+'/api/integrations/sms/send',{method:'POST',headers:cloudHeaders(),body:JSON.stringify({phone:x.phone,message:msg})}),z={};try{z=await r.json()}catch(e){}if(!r.ok||!z.ok)throw new Error(z.error||'SMS provider request failed');closeSheet();toast('Payment link sent by SMS API');return}catch(e){toast(e.message||'SMS API failed');return}}if(!window.AndroidBridge||typeof AndroidBridge.sendSms!=='function'){try{location.href='smsto:'+encodeURIComponent(x.phone)+'?body='+encodeURIComponent(msg)}catch(e){toast('SMS service unavailable')}return}try{let ok=AndroidBridge.sendSms(x.phone,msg);if(ok){closeSheet();toast('Payment link SMS sent using SIM')}}catch(e){toast('SMS failed: '+(e.message||'unknown error'))}}
