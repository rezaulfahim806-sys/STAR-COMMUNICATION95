ata(event)"><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><div id="printArea" style="display:none"></div><script>'use strict';const KEY='star_communication_final_v2',LEGACY_KEY='star_communication_final_v1',DEF={customers:[],payments:[],expenses:[],pending:[],history:[],settings:{app:'STAR COMMUNICATION',password:'1234',merchantNumber:'',lastBillingMonth:'',cloud:{apiUrl:'https://star-communication-api.onrender.com',username:'',token:''},olt:{ip:'',user:'',password:'',vendor:'VSOL',protocol:'SSH',port:22}}};let d;try{d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY)||'null')}catch(e){d=null}if(!d)d=JSON.parse(JSON.stringify(DEF));else if(!localStorage.getItem(KEY)){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}['customers','payments','expenses','pending','history'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.settings=Object.assign({},DEF.settings,d.settings||{});d.settings.cloud=Object.assign({},DEF.settings.cloud,d.settings.cloud||{});if(!d.settings.cloud.apiUrl)d.settings.cloud.apiUrl='https://star-communication-api.onrender.com';d.settings.olt=Object.assign({},DEF.settings.olt,d.settings.olt||{});let page='dashboard',opts={},stack=[];const pad=n=>String(n).padStart(2,'0'),localDate=()=>{let x=new Date();return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())},today=()=>localDate(),month=()=>today().slice(0,7),money=n=>'৳'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cloudSyncTimer=0,cloudBusy=false;

let cloudLastUpdatedAt='';
function dataCount(x){return ['customers','payments','expenses','pending','history'].reduce((n,k)=>n+(Array.isArray(x[k])?x[k].length:0),0)}
function mergeRows(localRows,cloudRows){
 let out=[],map=new Map();
 (localRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(k){map.set(k,x)}else{out.push(x)}});
 (cloudRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(!k){out.push(x);return}let old=map.get(k);if(!old){map.set(k,x);return}let ot=Date.parse(old.updatedAt||old.createdAt||'')||0,nt=Date.parse(x.updatedAt||x.createdAt||'')||0;if(nt>ot)map.set(k,x)});
 return out.concat(Array.from(map.values()))
}
function mergeState(local,cloud){
 return {
  customers:mergeRows(local.customers,cloud.customers),
  payments:mergeRows(local.payments,cloud.payments),
  expenses:mergeRows(local.expenses,cloud.expenses),
  pending:mergeRows(local.pending,cloud.pending),
  history:mergeRows(local.history,cloud.history),
  settings:Object.assign({},local.settings||{},cloud.settings||{})
 }
}
async function cloudSync(pushLocal){
 let cfg=cloudConfig();if(!cfg.apiUrl||!cfg.token||cloudBusy)return false;
 cloudBusy=true;
 try{
  let r=await fetch(String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync',{headers:cloudHeaders()});
  if(r.status===401){if(d.settings&&d.settings.cloud){d.settings.cloud.token='';}save(false);throw new Error('Cloud session expired — please Login & Sync again')}
  if(!r.ok)throw new Error('Cloud sync read failed');
  let x=await r.json();
  cloudLastUpdatedAt=x.updatedAt||'';
  if(x.data&&Array.isArray(x.data.customers)){
    let localCount=dataCount(d),cloudCount=dataCount(x.data);
    if(cloudCount===0&&localCount>0&&!pushLocal){toast('Cloud is empty — local data kept safe');return false}
    if(localCount>0&&cloudCount>0){
      let merged=mergeState(d,x.data);
      let before=JSON.stringify({customers:x.data.customers||[],payments:x.data.payments||[],expenses:x.data.expenses||[],pending:x.data.pending||[],history:x.data.history||[]});
      d.customers=merged.customers;d.payments=merged.payments;d.expenses=merged.expenses;d.pending=merged.pending;d.history=merged.history;
      let after=JSON.stringify({customers:d.customers,payments:d.payments,expenses:d.expenses,pending:d.pending,history:d.history});
      if(after!==before) await cloudPush();
      cloudLastUpdatedAt=new Date().toISOString();
      localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));
      render();toast('Cloud + local data merged safely');
    }else{
      d.customers=x.data.customers||[];d.payments=x.data.payments||[];d.expenses=x.data.expenses||[];d.pending=x.data.pending||[];d.history=x.data.history||[];
      if(x.data.settings)d.settings=Object.assign({},d.settings,x.data.settings,{cloud:cfg});
      localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));
      render();toast('Cloud data loaded');
    }
  }else if(pushLocal){await cloudPush()}
  return true
 }catch(e){try{toast('Cloud sync: '+e.message)}catch(_){ }return false}finally{cloudBusy=false}
}
async function cloudPush(){
 let cfg=cloudConfig();if(!cfg.apiUrl||!cfg.token)throw new Error('Cloud login required — please Login & Sync again');
 const url=String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync';
 const payload=()=>({updatedAt:cloudLastUpdatedAt||'',data:{customers:d.customers,payments:d.payments,expenses:d.expenses,pending:d.pending,history:d.history,settings:(()=>{let s=JSON.parse(JSON.stringify(d.settings||{}));s.cloud={apiUrl:cfg.apiUrl,username:cfg.username};if(s.olt&&typeof s.olt==='object')s.olt.password='';return s})()}});
 let r=await fetch(url,{method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload())});
 if(r.status===401)throw new Error('Cloud session expired — please Login & Sync again');
 if(r.status===409){
  let conflict=await r.json().catch(()=>({}));
  if(conflict.data&&Array.isArray(conflict.data.customers)){
   let merged=mergeState(d,conflict.data);
   d.customers=merged.customers;d.payments=merged.payments;d.expenses=merged.expenses;d.pending=merged.pending;d.history=merged.history;
   d.settings=Object.assign({},d.settings||{},conflict.data.settings||{},{cloud:cfg});
   cloudLastUpdatedAt=conflict.updatedAt||'';
   localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));
   r=await fetch(url,{method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload())});
  }else throw new Error('Cloud data changed on another phone. Please sync again.');
 }
 if(!r.ok){let err=await r.json().catch(()=>({}));throw new Error(err.error||('Cloud sync upload failed (HTTP '+r.status+')'))}

function payCustomer(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;openSheet(`<h3>Customer Bill Payment</h3><div class="detail"><span>Customer</span><b>${esc(c.name)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Current Bill</span><b>${money(billDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><input id="amt" class="input" type="number" value="${due(c)}" placeholder="Payment amount"><input id="ref" class="input" placeholder="Reference / note"><button class="btn green full" onclick="savePayment('${c.id}')">Confirm Paid</button>`)}function savePayment(id){let amount=Number(document.getElementById('amt')?.value||0);if(!Number.isFinite(amount)||amount<=0){toast('Enter a valid payment amount');return}let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;let before=due(c),prevBefore=Math.max(0,Number(c.prevDue||0));if(amount>before){toast('Payment cannot exceed total due');return}let prevPaid=Math.min(prevBefore,amount),currentPaid=amount-prevPaid;if(prevPaid>0)c.prevDue=Math.max(0,prevBefore-prevPaid);if(currentPaid>0)d.payments.push({id:Date.now().toString(),customer:id,amount:currentPaid,date:today(),month:month(),status:'paid',source:'manual',ref:document.getElementById('ref')?.value||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});if(prevPaid>0)d.payments.push({id:(Date.now()+1).toString(),customer:id,amount:prevPaid,date:today(),month:'previous-due',status:'paid',source:'manual-previous-due',ref:document.getElementById('ref')?.value||'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});if(c.status==='expired'&&amount>0){c.status='active';if(c.expiry&&c.expiry<today()){let dt=new Date(today()+'T12:00:00');dt.setMonth(dt.getMonth()+1);c.expiry=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}}activateAfterFullPayment(c);save(); function filterPaymentCustomers(){let search=document.getElementById("payCustomerSearch"),select=document.getElementById("payselect");if(!search||!select)return;let q=search.value.trim().toLowerCase(),selected=select.value;let list=d.customers.filter(c=>(String(c.name||"")+" "+String(c.phone||"")+" "+String(c.address||"")).toLowerCase().includes(q));select.innerHTML='<option value="">Select customer ( '+list.length+' )</option>'+list.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} • ${esc(c.phone)} • Due ${money(due(c))}</option>`).join("");if(list.some(c=>String(c.id)===selected))select.value=selected}function billingCreateLink(){let id=document.getElementById('payselect')?.value;if(!id){toast('Select a customer');return}customerPaymentLink(id)}function billingPaySelected(){let id=payselect.value;if(!id){toast('Select a customer');return}payCustomer(id)}function addIncoming(){openSheet(`<h3>Incoming Merchant Transaction</h3><input id="sender" class="input" placeholder="Sender bKash number"><input id="inamt" class="input" type="number" placeholder="Amount"><input id="tid" class="input" placeholder="Transaction ID"><button class="btn full" onclick="saveIncoming()">Save as Pending</button>`)}function normalize(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('880'))x='0'+x.slice(3);return x}function saveIncoming(){let s=normalize(sender.value),c=d.customers.find(c=>normalize(c.phone).slice(-10)===s.slice(-10));d.pending.push({id:Date.now().toString(),sender:s,amount:Number(inamt.value||0),transactionId:tid.value||'',date:today(),status:'pending',customer:c?c.id:'',customerName:c?c.name:''});save();closeSheet();toast(c?'Matched customer — Pending':'Saved Pending');render()}function confirmPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(!p)return;let c=p.customer?d.customers.find(x=>String(x.id)===String(p.customer)):null;if(!c){let s=prompt('Customer mobile for manual match:');if(!s)return;c=d.customers.find(x=>normalize(x.phone).slice(-10)===normalize(s).slice(-10));if(!c){toast('Customer not found');return}p.customer=c.id;p.customerName=c.name}d.payments.push({id:Date.now().toString(),customer:c.id,amount:Number(p.amount||0),date:today(),month:month(),status:'paid',source:'merchant',ref:p.transactionId||''});p.status='paid';p.confirmedAt=today();save();try{if(c&&due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}toast('Manual Paid confirmed');render()}function cancelPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(p){p.status='cancelled';save();toast('Transaction cancelled');render()}}function analytics(){return `<h1 class="title">Growth & Analytics</h1><div class="chart"><b>🆕 New Connection Growth</b>${bars(newGrowth(),'greenbar')}</div><div class="chart"><b>💳 Monthly Bill Collection Growth</b>${bars(monthlyBills())}</div><div class="chart"><b>🏢 Company Growth</b><div class="muted">Income − expenses</div>${bars(companyGrowth())}</div>`}function accounts(){let cur=month();let months=[...new Set([cur,...(d.payments||[]).map(x=>String(x.month||x.date||'').slice(0,7)),...(d.expenses||[]).map(x=>String(x.date||x.createdAt||'').slice(0,7))].filter(x=>/^\\d{4}-\\d{2}$/.test(x)))].sort().reverse();let chosen=String(opts.accountMonth||cur);if(!months.includes(chosen))chosen=cur;opts.accountMonth=chosen;let payMonth=(d.payments||[]).filter(x=>x.status==='paid'&&String(x.month||x.date||'').slice(0,7)===chosen).reduce((a,x)=>a+Number(x.amount||0),0);let rows=(d.expenses||[]).filter(x=>String(x.date||x.createdAt||'').slice(0,7)===chosen);let otherIn=rows.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0),exp=rows.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0);return `<h1 class="title">Accounts</h1><div class="section"><label for="accountMonth">Monthly Accounts / History</label><select id="accountMonth" class="input" onchange="opts.accountMonth=this.value;render()">${months.map(m=>`<option value="${m}" ${m===chosen?'selected':''}>${m}</option>`).join('')}</select><div class="muted" style="margin-top:5px">New month starts a new monthly view automatically. Old records remain saved and can be viewed by selecting the month.</div></div><div class="moneygrid"><div class="moneybox"><span class="muted">Bill Collection</span><b>${money(payMonth)}</b></div><div class="moneybox"><span class="muted">Other Income</span><b>${money(otherIn)}</b></div><div class="moneybox"><span class="muted">Total Income</span><b>${money(payMonth+otherIn)}</b></div><div class="moneybox"><span class="muted">Total Expense</span><b>${money(exp)}</b></div><div class="moneybox"><span class="muted">Net Balance</span><b>${money(payMonth+otherIn-exp)}</b></div></div><div class="section"><button class="btn green full" onclick="addIncome()">＋ Add Income</button><button class="btn red full" style="margin-top:7px" onclick="addExpense()">＋ Add Expense</button></div><div class="section"><h3>History — ${chosen}</h3><div class="grid"><button class="btn green" onclick="showMoneyHistory('income')">Income History</button><button class="btn red" onclick="showMoneyHistory('expense')">Expense History</button></div><div id="moneyHistoryPanel" style="margin-top:10px"><div class="muted" style="padding:8px">Choose Income History or Expense History to view ${chosen} records.</div></div></div>`}
function showMoneyHistory(type){const el=document.getElementById('moneyHistoryPanel');if(!el)return;const chosen=String(opts.accountMonth||month());const rows=(d.expenses||[]).filter(x=>x.type===type&&String(x.date||x.createdAt||'').slice(0,7)===chosen).slice().sort((a,b)=>String(b.createdAt||b.date||'').localeCompare(String(a.createdAt||a.date||'')));if(!rows.length){el.innerHTML='<div class="muted" style="padding:12px;text-align:center">No '+(type==='income'?'income':'expense')+' history for '+esc(chosen)+'.</div>';return}el.innerHTML=rows.map(x=>{const dt=x.createdAt?new Date(x.createdAt):null;const date=dt&&!isNaN(dt.getTime())?dt.toLocaleDateString('en-GB'):(x.date||'Date not recorded');const time=dt&&!isNaN(dt.getTime())?dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):(x.time||'');return '<div class="detail"><span><b>'+esc(x.note||(type==='income'?'Income':'Expense'))+'</b><div class="muted">'+esc(date+(time?' · '+time:''))+'</div></span><b>'+(type==='income'?'+':'−')+money(x.amount)+'</b></div>'}).join('')}
function addIncome(){openSheet(`<h3>Add Income</h3><input id="ie" class="input" type="number" placeholder="Amount"><input id="inote" class="input" placeholder="Income source / note"><button class="btn green full" onclick="saveOtherIncome()">Add Income</button>`)}function saveOtherIncome(){let v=Number(ie.value||0);if(v<=0){toast('Enter a valid amount');return}d.expenses.push({id:Date.now().toString(),type:'income',amount:v,date:today(),createdAt:new Date().toISOString(),time:new Date().toLocaleTimeString(),note:inote.value||''});save();closeSheet();toast('Income added');render()}function addExpense(){openSheet(`<h3>Add Expense</h3><input id="ee" class="input" type="number" placeholder="Amount"><input id="enote" class="input" placeholder="Expense note"><button class="btn red full" onclick="saveExpense()">Add Expense</button>`)}function saveExpense(){let v=Number(ee.value||0);if(v<=0){toast('Enter a valid amount');return}d.expenses.push({id:Date.now().toString(),type:'expense',amount:v,date:today(),createdAt:new Date().toISOString(),time:new Date().toLocaleTimeString(),note:enote.value||''});save();closeSheet();toast('Expense added');render()}function monitor(){return \`<h1 class="title">OLT / ONU Monitoring</h1>
<div class="section"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3 style="margin:0">📡 Live OLT Status</h3><button class="btn dark" onclick="refreshOltDashboard()">↻ Refresh</button></div><div id="oltDashboardStatus" class="muted" style="margin:10px 0">OLT not connected yet. Add IP, username and protocol in Settings when ready.</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div class="section" style="margin:0;padding:12px"><div class="muted">OLT Connection</div><b id="oltLiveConnection">NOT CONNECTED</b></div><div class="section" style="margin:0;padding:12px"><div class="muted">Vendor</div><b id="oltLiveVendor">\${esc(d.settings.olt?.vendor||'VSOL')}</b></div><div class="section" style="margin:0;padding:12px"><div class="muted">Total ONU</div><b id="oltLiveTotal">—</b></div><div class="section" style="margin:0;padding:12px"><div class="muted">Online / Offline</div><b><span id="oltLiveOnline">—</span> / <span id="oltLiveOffline">—</span></b></div></div>
<button class="btn light full" style="margin-top:10px" onclick="openSettings()">OLT Settings</button></div>
<div class="section"><h3>📊 PON Port Status</h3><div class="muted" style="margin-bottom:10px">Counts are calculated from the ONU rows returned by your OLT backend. Unknown PON assignments are not guessed.</div><div id="oltPonCards" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><div class="muted">Connect OLT to load PON 1–4.</div></div></div>
<div class="section"><h3>🗺️ Network Diagram</h3><div class="muted" style="margin-bottom:10px">OLT → PON → detected ONU. Customer names and cable distances can be added later; the OLT does not automatically know physical shelter routes.</div><div id="oltNetworkDiagram" style="overflow:auto;min-height:100px"><div class="muted">Diagram will populate after live ONU data is received.</div></div></div>

<div class="section"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3 style="margin:0">ONU List — MAC / Power / Customer</h3><button class="btn light" onclick="refreshOltDashboard()">Update ONU List</button></div><div id="oltLiveRows" style="margin-top:10px;overflow-x:auto"><div class="muted">ONU details will appear after connecting to the saved OLT.</div></div></div>

function ponNumber(row){const raw=String(row.pon??row.ponId??row.pon_id??row.port??row.interface??row.slotPort??'');const m=raw.match(/(?:pon\s*)?([1-4])(?:\D|$)/i);if(m)return Number(m[1]);const id=String(row.onuId??row.onu_id??'');const n=id.match(/(?:^|[/:\-])([1-4])(?:[/:\-])/);return n?Number(n[1]):null}

function renderOltPonAndDiagram(rows,summary){const cards=document.getElementById('oltPonCards'),diagram=document.getElementById('oltNetworkDiagram');if(!cards||!diagram)return;const groups=[1,2,3,4].map(n=>({n,rows:rows.filter(r=>ponNumber(r)===n)}));cards.innerHTML=groups.map(g=>{const online=g.rows.filter(r=>String(r.status||'').toLowerCase()==='online').length,offline=g.rows.filter(r=>String(r.status||'').toLowerCase()==='offline').length,other=g.rows.length-online-offline,down=offline>0&&online===0;const color=down?'#dc2626':offline>0||other>0?'#d97706':g.rows.length?'#16a34a':'#64748b';return '<div style="border:1px solid #e1e8f0;border-radius:14px;padding:12px;background:#fff;border-top:4px solid '+color+'"><div style="display:flex;justify-content:space-between;gap:6px;align-items:center"><b>PON '+g.n+'</b><span style="color:'+color+';font-size:11px;font-weight:800">'+(down?'OFFLINE':g.rows.length?'ACTIVE':'NO DATA')+'</span></div><div style="font-size:22px;font-weight:800;margin:8px 0">'+g.rows.length+' ONU</div><div style="font-size:12px;color:#16a34a">Online: '+online+'</div><div style="font-size:12px;color:#dc2626">Offline: '+offline+'</div>'+(other?'<div style="font-size:12px;color:#64748b">Unknown: '+other+'</div>':'')+'</div>'}).join('');const svgW=620,rowH=42,top=42,ponX=150,onuX=330,labelX=355;let nodes='',links='';groups.forEach((g,i)=>{const py=top+i*rowH;links+='<path d="M 88 115 C 120 115, 115 '+(py+8)+', '+ponX+' '+(py+8)+'" stroke="'+(g.rows.some(r=>String(r.status).toLowerCase()==='offline')?'#dc2626':'#94a3b8')+'" fill="none" stroke-width="2"/>';nodes+='<circle cx="'+ponX+'" cy="'+(py+8)+'" r="7" fill="'+(g.rows.length?(g.rows.some(r=>String(r.status).toLowerCase()==='offline')?'#dc2626':'#16a34a'):'#94a3b8')+'"/><text x="'+(ponX+14)+'" y="'+(py+12)+'" font-size="12" fill="#17253a">PON '+g.n+' ('+g.rows.length+')</text>';g.rows.slice(0,6).forEach((r,j)=>{const oy=py+30+j*25;const status=String(r.status||'').toLowerCase(),rx=Number(r.rxPower??r.rx_power??r.rx);const weak=Number.isFinite(rx)&&(r.rxPower!=null||r.rx_power!=null||r.rx!=null)&&rx < -27;const c=status==='offline'?'#dc2626':weak?'#d97706':status==='online'?'#06b6d4':'#64748b';links+='<path d="M '+(ponX+7)+' '+(py+8)+' C 225 '+(py+8)+', 245 '+oy+', '+onuX+' '+oy+'" stroke="'+c+'" fill="none" stroke-width="1.5"/>';nodes+='<circle cx="'+onuX+'" cy="'+oy+'" r="5.5" fill="'+c+'"/><text x="'+labelX+'" y="'+(oy+4)+'" font-size="11" fill="#17253a">'+esc(String(r.onuId||r.onu_id||r.mac||'ONU').slice(0,22))+' · '+(status==='online'?'ON':status==='offline'?'OFF':'?')+'</text>'})});diagram.innerHTML='<div style="font-size:11px;color:#64748b;margin-bottom:8px">🟢 Online · 🔴 Offline · 🟠 Weak power · ⚪ Unknown</div><svg viewBox="0 0 '+svgW+' '+Math.max(230,top+groups.length*rowH+180)+'" style="width:100%;min-width:340px;max-width:700px;height:auto;background:#f8fafc;border-radius:12px"><rect x="18" y="90" width="70" height="50" rx="10" fill="#10264b"/><text x="53" y="111" text-anchor="middle" font-size="10" fill="#fff">STAR</text><text x="53" y="125" text-anchor="middle" font-size="10" fill="#fff">OLT</text>'+links+nodes+'</svg><div style="font-size:11px;color:#64748b;margin-top:8px">Diagram shows the PON assignment present in returned ONU data. It does not infer physical splitter/shelter paths or cable distance.</div>'}
async function refreshOltDashboard(){const status=document.getElementById('oltDashboardStatus');if(!status)return;const put=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value};put('oltLiveConnection','CONNECTING…');put('oltLiveRaw','Reading live OLT data…');status.textContent='Connecting to configured OLT using saved Settings…';try{const summary=await oltApiRequest('/api/olt/monitor');put('oltLiveConnection',summary.connected?'CONNECTED':'NOT CONNECTED');put('oltLiveVendor',summary.vendor||d.settings.olt?.vendor||'VSOL');put('oltLiveTotal',summary.total==null?'Not parsed':String(summary.total));put('oltLiveOnline',summary.online==null?'—':String(summary.online));put('oltLiveOffline',summary.offline==null?'—':String(summary.offline));put('oltLiveRaw',summary.raw||'OLT responded, but no command output was returned.');let rowsData=[],listError='';try{const list=await oltApiRequest('/api/olt/onu-list');rowsData=Array.isArray(list.rows)?list.rows:[]}catch(e){listError=e.message||String(e)}renderOltPonAndDiagram(rowsData,summary);status.textContent='Live response received at '+new Date().toLocaleTimeString();const box=document.getElementById('oltLiveRows'),alertBox=document.getElementById('oltLiveAlerts');if(alertBox){const alerts=[];rowsData.forEach(row=>{const st=String(row.status||'').toLowerCase(),reason=String(row.lastDeregisterReason||row.reason||'');if(st==='offline')alerts.push({kind:/los|signal|power|optical/i.test(reason)?'POWER LOSS / LOS':'ONU OFFLINE',row,detail:reason||'OLT reports ONU offline'});const rx=Number(row.rxPower??row.rx_power??row.rx);if(Number.isFinite(rx)&&(row.rxPower!=null||row.rx_power!=null||row.rx!=null)){if(rx < -27)alerts.push({kind:'RX POWER LOW',row,detail:rx+' dBm'});else if(rx > -8)alerts.push({kind:'RX POWER HIGH',row,detail:rx+' dBm')} }const tx=Number(row.txPower??row.tx_power??row.tx);if(Number.isFinite(tx)&&(row.txPower!=null||row.tx_power!=null||row.tx!=null)&&(tx < -2||tx > 5))alerts.push({kind:'TX PO e="padding:8px;border-bottom:1px solid #eee;color:'+color+';font-weight:800">'+esc(st.toUpperCase())+(weak?' · WEAK':'')+'</td><td style="padding:8px;border-bottom:1px solid #eee">'+esc(row.mac||row.serial||row.sn||'—')+'</td><td style="padding:8px;border-bottom:1px solid #eee;color:'+(weak?'#d97706':'#17253a')+'">'+(rx==null?'—':esc(String(rx))+' dBm')+'</td><td style="padding:8px;border-bottom:1px solid #eee">'+(row.distanceM==null?'—':esc(String(row.distanceM))+' m')+'</td><td style="padding:8px;border-bottom:1px solid #eee;min-width:150px"><input aria-label="Customer name" value="'+esc(oltCustomerLabel(row)).replace(/"/g,'&quot;')+'" placeholder="Add customer name" onchange="saveOltCustomerName(\''+esc(id).replace(/'/g,'&#39;')+'\',this.value)" style="width:145px;padding:7px;border:1px solid #dbe3ee;border-radius:8px"></td></tr>'}).join('')+'</tbody></table>'}else box.innerHTML='<div class="muted">'+esc(listError||'No ONU rows returned. Confirm that the backend supports /api/olt/onu-list.')+'</div>'}}catch(e){put('oltLiveConnection','CONNECTION FAILED');put('oltLiveRaw',e.message||String(e));status.textContent='Live monitoring failed: '+(e.message||e);const box=document.getElementById('oltLiveRows');if(box)box.innerHTML='<div class="muted">OLT is not connected or the backend cannot reach it. Add OLT IP/username/protocol in Settings and confirm Cloud Login & Sync.</div>';const p=document.getElementById('oltPonCards');if(p)p.innerHTML='<div class="muted">No live PON data yet. This is expected until OLT is connected.</div>';const dgm=document.getElementById('oltNetworkDiagram');if(dgm)dgm.innerHTML='<div class="muted">Connect OLT to populate the network diagram. No fake ONU data is displayed.</div>';toast('OLT monitoring failed: '+(e.message||e))}}function render(){fix();let html=page==='dashboard'?dashboard():page==='customers'?customers():page==='details'?details():page==='billing'?billing():page==='collected'?collectedBills():page==='analytics'?analytics():page==='accounts'?accounts():page==='monitor'?monitor():page==='referrals'?referrals():dashboard();document.getElementById('content').innerHTML=html;setNav();if(page==='monitor')setTimeout(refreshOltDashboard,120)}startup();
