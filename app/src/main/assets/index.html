se(JSON.stringify(DEF));['customers','payments','expenses','pending','history'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.settings=Object.assign({},DEF.settings,d.settings||{});d.settings.olt=Object.assign({},DEF.settings.olt,d.settings.olt||{});let page='dashboard',opts={},stack=[];const pad=n=>String(n).padStart(2,'0'),localDate=()=>{let x=new Date();return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())},today=()=>localDate(),month=()=>today().slice(0,7),money=n=>'৳'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cloudSyncTimer=0,cloudBusy=false;
function cloudConfig(){return d.settings&&d.settings.cloud||{}}
function cloudHeaders(){let h={'Content-Type':'application/json'};let tok=cloudConfig().token;if(tok)h.Authorization='Bearer '+tok;return h}
async function cloudLogin(api,user,pass){
 api=String(api||'').trim().replace(/\\/$/,''); user=String(user||'').trim();
 if(!/^https:\\/\\//i.test(api))throw new Error('HTTPS API URL required');
 let r=await fetch(api+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:String(pass||'')})});
 if(!r.ok)throw new Error('Login failed');

}
function dataCount(x){return ['customers','payments','expenses','pending','history'].reduce((n,k)=>n+(Array.isArray(x[k])?x[k].length:0),0)}
function mergeRows(localRows,cloudRows){
 let out=[],map=new Map();
 (localRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(k){map.set(k,x)}else{out.push(x)}});
 (cloudRows||[]).forEach(x=>{let k=String(x.id??x._id??'');if(!k){out.push(x);return}let old=map.get(k);if(!old){map.set(k,x);return}let ot=Date.parse(old.updatedAt||old.createdAt||'')||0,nt=Date.parse(x.updatedAt||x.createdAt||'')||0;if(nt>ot)map.set(k,x)});

async function cloudSync(pushLocal){
 let cfg=cloudConfig();if(!cfg.apiUrl||!cfg.token||cloudBusy)return false;
 cloudBusy=true;
 try{
  let r=await fetch(String(cfg.apiUrl).replace(/\/$/,'')+'/api/sync',{headers:cloudHeaders()});

  if(x.data&&Array.isArray(x.data.customers)){
    let localCount=dataCount(d),cloudCount=dataCount(x.data);

async function cloudPush(){

 if(r.status===401)throw new Error('Cloud session expired');if(!r.ok)throw new Error('Cloud sync upload failed');return true
}
function scheduleCloudSync(){if(!cloudConfig().token)return;clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>cloudPush().catch(()=>{}),1200)}
function save(sync=true){try{localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY+'_last_backup',JSON.stringify({savedAt:new Date().toISOString(),data:d}));if(sync)scheduleCloudSync()}catch(e){try{toast('Data save failed: storage full')}catch(_){}}}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function openDrawer(){document.getElementById('shade').classList.add('show')}function closeDrawer(){document.getElementById('shade').classList.remove('show')}function openSheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeSheet(){document.getElementById('modal').classList.remove('show')}function go(p,o={},push=true){if(push&&page!==p)stack.push({page,opts});page=p;opts=o;render()}function appBack(){if(document.getElementById('modal').classList.contains('show')){closeSheet();return}closeDrawer();if(stack.length){let x=stack.pop();page=x.page;opts=x.opts||{};render()}else if(page!=='dashboard'){page='dashboard';opts={};render()}}function setNav(){['dashboard','customers','monitor','billing','accounts'].forEach(x=>document.getElementById('nav-'+x)?.classList.toggle('on',x===page))}function paid(c,m=month()){return d.payments.filter(x=>String(x.customer)===String(c.id)&&x.month===m&&x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function billDue(c,m=month()){return Math.max(0,Number(c.fee||0)-paid(c,m))}function due(c){return Math.max(0,Number(c.prevDue||0)+billDue(c))}function fixExpiry(){let ch=false;d.customers.forEach(c=>{if(c.expiry&&c.expiry<today()&&c.status!=='expired'){c.status='expired';ch=true}});if(ch)save()}function rollover(){let cur=month(),last=d.settings.lastBillingMonth;if(!last){d.settings.lastBillingMonth=cur;save();return}if(last===cur)return;d.customers.forEach(c=>{let oldPaid=paid(c,last),oldDue=Math.max(0,Number(c.prevDue||0)+Number(c.fee||0)-oldPaid);d.history.push({id:Date.now().toString()+Math.random(),customer:c.id,month:last,paid:oldPaid,due:oldDue,closedAt:today()});c.prevDue=oldDue});d.settings.lastBillingMonth=cur;save()}function fix(){rollover();fixExpiry()}function billIncome(){return d.payments.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function otherIncome(){return d.expenses.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0)}function totalIncome(){return billIncome()+otherIncome()}function totalExpense(){return d.expenses.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0)}function netBalance(){return totalIncome()-totalExpense()}function totalPaid(){return d.payments.filter(x=>x.month===month()&&x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function totalUnpaid(){return d.customers.filter(c=>due(c)>0).reduce((a,c)=>a+due(c),0)}function newGrowth(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.customers.forEach(c=>{let s=String(c.createdAt||c.connectionDate||'');if(s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]++});return a}function monthlyBills(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.payments.forEach(x=>{let s=String(x.month||x.date||'');if(x.status==='paid'&&s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]+=Number(x.amount||0)});return a}function companyGrowth(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.payments.forEach(x=>{let s=String(x.month||x.date||'');if(x.status==='paid'&&s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]+=Number(x.amount||0)});d.expenses.forEach(x=>{let s=String(x.date||'');if(s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]-=Number(x.amount||0)});return a}function bars(vals,cls=''){let mx=Math.max(1,...vals.map(v=>Math.abs(v))),ns=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `<div class="chartbars">${vals.map((v,i)=>`<div class="barcol"><b>${v?Math.round(v):''}</b><div class="bar ${cls}" style="height:${Math.max(3,Math.round(Math.abs(v)/mx*82))}px"></div>${ns[i]}</div>`).join('')}</div>`}function dashboard(){fix();let g=newGrowth(),b=monthlyBills(),m=Number(month().slice(5,7))-1;return `<h1 class="title">Dashboard</h1><div class="sub">${month()} • Billing cycle: 1–31 • New month starts automatically</div><div class="grid"><div class="stat blue" onclick="go('customers',{filter:'all'})"><div class="label">Total Customer</div><div class="num">${d.customers.length}</div></div><div class="stat green" onclick="go('customers',{filter:'active'})"><div class="label">Active Customer</div><div class="num">${d.customers.filter(c=>c.status==='active').length}</div></div><div class="stat navy" onclick="go('customers',{filter:'inactive'})"><div class="label">Inactive Customer</div><div class="num">${d.customers.filter(c=>c.status==='inactive').length}</div></div><div class="stat red" onclick="go('customers',{filter:'expired'})"><div class="label">Expired Customer</div><div class="num">${d.customers.filter(c=>c.status==='expired').length}</div></div><div class="stat purple" onclick="go('customers',{filter:'paid'})"><div class="label">Total Paid</div><div class="num">${money(totalPaid())}</div></div><div class="stat orange" onclick="go('customers',{filter:'unpaid'})"><div class="label">Total Unpaid</div><div class="num">${money(totalUnpaid())}</div></div></div><div class="section"><h3>📅 Previous Due</h3><div class="kpi"><span>Customers with previous due</span><b>${d.customers.filter(c=>Number(c.prevDue||0)>0).length}</b></div><button class="btn dark full" onclick="go('customers',{filter:'previous'})">View Previous Due</button></div><div class="section"><h3>💰 Finance Summary</h3><div class="moneygrid"><div class="moneybox"><span class="muted">Total Income</span><b class="success">${money(totalIncome())}</b></div><div class="moneybox"><span class="muted">Total Expense</span><b class="danger">${money(totalExpense())}</b></div><div class="moneybox"><span class="muted">Net Balance</span><b>${money(netBalance())}</b></div></div><div class="detail"><span>Bill Collection Income</span><b>${money(billIncome())}</b></div><div class="detail"><span>Other Income</span><b>${money(otherIncome())}</b></div></div><div class="section"><div class="kpi"><span>🆕 New connections this month</span><b>${g[m]}</b></div><div class="kpi"><span>💳 Pending merchant payments</span><b>${d.pending.filter(x=>x.status==='pending').length}</b></div></div><div class="chart"><b>📈 Monthly New Connection Growth</b>${bars(g,'greenbar')}</div><div class="chart"><b>💳 Monthly Bill Collection Growth</b>${bars(b)}</div><div class="chart"><b>🏢 Company Growth</b>${bars(companyGrowth())}</div>`}function billBadge(c){return due(c)<=0?'<span class="badge paidbadge">BILL PAID</span>':'<span class="badge unpaidbadge">BILL UNPAID</span>'}function card(c){let dv=due(c),pp=paid(c),run=Math.max(0,Number(c.fee||0)-Math.min(Number(c.fee||0),pp)),num=esc(c.phone||'');return `<div class="customer"><div class="cmain"><div class="avatar">${esc((c.name||'?')[0].toUpperCase())}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${num} • ${esc(c.pkg||'')}</div></div><span class="badge ${c.status}">${String(c.status).toUpperCase()}</span></div><div class="actions">${billBadge(c)}</div><div class="detail"><span>Connection Date</span><b>${esc(c.connectionDate||'—')}</b></div><div class="detail"><span>Expiry Date</span><b>${esc(c.expiry||'—')}</b></div><div class="detail"><span>Monthly Bill</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Running Bill</span><b>${money(run)}</b></div><div class="detail"><span>Total Due</span><b>${money(dv)}</b></div><div class="actions"><button class="small call" onclick="callCustomer('${num}')">📞 Call</button><button class="small wa" onclick="waCustomer('${num}')">WhatsApp</button><button class="small view" onclick="go('details',{id:'${c.id}'})">Details</button>${dv>0?`<button class="small pay" onclick="payCustomer('${c.id}')">Pay</button>`:''}</div></div>`}function customers(){fix();let f=opts.filter||'all',list=d.customers;if(['active','inactive','expired','paid','unpaid','previous'].includes(f)){if(f==='paid')list=list.filter(c=>due(c)<=0);else if(f==='unpaid')list=list.filter(c=>due(c)>0);else if(f==='previous')list=list.filter(c=>Number(c.prevDue||0)>0);else list=list.filter(c=>c.status===f)}return `<h1 class="title">Customers</h1><button class="btn green full" onclick="addCustomer()">＋ Add Customer</button><div class="section"><div class="pdfgrid"><button class="pdfbtn" onclick="pdfList('all')">📄 All Customer List PDF</button><button class="pdfbtn" onclick="pdfList('unpaid')">📄 Unpaid Customer List PDF</button><button class="pdfbtn" onclick="pdfList('expired')">📄 Expired Customer List PDF</button><button class="pdfbtn" onclick="pdfList('paid')">📄 Paid Customer List PDF</button></div></div>${list.length?list.map(card).join(''):`<div class="section muted">No customers found.</div>`}`}function addCustomer(){openSheet(`<h3>Add Customer</h3><input id="n" class="input" placeholder="Customer name"><input id="p" class="input" placeholder="Mobile / WhatsApp"><input id="a" class="input" placeholder="Address"><input id="pkg" class="input" placeholder="Package"><input id="fee" class="input" type="number" placeholder="Monthly fee"><input id="pp" class="input" placeholder="PPPoE username"><input id="pw" class="input" placeholder="PPPoE password"><input id="onu" class="input" placeholder="ONU MAC Address"><label class="muted">Connection Date</label><input id="cd" class="input" type="date" value="${today()}"><label class="muted">Expiry Date</label><input id="ex" class="input" type="date"><input id="prev" class="input" type="number" value="0" placeholder="Previous due"><select id="st" class="select"><option value="active">Active</option><option value="inactive">Inactive</option></select><button class="btn green full" onclick="saveCustomer()">Save Customer</button>`)}function saveCustomer(){let c={id:Date.now().toString(),name:n.value.trim(),phone:p.value.trim(),address:a.value.trim(),pkg:pkg.value.trim(),fee:Number(fee.value||0),pppoe:pp.value.trim(),pppoePassword:pw.value,onu:onu.value.trim(),connectionDate:cd.value||today(),expiry:ex.value||'',prevDue:Number(prev.value||0),status:st.value,createdAt:today()};if(!c.name||!c.phone){toast('Name and mobile required');return}d.customers.push(c);save();closeSheet();toast('Customer saved');render()}function payCustomer(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;openSheet(`<h3>Customer Bill Payment</h3><div class="detail"><span>Customer</span><b>${esc(c.name)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Current Bill</span><b>${money(billDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><input id="amt" class="input" type="number" value="${due(c)}" placeholder="Payment amount"><input id="ref" class="input" placeholder="Reference / note"><button class="btn green full" onclick="savePayment('${c.id}')">Confirm Paid</button>`)}function savePayment(id){let amount=Number(amt.value||0);if(amount<=0)return;d.payments.push({id:Date.now().toString(),customer:id,amount,date:today(),month:month(),status:'paid',source:'manual',ref:ref.value||''});let c=d.customers.find(x=>String(x.id)===String(id));if(c){let remain=Math.max(0,due(c)-amount);if(Number(c.prevDue||0)>0){let prev=Math.max(0,Number(c.prevDue||0)-amount);c.prevDue=prev}}save();try{if(c&&due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}closeSheet();toast('Bill Paid');render()}function details(){let c=d.customers.find(x=>String(x.id)===String(opts.id));if(!c){go('customers');return}let hist=d.payments.filter(x=>String(x.customer)===String(c.id)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `<h1 class="title">Customer Details</h1><button class="btn light" onclick="appBack()">← Back</button><div class="customer"><div class="cmain"><div class="avatar">${esc((c.name||'?')[0])}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone)}</div></div><span class="badge ${c.status}">${c.status}</span></div><div class="detail"><span>Connection Date</span><b>${esc(c.connectionDate||'—')}</b></div><div class="detail"><span>Expiry Date</span><b>${esc(c.expiry||'—')}</b></div><div class="detail"><span>Address</span><b>${esc(c.address)}</b></div><div class="detail"><span>Package</span><b>${esc(c.pkg)}</b></div><div class="detail"><span>Monthly</span><b>${money(c.fee)}</b></div><div class="detail"><span>PPPoE Username</span><b>${esc(c.pppoe||'—')}</b></div><div class="detail"><span>PPPoE Password</span><b>${esc(c.pppoePassword||'—')}</b></div><div class="detail"><span>ONU MAC</span><b>${esc(c.onu||'—')}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Running Bill</span><b>${money(billDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><div class="actions"><button class="small call" onclick="callCustomer('${esc(c.phone)}')">📞 Call</button><button class="small wa" onclick="waCustomer('${esc(c.phone)}')">WhatsApp</button><button class="small pay" onclick="payCustomer('${c.id}')">Customer Bill Payment</button></div></div><div class="section"><h3>Payment History</h3>${hist.length?hist.map(x=>`<div class="detail"><span>${esc(x.date)} • ${esc(x.month||'')} • ${esc(x.source||'manual')}</span><b>${money(x.amount)}</b></div>`).join(''):'<div class="muted">No payments yet.</div>'}</div>`}function callCustomer(n){n=String(n||'').replace(/[^0-9+]/g,'');if(n)location.href='tel:'+n}function waCustomer(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('0'))x='880'+x.slice(1);if(x.length<10){toast('Valid WhatsApp number required');return}location.href='https://wa.me/'+x}function billing(){let p=d.pending.filter(x=>x.status==='pending');return `<h1 class="title">Billing & Merchant</h1><div class="section"><h3>💳 Customer Bill Payment</h3><div class="muted">Pay any customer's current bill or previous due directly from this section.</div><select id="payselect" class="select"><option value="">Select customer</option>${d.customers.map(c=>`<option value="${c.id}">${esc(c.name)} • ${esc(c.phone)} • Due ${money(due(c))}</option>`).join('')}</select><button class="btn green full" onclick="billingPaySelected()">Customer Bill Payment</button></div><div class="section"><h3>📅 This Month</h3><div class="kpi"><span>Paid Customers</span><b>${d.customers.filter(c=>due(c)<=0).length}</b></div><div class="kpi"><span>Unpaid Customers</span><b>${d.customers.filter(c=>due(c)>0).length}</b></div><button class="btn light full" onclick="go('customers',{filter:'unpaid'})">View Unpaid Customer List</button><button class="btn light full" style="margin-top:7px" onclick="go('customers',{filter:'previous'})">View Previous Due</button></div><div class="section"><h3>Company Merchant Number</h3><div class="muted">Set your company bKash merchant number in Settings. Real bKash API/webhook will be connected later.</div><div class="detail"><span>Merchant</span><b>${esc(d.settings.merchantNumber||'Not set')}</b></div><button class="btn dark full" onclick="openSettings()">⚙️ Merchant Settings</button></div><div class="section"><h3>Pending Incoming Payments</h3>${p.length?p.map(x=>`<div class="customer pending"><div class="name">${money(x.amount)} • ${esc(x.sender||'Unknown')}</div><div class="muted">${esc(x.date)} • Matched: ${esc(x.customerName||'Not matched')}</div><div class="actions"><button class="small pay" onclick="confirmPending('${x.id}')">Manual Paid</button><button class="small view" onclick="cancelPending('${x.id}')">Cancel</button></div></div>`).join(''):'<div class="muted">No pending transactions.</div>'}</div><div class="section"><button class="btn green full" onclick="addIncoming()">＋ Add Incoming Transaction</button><div class="muted" style="margin-top:7px">No transaction is auto-paid.</div></div>`}function billingPaySelected(){let id=payselect.value;if(!id){toast('Select a customer');return}payCustomer(id)}function addIncoming(){openSheet(`<h3>Incoming Merchant Transaction</h3><input id="sender" class="input" placeholder="Sender bKash number"><input id="inamt" class="input" type="number" placeholder="Amount"><input id="tid" class="input" placeholder="Transaction ID"><button class="btn full" onclick="saveIncoming()">Save as Pending</button>`)}function normalize(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('880'))x='0'+x.slice(3);return x}function saveIncoming(){let s=normalize(sender.value),c=d.customers.find(c=>normalize(c.phone).slice(-10)===s.slice(-10));d.pending.push({id:Date.now().toString(),sender:s,amount:Number(inamt.value||0),transactionId:tid.value||'',date:today(),status:'pending',customer:c?c.id:'',customerName:c?c.name:''});save();closeSheet();toast(c?'Matched customer — Pending':'Saved Pending');render()}function confirmPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(!p)return;let c=p.customer?d.customers.find(x=>String(x.id)===String(p.customer)):null;if(!c){let s=prompt('Customer mobile for manual match:');if(!s)return;c=d.customers.find(x=>normalize(x.phone).slice(-10)===normalize(s).slice(-10));if(!c){toast('Customer not found');return}p.customer=c.id;p.customerName=c.name}d.payments.push({id:Date.now().toString(),customer:c.id,amount:Number(p.amount||0),date:today(),month:month(),status:'paid',source:'merchant',ref:p.transactionId||''});p.status='paid';p.confirmedAt=today();save();try{if(c&&due(c)<=0&&window.AndroidBridge){AndroidBridge.cancelExpiry(String(c.phone||''));AndroidBridge.sendAutoPaid(String(c.phone||''),String(c.name||'Customer'),String(c.id||''),String(c.address||''),String(c.pkg||''),String(c.fee||0),String(c.prevDue||0),String(due(c)||0));}}catch(e){}toast('Manual Paid confirmed');render()}function cancelPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(p){p.status='cancelled';save();toast('Transaction cancelled');render()}}function analytics(){return `<h1 class="title">Growth & Analytics</h1><div class="chart"><b>🆕 New Connection Growth</b>${bars(newGrowth(),'greenbar')}</div><div class="chart"><b>💳 Monthly Bill Collection Growth</b>${bars(monthlyBills())}</div><div class="chart"><b>🏢 Company Growth</b><div class="muted">Income − expenses</div>${bars(companyGrowth())}</div>`}function accounts(){return `<h1 class="title">Accounts</h1><div class="moneygrid"><div class="moneybox"><span class="muted">Total Income</span><b>${money(totalIncome())}</b></div><div class="moneybox"><span class="muted">Total Expense</span><b>${money(totalExpense())}</b></div><div class="moneybox"><span class="muted">Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><div class="detail"><span>Bill Collection Income</span><b>${money(billIncome())}</b></div><div class="detail"><span>Other Income</span><b>${money(otherIncome())}</b></div><div class="detail"><span>Total Income</span><b>${money(totalIncome())}</b></div><div class="detail"><span>Total Expense</span><b>${money(totalExpense())}</b></div><div class="detail"><span>Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><button class="btn green full" onclick="addIncome()">＋ Add Income</button><button class="btn red full" style="margin-top:7px" onclick="addExpense()">＋ Add Expense</button></div>`}function addIncome(){openSheet(`<h3>Add Income</h3><input id="ie" class="input" type="number" placeholder="Amount"><input id="inote" class="input" placeholder="Income source / note"><button class="btn green full" onclick="saveOtherIncome()">Add Income</button>`)}function saveOtherIncome(){let v=Number(ie.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'income',amount:v,date:today(),note:inote.value||''});save();closeSheet();toast('Income added');render()}function addExpense(){openSheet(`<h3>Add Expense</h3><input id="ee" class="input" type="number" placeholder="Amount"><input id="enote" class="input" placeholder="Expense note"><button class="btn red full" onclick="saveExpense()">Add Expense</button>`)}function saveExpense(){let v=Number(ee.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'expense',amount:v,date:today(),note:enote.value||''});save();closeSheet();toast('Expense added');render()}function monitor(){return `<h1 class="title">Live Monitoring</h1><div class="section"><h3>📡 OLT Status</h3><div class="kpi"><span>Status</span><b>Not Connected</b></div><div class="kpi"><span>Online Customers</span><b>${d.customers.filter(c=>c.status==='active').length}</b></div><div class="kpi"><span>Offline / Inactive</span><b>${d.customers.filter(c=>c.status!=='active').length}</b></div><button class="btn dark full" onclick="openSettings()">Configure OLT</button></div><div class="section"><div class="muted">OLT IP, username, password and vendor are prepared in Settings. Actual live OLT API/SSH/SNMP connection still needs vendor-specific backend integration.</div></div>`}function openSettings(){closeDrawer();openSheet(`<h3>⚙️ Settings</h3><div class="section" style="padding:10px;margin:0 0 10px"><b>☁️ Cloud Account / Multi-device Sync</b><input id="capi" class="input" value="${esc(d.settings.cloud?.apiUrl||'')}" placeholder="HTTPS Backend API URL"><input id="cuser" class="input" value="${esc(d.settings.cloud?.username||'')}" placeholder="Username"><input id="cpass" class="input" type="password" placeholder="Password"><button class="btn green full" onclick="cloudLoginAndSync()">Login & Sync</button><button class="btn dark full" style="margin-top:7px" onclick="manualCloudSync()">Sync Now</button><div class="muted" style="margin-top:7px">Same account on another phone loads the same cloud data. Password is not stored in the APK.</div></div><input id="mn" class="input" value="${esc(d.settings.merchantNumber||'')}" placeholder="Company bKash Merchant Number"><div class="muted">Only this company merchant number is used for incoming customer payments.</div><input id="ip" class="input" value="${esc(d.settings.olt.ip)}" placeholder="OLT IP"><input id="ou" class="input" value="${esc(d.settings.olt.user)}" placeholder="OLT Username"><input id="op" class="input" value="${esc(d.settings.olt.password)}" placeholder="OLT Password"><input id="ov" class="input" value="${esc(d.settings.olt.vendor)}" placeholder="OLT Vendor"><input id="prt" class="input" type="number" value="${esc(d.settings.olt.port)}" placeholder="Port"><button class="btn dark full" onclick="saveSettings()">Save Settings</button><button class="btn light full" style="margin-top:7px" onclick="closeSheet()">Back</button>`)}async function cloudLoginAndSync(){try{await cloudLogin(capi.value,cuser.value,cpass.value);await cloudSync(true);closeSheet();toast('Cloud login successful')}catch(e){toast('Cloud login: '+e.message)}}async function manualCloudSync(){try{await cloudSync(false)}catch(e){toast('Cloud sync: '+e.message)}}function saveSettings(){d.settings.merchantNumber=mn.value.trim();d.settings.olt={ip:ip.value.trim(),user:ou.value,password:op.value,vendor:ov.value.trim()||'VSOL',protocol:'SSH',port:Number(prt.value||22)};save();closeSheet();toast('Settings saved');render()}function safeBackupData(){
 let x=JSON.parse(JSON.stringify(d));
 if(x.settings&&x.settings.olt&&typeof x.settings.olt==='object')x.settings.olt.password='';
 if(x.settings&&x.settings.cloud&&typeof x.settings.cloud==='object')x.settings.cloud.token='';
 return x
}
function backupData(){let blob=new Blob([JSON.stringify(safeBackupData(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='STAR-COMMUNICATION-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Secure backup created')}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.customers))throw 0;if(!confirm('Restore this backup? Current data will be replaced by selected backup.'))return;d=x;save();render();toast('Backup restored')}catch(_){toast('Invalid backup')}};r.readAsText(f)}function pdfList(type){try{type=String(type||'all').toLowerCase();fix();let list=(d.customers||[]).slice();if(type==='unpaid')list=list.filter(c=>due(c)>0);else if(type==='expired')list=list.filter(c=>String(c.status||'').toLowerCase()==='expired');else if(type==='paid')list=list.filter(c=>due(c)<=0);let title=type==='unpaid'?'Unpaid Customer List':type==='expired'?'Expired Customer List':type==='paid'?'Paid Customer List':'All Customer List';let rows=list.map(function(c,i){return{serial:i+1,id:String(c.id||''),name:String(c.name||''),phone:String(c.phone||''),address:String(c.address||''),pkg:String(c.pkg||''),fee:Number(c.fee||0),pppoe:String(c.pppoe||''),pppoePassword:String(c.pppoePassword||''),onu:String(c.onu||''),connectionDate:String(c.connectionDate||'—'),expiry:String(c.expiry||'—'),prevDue:Number(c.prevDue||0),runningBill:Number(billDue(c)||0),totalDue:Number(due(c)||0),status:String(c.status||'').toUpperCase()};});let body=JSON.stringify(rows);if(window.AndroidBridge&&typeof AndroidBridge.createCustomerPdf==='function'){AndroidBridge.createCustomerPdf(JSON.stringify({title:title,rows:rows}));return}if(window.AndroidBridge&&typeof AndroidBridge.printPage==='function'){let p=document.getElementById('printArea');p.innerHTML='<div style="font-family:Arial;padding:20px"><h1>STAR COMMUNICATION</h1><h2>'+esc(title)+'</h2>'+rows.map(function(r){return '<div style="border:1px solid #bbb;padding:12px;margin:12px 0"><b>#'+r.serial+' '+esc(r.name)+'</b><br>Client ID: '+esc(r.id)+'<br>Mobile: '+esc(r.phone)+'<br>Address: '+esc(r.address)+'<br>Package: '+esc(r.pkg)+'<br>Monthly Bill: '+money(r.fee)+'<br>PPPoE Username: '+esc(r.pppoe)+'<br>PPPoE Password: '+esc(r.pppoePassword)+'<br>ONU ID: '+esc(r.onu)+'<br>Connection Date: '+esc(r.connectionDate)+'<br>Expiry Date: '+esc(r.expiry)+'<br>Previous Due: '+money(r.prevDue)+'<br>Running Bill: '+money(r.runningBill)+'<br><b>Total Due: '+money(r.totalDue)+'</b><br>Status: '+esc(r.status)+'</div>';}).join('')+'</div>';p.style.display='block';setTimeout(function(){AndroidBridge.printPage(title);setTimeout(function(){p.style.display='none'},5000)},100);return}window.print()}catch(e){try{toast('PDF error: '+e.message)}catch(_){alert('PDF error')}}}function render(){fix();let html=page==='dashboard'?dashboard():page==='customers'?customers():page==='details'?details():page==='billing'?billing():page==='analytics'?analytics():page==='accounts'?accounts():page==='monitor'?monitor():dashboard();document.getElementById('content').innerHTML=html;setNav()}render();setTimeout(()=>{if(cloudConfig().token)cloudSync(false)},900);</script></body></html>
