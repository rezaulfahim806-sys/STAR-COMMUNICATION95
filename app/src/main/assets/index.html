<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b2145"><title>STAR COMMUNICATION</title><style>:root{--nav:#0b2145;--blue:#1677d2;--green:#119b50;--red:#e53935;--orange:#ed7d16;--purple:#7656d6;--bg:#f3f6fa;--text:#17253a;--muted:#6b778c;--line:#e3e8ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);font-size:14px}.app{max-width:520px;margin:auto;min-height:100vh;background:#f7f9fc}.header{height:62px;background:var(--nav);color:#fff;padding:8px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0002}.top{height:46px;display:flex;align-items:center;gap:8px}.logo{width:38px;height:38px;border-radius:10px}.icon{width:36px;border:0;background:transparent;color:#fff;font-size:24px}.brand{font-size:18px;font-weight:900;flex:1}.content{padding:12px 11px 86px}.title{font-size:21px;margin:3px 2px 5px}.sub,.muted{font-size:11px;color:var(--muted)}.sub{margin:0 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{min-height:91px;border-radius:15px;padding:11px;color:#fff;box-shadow:0 4px 13px #0001;cursor:pointer}.stat .label{font-size:12px;font-weight:800}.stat .num{font-size:23px;font-weight:900;margin-top:9px;white-space:nowrap}.blue{background:var(--blue)}.green{background:var(--green)}.red{background:var(--red)}.orange{background:var(--orange)}.purple{background:var(--purple)}.navy{background:var(--nav)}.section,.customer,.chart{background:#fff;border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 3px 12px #0000000a}.section h3{font-size:15px;margin:0 0 8px}.row{display:flex;gap:7px}.row>*{flex:1}.input,.select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0;margin:4px 0}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:800;background:var(--blue);color:#fff}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.dark{background:var(--nav)}.btn.light{background:#edf2f7;color:var(--nav)}.full{width:100%}.kpi{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #edf0f4}.kpi:last-child{border:0}.moneygrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.moneybox{border-radius:11px;padding:9px;background:#f5f8fc}.moneybox b{display:block;font-size:16px;margin-top:4px}.cmain{display:flex;gap:9px;align-items:center}.avatar{width:40px;height:40px;border-radius:11px;background:#e6f1ff;color:#0877c9;display:flex;align-items:center;justify-content:center;font-weight:900}.grow{flex:1;min-width:0}.name{font-weight:900}.badge{padding:4px 7px;border-radius:14px;font-size:9px;font-weight:900}.active{background:#dcfce7;color:#15803d}.inactive{background:#e5e7eb;color:#475569}.expired{background:#fee2e2;color:#b91c1c}.detail{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef1f5}.actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.small{border:0;border-radius:8px;padding:7px 8px;font-size:10px;font-weight:800}.wa{background:#25d366;color:#fff}.call{background:#e8f1ff;color:#1267c7}.pay{background:var(--green);color:#fff}.view{background:#edf0f5;color:#334155}.pending{border-left:4px solid var(--orange)}.success{color:#15803d}.danger{color:#c62828}.chartbars{height:118px;display:flex;gap:3px;align-items:flex-end}.barcol{flex:1;text-align:center;font-size:8px;color:var(--muted)}.bar{width:65%;max-width:20px;margin:3px auto;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#2d83cf,#0b2145)}.bar.greenbar{background:linear-gradient(180deg,#25bf70,#119b50)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:66px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:30}.bottom button{flex:1;border:0;background:#fff;color:#566070;font-size:9px}.bottom button.on{color:#0877c9;font-weight:900}.bottom span{display:block;font-size:19px;margin-bottom:2px}.drawerShade{display:none;position:fixed;inset:0;background:#0008;z-index:50}.drawerShade.show{display:block}.drawer{width:292px;max-width:86%;height:100%;background:var(--nav);color:#fff;padding:15px}.close{float:right;border:0;background:transparent;color:#fff;font-size:27px}.menu{margin-top:25px}.menu button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px 8px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:15px}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:9px 12px;border-radius:9px;display:none;z-index:80;font-size:12px}.toast.show{display:block}</style></head><body><div class="app"><header class="header"><div class="top"><button class="icon" onclick="openDrawer()">☰</button><img class="logo" src="logo.svg"><div class="brand">STAR COMMUNICATION</div><button class="icon" onclick="go('customers')">⌕</button></div></header><main id="content" class="content"></main><nav class="bottom"><button id="nav-dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button id="nav-customers" onclick="go('customers')"><span>👥</span>Customer</button><button id="nav-monitor" onclick="go('monitor')"><span>📡</span>Monitor</button><button id="nav-billing" onclick="go('billing')"><span>💳</span>Billing</button><button id="nav-accounts" onclick="go('accounts')"><span>💰</span>Accounts</button></nav></div><div id="shade" class="drawerShade" onclick="closeDrawer()"><aside class="drawer" onclick="event.stopPropagation()"><button class="close" onclick="closeDrawer()">×</button><div style="display:flex;gap:9px;align-items:center"><img class="logo" src="logo.svg"><div><b>STAR COMMUNICATION</b><div style="font-size:11px;color:#cbd7ea">ISP Manager</div></div></div><div class="menu"><button onclick="go('dashboard');closeDrawer()">🏠 Dashboard</button><button onclick="go('customers');closeDrawer()">👥 Customers</button><button onclick="go('monitor');closeDrawer()">📡 Live Monitoring</button><button onclick="go('billing');closeDrawer()">💳 Billing & Merchant</button><button onclick="go('analytics');closeDrawer()">📈 Growth & Analytics</button><button onclick="go('accounts');closeDrawer()">💰 Accounts</button><button onclick="openSettings()">⚙️ Settings</button><button onclick="backupData()">⬇️ Backup Data</button><button onclick="document.getElementById('restore').click()">⬆️ Restore Data</button></div></aside></div><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script>'use strict';const KEY='star_communication_final_v2',DEF={customers:[],payments:[],expenses:[],pending:[],history:[],settings:{app:'STAR COMMUNICATION',password:'1234',merchantNumber:'',olt:{ip:'',user:'',password:'',vendor:'VSOL',protocol:'SSH',port:22}}};let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}if(!d)d=JSON.parse(JSON.stringify(DEF));['customers','payments','expenses','pending','history'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.settings=Object.assign({},DEF.settings,d.settings||{});d.settings.olt=Object.assign({},DEF.settings.olt,d.settings.olt||{});let page='dashboard',opts={},stack=[];const today=()=>new Date().toISOString().slice(0,10),month=()=>today().slice(0,7),money=n=>'৳'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(d))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function openDrawer(){document.getElementById('shade').classList.add('show')}function closeDrawer(){document.getElementById('shade').classList.remove('show')}function openSheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeSheet(){document.getElementById('modal').classList.remove('show')}function go(p,o={},push=true){if(push&&page!==p)stack.push({page,opts});page=p;opts=o;render()}function appBack(){if(document.getElementById('modal').classList.contains('show')){closeSheet();return}closeDrawer();if(stack.length){let x=stack.pop();page=x.page;opts=x.opts||{};render()}else if(page!=='dashboard'){page='dashboard';opts={};render()}}function setNav(){['dashboard','customers','monitor','billing','accounts'].forEach(x=>document.getElementById('nav-'+x)?.classList.toggle('on',x===page))}function paid(c){return d.payments.filter(x=>String(x.customer)===String(c.id)&&x.month===month()&&x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function due(c){return Math.max(0,Number(c.prevDue||0)+Number(c.fee||0)-paid(c))}function fix(){let ch=false;d.customers.forEach(c=>{if(c.expiry&&c.expiry<today()&&c.status!=='expired'){c.status='expired';ch=true}});if(ch)save()}function billIncome(){return d.payments.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function otherIncome(){return d.expenses.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0)}function totalIncome(){return billIncome()+otherIncome()}function totalExpense(){return d.expenses.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0)}function netBalance(){return totalIncome()-totalExpense()}function totalPaid(){return d.payments.filter(x=>x.month===month()&&x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function totalUnpaid(){return d.customers.filter(c=>c.status==='active'&&due(c)>0).reduce((a,c)=>a+due(c),0)}function newGrowth(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.customers.forEach(c=>{let s=String(c.createdAt||c.created||c.connectionDate||'');if(s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]++});return a}function monthlyBills(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.payments.forEach(x=>{let s=String(x.month||x.date||'');if(x.status==='paid'&&s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]+=Number(x.amount||0)});return a}function companyGrowth(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.payments.forEach(x=>{let s=String(x.month||x.date||'');if(x.status==='paid'&&s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]+=Number(x.amount||0)});d.expenses.forEach(x=>{let s=String(x.date||'');if(s.startsWith(String(y))&&s.length>=7)a[Number(s.slice(5,7))-1]-=Number(x.amount||0)});return a}function bars(vals,cls=''){let mx=Math.max(1,...vals.map(v=>Math.abs(v))),ns=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `<div class="chartbars">${vals.map((v,i)=>`<div class="barcol"><b>${v?Math.round(v):''}</b><div class="bar ${cls}" style="height:${Math.max(3,Math.round(Math.abs(v)/mx*82))}px"></div>${ns[i]}</div>`).join('')}</div>`}function dashboard(){fix();let g=newGrowth(),b=monthlyBills(),m=Number(month().slice(5,7))-1;return `<h1 class="title">Dashboard</h1><div class="sub">${month()} • Data is stored locally and never auto-deleted</div><div class="grid"><div class="stat blue" onclick="go('customers',{filter:'all'})"><div class="label">Total Customer</div><div class="num">${d.customers.length}</div></div><div class="stat green" onclick="go('customers',{filter:'active'})"><div class="label">Active Customer</div><div class="num">${d.customers.filter(c=>c.status==='active').length}</div></div><div class="stat navy" onclick="go('customers',{filter:'inactive'})"><div class="label">Inactive Customer</div><div class="num">${d.customers.filter(c=>c.status==='inactive').length}</div></div><div class="stat red" onclick="go('customers',{filter:'expired'})"><div class="label">Expired Customer</div><div class="num">${d.customers.filter(c=>c.status==='expired').length}</div></div><div class="stat purple"><div class="label">Total Paid</div><div class="num">${money(totalPaid())}</div></div><div class="stat orange"><div class="label">Total Unpaid</div><div class="num">${money(totalUnpaid())}</div></div></div><div class="section"><h3>💰 Finance Summary</h3><div class="moneygrid"><div class="moneybox"><span class="muted">Total Income</span><b class="success">${money(totalIncome())}</b></div><div class="moneybox"><span class="muted">Total Expense</span><b class="danger">${money(totalExpense())}</b></div><div class="moneybox"><span class="muted">Net Balance</span><b>${money(netBalance())}</b></div></div><div class="detail"><span>Bill Collection Income</span><b>${money(billIncome())}</b></div><div class="detail"><span>Other Income</span><b>${money(otherIncome())}</b></div></div><div class="section"><div class="kpi"><span>🆕 New connections this month</span><b>${g[m]}</b></div><div class="kpi"><span>💳 Pending merchant payments</span><b>${d.pending.filter(x=>x.status==='pending').length}</b></div></div><div class="chart"><b>📈 Monthly New Connection Growth</b><div class="muted">Separate from bill collection</div>${bars(g,'greenbar')}</div><div class="chart"><b>💳 Monthly Bill Collection Growth</b><div class="muted">Only confirmed paid bills</div>${bars(b)}</div><div class="chart"><b>🏢 Company Growth</b><div class="muted">Monthly income − expenses</div>${bars(companyGrowth())}</div>`}function card(c){let dv=due(c),pp=paid(c),run=Math.max(0,Number(c.fee||0)-Math.min(Number(c.fee||0),pp)),num=esc(c.phone||'');return `<div class="customer"><div class="cmain"><div class="avatar">${esc((c.name||'?')[0].toUpperCase())}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${num} • ${esc(c.pkg||'')}</div></div><span class="badge ${c.status}">${String(c.status).toUpperCase()}</span></div><div class="detail"><span>Monthly Bill</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Running Bill</span><b>${money(run)}</b></div><div class="detail"><span>Total Due</span><b>${money(dv)}</b></div><div class="actions"><button class="small call" onclick="callCustomer('${num}')">📞 Call</button><button class="small wa" onclick="waCustomer('${num}')">WhatsApp</button><button class="small view" onclick="go('details',{id:'${c.id}'})">Details</button>${dv>0?`<button class="small pay" onclick="payCustomer('${c.id}')">Pay</button>`:''}</div></div>`}function customers(){fix();let f=opts.filter||'all',list=d.customers;if(f==='active'||f==='inactive'||f==='expired')list=list.filter(c=>c.status===f);if(f==='paid')list=list.filter(c=>due(c)<=0);if(f==='unpaid')list=list.filter(c=>due(c)>0);return `<h1 class="title">Customers</h1><button class="btn green full" onclick="addCustomer()">＋ Add Customer</button>${list.length?list.map(card).join(''):`<div class="section muted">No customers found.</div>`}`}function addCustomer(){openSheet(`<h3>Add Customer</h3><input id="n" class="input" placeholder="Customer name"><input id="p" class="input" placeholder="Mobile / WhatsApp"><input id="a" class="input" placeholder="Address"><input id="pkg" class="input" placeholder="Package"><input id="fee" class="input" type="number" placeholder="Monthly fee"><input id="pp" class="input" placeholder="PPPoE username"><input id="pw" class="input" placeholder="PPPoE password"><input id="onu" class="input" placeholder="ONU ID"><input id="cd" class="input" type="date" value="${today()}"><input id="ex" class="input" type="date"><input id="prev" class="input" type="number" value="0" placeholder="Previous due"><select id="st" class="select"><option value="active">Active</option><option value="inactive">Inactive</option></select><button class="btn green full" onclick="saveCustomer()">Save Customer</button>`)}function saveCustomer(){let c={id:Date.now().toString(),name:n.value.trim(),phone:p.value.trim(),address:a.value.trim(),pkg:pkg.value.trim(),fee:Number(fee.value||0),pppoe:pp.value.trim(),pppoePassword:pw.value,onu:onu.value.trim(),connectionDate:cd.value||today(),expiry:ex.value||'',prevDue:Number(prev.value||0),status:st.value,createdAt:today()};if(!c.name||!c.phone){toast('Name and mobile required');return}d.customers.push(c);save();closeSheet();toast('Customer saved');render()}function payCustomer(id){let c=d.customers.find(x=>String(x.id)===String(id));if(!c)return;openSheet(`<h3>Manual Bill Payment</h3><div class="detail"><span>Customer</span><b>${esc(c.name)}</b></div><input id="amt" class="input" type="number" value="${due(c)}" placeholder="Amount"><input id="ref" class="input" placeholder="Reference / note"><button class="btn green full" onclick="savePayment('${c.id}')">Confirm Paid</button>`)}function savePayment(id){let amount=Number(amt.value||0);if(amount<=0)return;d.payments.push({id:Date.now().toString(),customer:id,amount,date:today(),month:month(),status:'paid',source:'manual',ref:ref.value||''});save();closeSheet();toast('Payment added');render()}function details(){let c=d.customers.find(x=>String(x.id)===String(opts.id));if(!c){go('customers');return}let hist=d.payments.filter(x=>String(x.customer)===String(c.id)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `<h1 class="title">Customer Details</h1><button class="btn light" onclick="appBack()">← Back</button><div class="customer"><div class="cmain"><div class="avatar">${esc((c.name||'?')[0])}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone)}</div></div><span class="badge ${c.status}">${c.status}</span></div><div class="detail"><span>Address</span><b>${esc(c.address)}</b></div><div class="detail"><span>Package</span><b>${esc(c.pkg)}</b></div><div class="detail"><span>Monthly</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><div class="actions"><button class="small call" onclick="callCustomer('${esc(c.phone)}')">📞 Call</button><button class="small wa" onclick="waCustomer('${esc(c.phone)}')">WhatsApp</button><button class="small pay" onclick="payCustomer('${c.id}')">Add Payment</button></div></div><div class="section"><h3>Payment History</h3>${hist.length?hist.map(x=>`<div class="detail"><span>${esc(x.date)} • ${esc(x.source||'manual')}</span><b>${money(x.amount)}</b></div>`).join(''):'<div class="muted">No payments yet.</div>'}</div>`}function callCustomer(n){n=String(n||'').replace(/[^0-9+]/g,'');if(n)location.href='tel:'+n}function waCustomer(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('0'))x='880'+x.slice(1);if(x.length<10){toast('Valid WhatsApp number required');return}location.href='https://wa.me/'+x}function billing(){let p=d.pending.filter(x=>x.status==='pending');return `<h1 class="title">Billing & Merchant</h1><div class="section"><h3>Company Merchant Number</h3><div class="muted">Set your company bKash merchant number in Settings. Real bKash API/webhook will be connected later.</div><div class="detail"><span>Merchant</span><b>${esc(d.settings.merchantNumber||'Not set')}</b></div><button class="btn dark full" onclick="openSettings()">⚙️ Merchant Settings</button></div><div class="section"><h3>Pending Incoming Payments</h3>${p.length?p.map(x=>`<div class="customer pending"><div class="name">${money(x.amount)} • ${esc(x.sender||'Unknown')}</div><div class="muted">${esc(x.date)} • Matched: ${esc(x.customerName||'Not matched')}</div><div class="actions"><button class="small pay" onclick="confirmPending('${x.id}')">Manual Paid</button><button class="small view" onclick="cancelPending('${x.id}')">Cancel</button></div></div>`).join(''):'<div class="muted">No pending transactions.</div>'}</div><div class="section"><button class="btn green full" onclick="addIncoming()">＋ Add Incoming Transaction</button><div class="muted" style="margin-top:7px">No transaction is auto-paid.</div></div>`}function addIncoming(){openSheet(`<h3>Incoming Merchant Transaction</h3><input id="sender" class="input" placeholder="Sender bKash number"><input id="inamt" class="input" type="number" placeholder="Amount"><input id="tid" class="input" placeholder="Transaction ID"><button class="btn full" onclick="saveIncoming()">Save as Pending</button>`)}function normalize(n){let x=String(n||'').replace(/\D/g,'');if(x.startsWith('880'))x='0'+x.slice(3);return x}function saveIncoming(){let s=normalize(sender.value),c=d.customers.find(c=>normalize(c.phone).slice(-10)===s.slice(-10));d.pending.push({id:Date.now().toString(),sender:s,amount:Number(inamt.value||0),transactionId:tid.value||'',date:today(),status:'pending',customer:c?c.id:'',customerName:c?c.name:''});save();closeSheet();toast(c?'Matched customer — Pending':'Saved Pending');render()}function confirmPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(!p)return;let c=p.customer?d.customers.find(x=>String(x.id)===String(p.customer)):null;if(!c){let s=prompt('Customer mobile for manual match:');if(!s)return;c=d.customers.find(x=>normalize(x.phone).slice(-10)===normalize(s).slice(-10));if(!c){toast('Customer not found');return}p.customer=c.id;p.customerName=c.name}d.payments.push({id:Date.now().toString(),customer:c.id,amount:Number(p.amount||0),date:today(),month:month(),status:'paid',source:'merchant',ref:p.transactionId||''});p.status='paid';p.confirmedAt=today();save();toast('Manual Paid confirmed');render()}function cancelPending(id){let p=d.pending.find(x=>String(x.id)===String(id));if(p){p.status='cancelled';save();toast('Transaction cancelled');render()}}function analytics(){return `<h1 class="title">Growth & Analytics</h1><div class="chart"><b>🆕 New Connection Growth</b>${bars(newGrowth(),'greenbar')}</div><div class="chart"><b>💳 Monthly Bill Collection Growth</b>${bars(monthlyBills())}</div><div class="chart"><b>🏢 Company Growth</b><div class="muted">Income − expenses</div>${bars(companyGrowth())}</div>`}function accounts(){return `<h1 class="title">Accounts</h1><div class="moneygrid"><div class="moneybox"><span class="muted">Total Income</span><b>${money(totalIncome())}</b></div><div class="moneybox"><span class="muted">Total Expense</span><b>${money(totalExpense())}</b></div><div class="moneybox"><span class="muted">Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><div class="detail"><span>Bill Collection Income</span><b>${money(billIncome())}</b></div><div class="detail"><span>Other Income</span><b>${money(otherIncome())}</b></div><div class="detail"><span>Total Income</span><b>${money(totalIncome())}</b></div><div class="detail"><span>Total Expense</span><b>${money(totalExpense())}</b></div><div class="detail"><span>Net Balance</span><b>${money(netBalance())}</b></div></div><div class="section"><button class="btn green full" onclick="addIncome()">＋ Add Income</button><button class="btn red full" style="margin-top:7px" onclick="addExpense()">＋ Add Expense</button></div>`}function addIncome(){openSheet(`<h3>Add Income</h3><input id="ie" class="input" type="number" placeholder="Amount"><input id="inote" class="input" placeholder="Income source / note"><button class="btn green full" onclick="saveOtherIncome()">Add Income</button>`)}function saveOtherIncome(){let v=Number(ie.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'income',amount:v,date:today(),note:inote.value||''});save();closeSheet();toast('Income added to Total Income');render()}function addExpense(){openSheet(`<h3>Add Expense</h3><input id="ee" class="input" type="number" placeholder="Amount"><input id="enote" class="input" placeholder="Expense note"><button class="btn red full" onclick="saveExpense()">Add Expense</button>`)}function saveExpense(){let v=Number(ee.value||0);if(v<=0)return;d.expenses.push({id:Date.now().toString(),type:'expense',amount:v,date:today(),note:enote.value||''});save();closeSheet();toast('Expense added');render()}function monitor(){return `<h1 class="title">Live Monitoring</h1><div class="section"><h3>📡 OLT Status</h3><div class="kpi"><span>Status</span><b>Not Connected</b></div><div class="kpi"><span>Online Customers</span><b>${d.customers.filter(c=>c.status==='active').length}</b></div><div class="kpi"><span>Offline / Inactive</span><b>${d.customers.filter(c=>c.status!=='active').length}</b></div><button class="btn dark full" onclick="openSettings()">Configure OLT</button></div><div class="section"><div class="muted">OLT IP, username, password and vendor are prepared in Settings. Actual OLT API connection will be added later.</div></div>`}function openSettings(){closeDrawer();openSheet(`<h3>⚙️ Settings</h3><input id="mn" class="input" value="${esc(d.settings.merchantNumber||'')}" placeholder="Company bKash Merchant Number"><div class="muted">Only this company merchant number is used for incoming customer payments.</div><input id="ip" class="input" value="${esc(d.settings.olt.ip)}" placeholder="OLT IP"><input id="ou" class="input" value="${esc(d.settings.olt.user)}" placeholder="OLT Username"><input id="op" class="input" value="${esc(d.settings.olt.password)}" placeholder="OLT Password"><input id="ov" class="input" value="${esc(d.settings.olt.vendor)}" placeholder="OLT Vendor"><input id="prt" class="input" type="number" value="${esc(d.settings.olt.port)}" placeholder="Port"><button class="btn dark full" onclick="saveSettings()">Save Settings</button><button class="btn light full" style="margin-top:7px" onclick="closeSheet()">Back</button>`)}function saveSettings(){d.settings.merchantNumber=mn.value.trim();d.settings.olt={ip:ip.value.trim(),user:ou.value.trim(),password:op.value,vendor:ov.value.trim()||'VSOL',protocol:'SSH',port:Number(prt.value||22)};save();closeSheet();toast('Settings saved');render()}function backupData(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='STAR-COMMUNICATION-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup created')}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.customers))throw 0;if(!confirm('Restore this backup? Current data will be replaced by selected backup.'))return;d=x;save();render();toast('Backup restored')}catch(_){toast('Invalid backup')}};r.readAsText(f)}function render(){let html=page==='dashboard'?dashboard():page==='customers'?customers():page==='details'?details():page==='billing'?billing():page==='analytics'?analytics():page==='accounts'?accounts():page==='monitor'?monitor():dashboard();document.getElementById('content').innerHTML=html;setNav()}render();</script></body></html>
