<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a56"><title>STAR COMMUNICATION</title><style>:root{--n:#102a56;--b:#1677d2;--g:#12a150;--r:#e53935;--o:#ef7d17;--p:#7656d6;--bg:#f4f7fb;--t:#152238;--m:#667085;--l:#e4e9f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--t)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:540px;margin:auto;min-height:100vh;background:#f7f9fc}.header{background:var(--n);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:20;box-shadow:0 3px 12px #0002}.top{display:flex;align-items:center;gap:10px}.icon{border:0;background:transparent;color:#fff;font-size:26px;width:38px}.brand{font-size:19px;font-weight:900;flex:1}.logo{width:38px;height:38px;border-radius:10px}.content{padding:16px 14px 94px}.title{font-size:24px;margin:2px 3px 13px}.sub,.muted{color:var(--m);font-size:12px}.sub{margin:-7px 4px 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{min-height:108px;border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 18px #0001}.stat .label{font-size:14px;font-weight:800}.stat .num{font-size:30px;font-weight:900}.blue{background:var(--b)}.green{background:var(--g)}.red{background:var(--r)}.orange{background:var(--o)}.purple{background:var(--p)}.slate{background:#65748b}.section,.customer,.chart{background:#fff;border-radius:17px;padding:14px;margin:10px 0;box-shadow:0 4px 15px #0000000b}.row{display:flex;gap:8px}.row>*{flex:1}.input,.select{width:100%;padding:12px;border:1px solid var(--l);border-radius:11px;background:#fff;outline:none;margin:5px 0}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:800;background:var(--b);color:#fff}.btn.green{background:var(--g)}.btn.red{background:var(--r)}.btn.dark{background:var(--n)}.btn.light{background:#edf2f8;color:var(--n)}.full{width:100%}.cmain{display:flex;gap:10px;align-items:center}.avatar{width:44px;height:44px;border-radius:12px;background:#e7f1ff;color:#0877dc;display:flex;align-items:center;justify-content:center;font-weight:900}.grow{flex:1;min-width:0}.name{font-weight:900}.badge{padding:5px 8px;border-radius:16px;font-size:9px;font-weight:900}.active{background:#dcfce7;color:#15803d}.inactive{background:#e5e7eb;color:#475569}.expired{background:#fee2e2;color:#b91c1c}.detail{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f5}.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.small{border:0;border-radius:9px;padding:8px 9px;font-size:11px;font-weight:800}.wa{background:#25d366;color:#fff}.call{background:#e8f1ff;color:#1267c7}.pay{background:var(--g);color:#fff}.view{background:#edf0f5;color:#334155}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);height:72px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:30}.bottom button{flex:1;border:0;background:#fff;color:#555;font-size:10px}.bottom button.on{color:#0877c9;font-weight:900}.bottom span{display:block;font-size:22px}.drawerShade{display:none;position:fixed;inset:0;background:#0008;z-index:50}.drawerShade.show{display:block}.drawer{width:305px;max-width:86%;height:100%;background:var(--n);color:#fff;padding:18px 15px}.close{float:right;border:0;background:transparent;color:#fff;font-size:28px}.menu{margin-top:28px}.menu button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:14px 10px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:80}.toast.show{display:block}.chartbars{height:145px;display:flex;gap:5px;align-items:flex-end}.barcol{flex:1;text-align:center;font-size:8px;color:var(--m)}.bar{width:70%;max-width:24px;margin:4px auto;border-radius:5px 5px 1px 1px;background:linear-gradient(180deg,#2d83cf,#102a56)}.kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef1f5}.pending{border-left:4px solid var(--o)}.danger{color:#c62828}.success{color:#15803d}</style></head><body><div class="app"><header class="header"><div class="top"><button class="icon" onclick="openDrawer()">☰</button><img class="logo" src="logo.svg"><div class="brand">STAR COMMUNICATION</div><button class="icon" onclick="go('customers')">⌕</button></div></header><main id="content" class="content"></main><nav class="bottom"><button id="nav-dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button id="nav-customers" onclick="go('customers')"><span>👥</span>Customer</button><button id="nav-monitor" onclick="go('monitor')"><span>📡</span>Monitor</button><button id="nav-billing" onclick="go('billing')"><span>💳</span>Billing</button><button id="nav-accounts" onclick="go('accounts')"><span>💰</span>Hesab</button></nav></div><div id="shade" class="drawerShade" onclick="closeDrawer()"><aside class="drawer" onclick="event.stopPropagation()"><button class="close" onclick="closeDrawer()">×</button><div style="display:flex;gap:10px;align-items:center"><img class="logo" src="logo.svg"><div><b>STAR COMMUNICATION</b><div class="muted" style="color:#ccd6e9">ISP Manager</div></div></div><div class="menu"><button onclick="go('dashboard');closeDrawer()">🏠 Dashboard</button><button onclick="go('customers');closeDrawer()">👥 Customers</button><button onclick="go('monitor');closeDrawer()">📡 Live Monitoring</button><button onclick="go('billing');closeDrawer()">💳 Billing & Merchant</button><button onclick="go('analytics');closeDrawer()">📈 Growth & Analytics</button><button onclick="go('accounts');closeDrawer()">💰 Accounts</button><button onclick="openSettings()">⚙️ Settings</button><button onclick="backupData()">⬇️ Backup Data</button><button onclick="document.getElementById('restore').click()">⬆️ Restore Data</button></div></aside></div><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div><script>'use strict';const KEY='star_communication_final_v2';const DEF={customers:[],payments:[],expenses:[],pending:[],history:[],settings:{app:'STAR COMMUNICATION',password:'1234',merchantNumber:'',olt:{ip:'',user:'',password:'',vendor:'VSOL',protocol:'SSH',port:22}}};let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}if(!d)d=JSON.parse(JSON.stringify(DEF));d.customers=Array.isArray(d.customers)?d.customers:[];d.payments=Array.isArray(d.payments)?d.payments:[];d.expenses=Array.isArray(d.expenses)?d.expenses:[];d.pending=Array.isArray(d.pending)?d.pending:[];d.history=Array.isArray(d.history)?d.history:[];d.settings=Object.assign({},DEF.settings,d.settings||{});d.settings.olt=Object.assign({},DEF.settings.olt,d.settings.olt||{});let page='dashboard',opts={},stack=[];const today=()=>new Date().toISOString().slice(0,10),month=()=>today().slice(0,7),money=n=>'৳'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(d))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function openDrawer(){document.getElementById('shade').classList.add('show')}function closeDrawer(){document.getElementById('shade').classList.remove('show')}function openSheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeSheet(){document.getElementById('modal').classList.remove('show')}function go(p,o={},push=true){if(push&&page!==p)stack.push({page,opts});page=p;opts=o;render()}function appBack(){if(document.getElementById('modal').classList.contains('show')){closeSheet();return}if(stack.length){let x=stack.pop();page=x.page;opts=x.opts||{};render()}else if(page!=='dashboard'){page='dashboard';opts={};render()}}function setNav(){['dashboard','customers','monitor','billing','accounts'].forEach(x=>document.getElementById('nav-'+x)?.classList.toggle('on',x===page))}function paid(c){return d.payments.filter(x=>String(x.customer)===String(c.id)&&x.month===month()&&x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function due(c){return Math.max(0,Number(c.prevDue||0)+Number(c.fee||0)-paid(c))}function fix(){let ch=false;d.customers.forEach(c=>{if(c.expiry&&c.expiry<today()&&c.status!=='expired'){c.status='expired';ch=true}});if(ch)save()}function unpaid(){return d.customers.filter(c=>c.status!=='inactive'&&c.status!=='expired'&&due(c)>0)}function paidList(){return d.customers.filter(c=>Number(c.fee||0)>0&&due(c)<=0)}function totalPaid(){return d.payments.filter(x=>x.month===month()&&x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)}function totalUnpaid(){return unpaid().reduce((a,c)=>a+due(c),0)}function income(){return d.payments.filter(x=>x.status==='paid').reduce((a,x)=>a+Number(x.amount||0),0)+d.expenses.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount||0),0)}function expense(){return d.expenses.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount||0),0)}function rate(){let b=d.customers.filter(c=>c.status!=='inactive').reduce((a,c)=>a+Number(c.fee||0),0);return b?Math.min(100,Math.round(totalPaid()/b*100)):0}function newGrowth(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.customers.forEach(c=>{let s=c.createdAt||c.created||c.connectionDate||'';if(String(s).startsWith(y))a[Number(s.slice(5,7))-1]++});return a}function dashboard(){fix();let y=new Date().getFullYear(),g=newGrowth(),vals=Array(12).fill(0);d.payments.forEach(x=>{if(x.status==='paid'&&String(x.month).startsWith(y))vals[Number(x.month.slice(5,7))-1]+=Number(x.amount||0)});let max=Math.max(1,...vals),names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let inc=d.payments.filter(x=>x.date===today()&&x.status==='paid').reduce((a,x)=>a+x.amount,0),ex=d.expenses.filter(x=>x.date===today()&&x.type==='expense').reduce((a,x)=>a+x.amount,0);return `<h1 class="title">Dashboard</h1><div class="sub">Billing month: <b>${month()}</b> • No automatic data deletion</div><div class="grid"><div class="stat blue" onclick="go('customers',{filter:'all'})"><div class="label">Total Customer</div><div class="num">${d.customers.length}</div></div><div class="stat green" onclick="go('customers',{filter:'active'})"><div class="label">Active Customer</div><div class="num">${d.customers.filter(c=>c.status==='active').length}</div></div><div class="stat slate" onclick="go('customers',{filter:'inactive'})"><div class="label">Inactive Customer</div><div class="num">${d.customers.filter(c=>c.status==='inactive').length}</div></div><div class="stat red" onclick="go('customers',{filter:'expired'})"><div class="label">Expired Customer</div><div class="num">${d.customers.filter(c=>c.status==='expired').length}</div></div><div class="stat purple" onclick="go('customers',{filter:'paid'})"><div class="label">Total Paid</div><div class="num">${money(totalPaid())}</div></div><div class="stat orange" onclick="go('customers',{filter:'unpaid'})"><div class="label">Total Unpaid</div><div class="num">${money(totalUnpaid())}</div></div></div><div class="section"><div class="kpi"><span>🆕 New connections this month</span><b>${g[Number(month().slice(5,7))-1]}</b></div><div class="kpi"><span>💳 Pending merchant payments</span><b>${d.pending.filter(x=>x.status==='pending').length}</b></div><div class="kpi"><span>📊 Collection rate</span><b>${rate()}%</b></div></div><div class="chart"><b>📈 Monthly Collection + New Connection Growth</b><div class="muted">Blue bars = collection • number above = new connections</div><div class="chartbars">${vals.map((v,i)=>`<div class="barcol"><b>${g[i]}</b><div class="bar" style="height:${Math.max(3,Math.round(v/max*105))}px"></div>${names[i]}</div>`).join('')}</div></div><div class="section"><div class="detail"><span>Today Income</span><b>${money(inc)}</b></div><div class="detail"><span>Today Expense</span><b>${money(ex)}</b></div><div class="detail"><span>Today Net</span><b>${money(inc-ex)}</b></div></div>`}function card(c){let dv=due(c),pp=paid(c);return `<div class="customer"><div class="cmain"><div class="avatar">${esc((c.name||'?')[0].toUpperCase())}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone||'')} • ${esc(c.pkg||'')}</div></div><span class="badge ${c.status}">${String(c.status).toUpperCase()}</span></div><div class="detail"><span>Monthly Bill</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue)}</b></div><div class="detail"><span>Running Bill</span><b>${money(Math.max(0,Number(c.fee||0)-Math.min(Number(c.fee||0),pp)))}</b></div><div class="detail"><span>Total Due</span><b>${money(dv)}</b></div><div class="actions"><button class="small wa" onclick="wa(${c.id})">WhatsApp</button><button class="small call" onclick="call(${c.id})">Call</button><button class="small view" onclick="go('details',{id:${c.id}})">View</button>${dv&&c.status==='active'?`<button class="small pay" onclick="payOpen(${c.id})">Manual Paid</button>`:''}</div></div>`}function customers(){let f=opts.filter||'all',a=d.customers.slice();if(f==='active'||f==='inactive'||f==='expired')a=a.filter(c=>c.status===f);if(f==='paid')a=paidList();if(f==='unpaid')a=unpaid();return `<h1 class="title">Customers</h1><div class="row"><button class="btn green" onclick="go('add')">+ Add Customer</button><button class="btn light" onclick="go('customers',{filter:'all'})">All</button></div><input id="q" class="input" placeholder="Search name / mobile / PPPoE" oninput="search()"><div id="clist">${a.map(card).join('')||'<div class="section muted">No customer found</div>'}</div>`}function search(){let q=(document.getElementById('q').value||'').toLowerCase(),a=d.customers.filter(c=>(`${c.name} ${c.phone} ${c.user} ${c.pppoe}`).toLowerCase().includes(q));document.getElementById('clist').innerHTML=a.map(card).join('')||'<div class="section muted">No match</div>'}function add(){return `<button class="btn light" onclick="go('customers')">← Back</button><h1 class="title">Add Customer</h1><div class="section"><input id="cn" class="input" placeholder="Customer Name"><input id="cp" class="input" placeholder="Customer Mobile / WhatsApp"><input id="ca" class="input" placeholder="Address"><div class="row"><input id="cg" class="input" placeholder="Package"><input id="cf" class="input" type="number" placeholder="Monthly Fee"></div><input id="cu" class="input" placeholder="PPPoE Username"><input id="cw" class="input" placeholder="PPPoE Password"><input id="co" class="input" placeholder="ONU ID"><input id="cc" class="input" type="date" title="Connection Date"><input id="ce" class="input" type="date" title="Expiry Date"><select id="cs" class="select"><option value="active">Active</option><option value="inactive">Inactive</option></select><button class="btn green full" onclick="addSave()">Save Customer Permanently</button></div>`}function addSave(){let c={id:Date.now(),name:cn.value.trim(),phone:cp.value.trim(),address:ca.value.trim(),pkg:cg.value.trim(),fee:Number(cf.value||0),user:cu.value.trim(),pass:cw.value,onu:co.value.trim(),connectionDate:cc.value||today(),expiry:ce.value||'',status:cs.value,prevDue:0,createdAt:today()};if(!c.name||!c.phone||!c.fee)return alert('Name, mobile and monthly fee required');d.customers.push(c);save();toast('Customer saved — never auto-deleted');go('customers')}function details(){let c=d.customers.find(x=>String(x.id)===String(opts.id));if(!c)return '';let h=d.payments.filter(x=>String(x.customer)===String(c.id)).slice().reverse();let months=Math.max(1,Math.floor((Date.now()-new Date(c.connectionDate||c.createdAt||today()).getTime())/(30.44*864e5))+1);return `<button class="btn light" onclick="go('customers')">← Back</button><h1 class="title">Customer Details</h1><div class="section"><div class="cmain"><div class="avatar">${esc(c.name[0])}</div><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)}</div></div><span class="badge ${c.status}">${c.status.toUpperCase()}</span></div>${[['Address',c.address],['Package',c.pkg],['Monthly Bill',money(c.fee)],['Previous Due',money(c.prevDue)],['Total Due',money(due(c))],['PPPoE Username',c.user],['ONU ID',c.onu],['Expiry',c.expiry||'—'],['Connection age',months+' month(s)']].map(x=>`<div class="detail"><span>${x[0]}</span><b>${esc(x[1]??'—')}</b></div>`).join('')}<div class="actions"><button class="small wa" onclick="wa(${c.id})">WhatsApp</button><button class="small call" onclick="call(${c.id})">Call</button><button class="small pay" onclick="payOpen(${c.id})">Manual Paid</button></div></div><div class="section"><b>Payment History</b>${h.map(x=>`<div class="detail"><span>${esc(x.date)} • ${esc(x.method||'Payment')}</span><b>${money(x.amount)}</b></div>`).join('')||'<div class="muted">No payment yet</div>'}</div>`}function payOpen(id){let list=id?[d.customers.find(c=>c.id===id)]:unpaid();if(!list[0])return alert('No unpaid customer');openSheet(`<h2>Manual Customer Payment</h2><div class="muted">Every payment requires admin confirmation. No automatic payment.</div><select id="pc" class="select">${list.map(c=>`<option value="${c.id}">${esc(c.name)} — Due ${money(due(c))}</option>`).join('')}</select><input id="pa" class="input" type="number" placeholder="Amount"><select id="pm" class="select"><option>bKash</option><option>Cash</option><option>Bank</option></select><input id="pt" class="input" placeholder="Transaction ID / Note"><button class="btn green full" onclick="savePayment()">Confirm Paid</button>`)}function savePayment(){let c=d.customers.find(x=>String(x.id)===String(pc.value)),a=Number(pa.value||0);if(!c||a<=0)return alert('Select customer and amount');d.payments.push({id:Date.now(),customer:c.id,amount:a,date:today(),month:month(),method:pm.value,txid:pt.value.trim(),status:'paid'});if(a>=due(c))c.prevDue=0;save();closeSheet();toast('Payment confirmed manually');render()}function billing(){let p=d.pending.filter(x=>x.status==='pending');return `<h1 class="title">Billing & Merchant</h1><div class="section"><b>Company Merchant Number</b><div class="detail"><span>Number</span><b>${esc(d.settings.merchantNumber||'Not set')}</b></div><div class="muted">This is the company merchant number. Customer bKash number is NOT used as merchant input.</div><br><button class="btn dark full" onclick="openSettings()">Set Merchant Number</button></div><div class="section"><b>Pending Transactions</b><div class="muted">When money enters the merchant account, backend/webhook will create Pending. The app will match the sender's last 10 digits with the customer list. Admin then chooses Manual Paid or Cancel.</div><button class="btn light full" style="margin-top:10px" onclick="incoming()">+ Add Test Incoming Transaction</button></div>${p.map(x=>`<div class="customer pending"><div class="detail"><span>Sender</span><b>${esc(x.sender)}</b></div><div class="detail"><span>Amount</span><b>${money(x.amount)}</b></div><div class="detail"><span>Matched</span><b>${esc(x.customerName||'No match')}</b></div><div class="detail"><span>TXID</span><b>${esc(x.txid||'—')}</b></div><div class="actions"><button class="small pay" onclick="confirmPending(${x.id})">Manual Paid</button><button class="small view" onclick="cancelPending(${x.id})">Cancel</button></div></div>`).join('')||'<div class="section muted">No pending transactions</div>'}<div class="section"><b>Unpaid Customers: ${unpaid().length}</b></div>${unpaid().map(card).join('')}`}function norm(s){return String(s||'').replace(/\D/g,'').slice(-10)}function incoming(){openSheet(`<h2>Incoming Merchant Transaction</h2><input id="is" class="input" placeholder="Sender number"><input id="ia" class="input" type="number" placeholder="Amount"><input id="it" class="input" placeholder="Transaction ID"><button class="btn dark full" onclick="saveIncoming()">Create Pending</button>`)}function saveIncoming(){let sender=is.value.trim(),amount=Number(ia.value||0),txid=it.value.trim(),c=d.customers.find(c=>norm(c.phone)===norm(sender));if(!sender||amount<=0||!txid)return alert('Sender, amount and TXID required');d.pending.push({id:Date.now(),sender,amount,txid,customerId:c?.id||null,customerName:c?.name||'',status:'pending',date:today()});save();closeSheet();toast(c?'Matched customer — still Pending':'No match — kept Pending');render()}function confirmPending(id){let x=d.pending.find(p=>p.id===id);if(!x)return;let c=x.customerId?d.customers.find(c=>c.id===x.customerId):null;if(!c){let n=prompt('Enter customer mobile number to match this payment:');c=d.customers.find(c=>norm(c.phone)===norm(n))}if(!c)return alert('Customer not matched. Nothing was paid automatically.');d.payments.push({id:Date.now(),customer:c.id,amount:x.amount,date:today(),month:month(),method:'bKash',txid:x.txid,status:'paid'});x.status='paid';save();toast('Manual Paid confirmed');render()}function cancelPending(id){let x=d.pending.find(p=>p.id===id);if(x){x.status='cancelled';save();toast('Cancelled — data retained');render()}}function monitor(){return `<h1 class="title">Live Monitoring</h1><div class="section"><div class="kpi"><span>OLT</span><b class="orange">Not Connected</b></div><div class="muted">OLT/API connection is prepared for later. No automatic customer cut-off is active.</div></div><div class="grid"><div class="stat green"><div class="label">Online Customers</div><div class="num">${d.customers.filter(c=>c.status==='active').length}</div></div><div class="stat red"><div class="label">Offline / Inactive</div><div class="num">${d.customers.filter(c=>c.status!=='active').length}</div></div></div><div class="section"><b>OLT Configuration</b><div class="detail"><span>IP</span><b>${esc(d.settings.olt.ip||'—')}</b></div><div class="detail"><span>Username</span><b>${esc(d.settings.olt.user||'—')}</b></div><div class="detail"><span>Vendor</span><b>${esc(d.settings.olt.vendor)}</b></div><button class="btn dark full" onclick="openSettings()">Configure OLT</button></div>`}function analytics(){let g=newGrowth(),names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],max=Math.max(1,...g);return `<h1 class="title">Growth & Analytics</h1><div class="section"><div class="kpi"><span>Total Connections</span><b>${d.customers.length}</b></div><div class="kpi"><span>New This Month</span><b>${g[Number(month().slice(5,7))-1]}</b></div><div class="kpi"><span>Collection Rate</span><b>${rate()}%</b></div><div class="kpi"><span>Pending Merchant</span><b>${d.pending.filter(x=>x.status==='pending').length}</b></div></div><div class="chart"><b>New Connection Growth</b><div class="chartbars">${g.map((v,i)=>`<div class="barcol"><b>${v}</b><div class="bar" style="height:${Math.max(3,Math.round(v/max*110))}px"></div>${names[i]}</div>`).join('')}</div></div>`}function accounts(){return `<h1 class="title">Accounts</h1><div class="grid"><div class="stat green"><div class="label">Total Income</div><div class="num">${money(income())}</div></div><div class="stat red"><div class="label">Total Expense</div><div class="num">${money(expense())}</div></div></div><div class="section"><div class="detail"><span>Net Balance</span><b>${money(income()-expense())}</b></div><button class="btn green full" onclick="account('income')">+ Add Income</button><br><br><button class="btn red full" onclick="account('expense')">+ Add Expense</button></div>`}function account(type){openSheet(`<h2>Add ${type}</h2><input id="aa" class="input" type="number" placeholder="Amount"><input id="an" class="input" placeholder="Note"><button class="btn ${type==='income'?'green':'red'} full" onclick="saveAccount('${type}')">Save</button>`)}function saveAccount(type){let a=Number(aa.value||0);if(a<=0)return;d.expenses.push({id:Date.now(),type,amount:a,note:an.value,date:today(),month:month()});save();closeSheet();render()}function openSettings(){closeDrawer();openSheet(`<h2>⚙️ Settings</h2><input id="sn" class="input" value="${esc(d.settings.app)}" placeholder="App Name"><input id="sp" class="input" type="password" value="${esc(d.settings.password)}" placeholder="App Password"><h3>Company Merchant Number</h3><input id="sm" class="input" value="${esc(d.settings.merchantNumber||'')}" placeholder="Merchant number"><h3>OLT — connect later</h3><input id="oi" class="input" value="${esc(d.settings.olt.ip)}" placeholder="OLT IP"><input id="ou" class="input" value="${esc(d.settings.olt.user)}" placeholder="OLT Username"><input id="ox" class="input" value="${esc(d.settings.olt.password)}" placeholder="OLT Password"><input id="ov" class="input" value="${esc(d.settings.olt.vendor)}" placeholder="Vendor"><button class="btn green full" onclick="saveSettings()">Save Settings</button><br><br><button class="btn light full" onclick="closeSheet()">Back</button></div>`)}function saveSettings(){d.settings.app=sn.value.trim()||'STAR COMMUNICATION';d.settings.password=sp.value;d.settings.merchantNumber=sm.value.trim();d.settings.olt.ip=oi.value.trim();d.settings.olt.user=ou.value.trim();d.settings.olt.password=ox.value;d.settings.olt.vendor=ov.value.trim()||'VSOL';save();closeSheet();toast('Settings saved');render()}function backupData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='STAR-COMMUNICATION-backup-'+today()+'.json';a.click();toast('Backup created')}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.customers))throw 0;if(!confirm('Restore this backup?'))return;d=x;save();toast('Backup restored');render()}catch(z){toast('Invalid backup')}};r.readAsText(f)}function wa(id){let c=d.customers.find(x=>x.id===id);if(c)location.href='https://wa.me/'+c.phone.replace(/\D/g,'')+'?text='+encodeURIComponent('STAR COMMUNICATION: Your total due is '+money(due(c)))}function call(id){let c=d.customers.find(x=>x.id===id);if(c)location.href='tel:'+c.phone}function render(){try{let h=page==='dashboard'?dashboard():page==='customers'?customers():page==='add'?add():page==='details'?details():page==='billing'?billing():page==='monitor'?monitor():page==='analytics'?analytics():page==='accounts'?accounts():dashboard();document.getElementById('content').innerHTML=h;setNav()}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="section"><h2>STAR COMMUNICATION</h2><p>App recovered safely.</p></div>'}}window.render=render;render();</script></body></html>
