name: Build STAR COMMUNICATION - 3 Fix Only

on:
  workflow_dispatch:
  push:
    branches:
      - fix-3-only-from-6525

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-3-FIX
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
