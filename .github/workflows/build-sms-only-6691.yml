name: STAR COMMUNICATION 66.91 SMS Fix

on:
  workflow_dispatch:
  push:
    branches: [sms-only-fix-6691]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply only SMS fix
        run: |
          python3 tools/patch_account_sms_payment_final.py
          python3 tools/patch_sms_only_6691.py
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-66.91-SMS-FIX
          path: app/build/outputs/apk/debug/app-debug.apk
