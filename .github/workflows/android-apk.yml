name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAR_SIGNING_STORE_PASSWORD: ${{ secrets.STAR_SIGNING_STORE_PASSWORD }}
      STAR_SIGNING_KEY_ALIAS: ${{ secrets.STAR_SIGNING_KEY_ALIAS }}
      STAR_SIGNING_KEY_PASSWORD: ${{ secrets.STAR_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install stable signing key when configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STAR_SIGNING_KEYSTORE_BASE64 }}
          STAR_SIGNING_STORE_PASSWORD: ${{ secrets.STAR_SIGNING_STORE_PASSWORD }}
          STAR_SIGNING_KEY_ALIAS: ${{ secrets.STAR_SIGNING_KEY_ALIAS }}
          STAR_SIGNING_KEY_PASSWORD: ${{ secrets.STAR_SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STAR_SIGNING_STORE_PASSWORD" ] && [ -n "$STAR_SIGNING_KEY_ALIAS" ] && [ -n "$STAR_SIGNING_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/star-release-key.jks
            test -s app/star-release-key.jks
            echo "Stable signing key installed."
          else
            echo "::error::Signing secrets are not configured. Refusing to build a misleading debug-signed update APK."
            exit 1
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK with Gradle 8.7
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
