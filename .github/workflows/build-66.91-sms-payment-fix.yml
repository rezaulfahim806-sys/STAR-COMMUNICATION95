name: STAR COMMUNICATION 66.91 SMS Payment Fix

on:
  push:
    branches: [sms-payment-6691-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply ONLY 66.91 SMS and Payment Link fix
        run: python3 tools/patch_sms_payment_6691_final.py
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-66.91-SMS-PAYMENT-FIX
          path: app/build/outputs/apk/debug/app-debug.apk
