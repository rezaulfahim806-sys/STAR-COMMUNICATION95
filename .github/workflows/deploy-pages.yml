name: Prepare STAR COMMUNICATION Web Payment PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-web:
    name: Prepare Web Payment PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web app
        shell: bash
        run: |
          set -e
          rm -rf public
          mkdir -p public
          cp app/src/main/assets/index.html public/index.html
          cp app/src/main/assets/logo.svg public/logo.svg
          cp app/src/main/assets/sw.js public/sw.js
          cp app/src/main/assets/manifest.webmanifest public/manifest.webmanifest
          echo 'Web Payment PWA files prepared successfully.'
          ls -lh public

      - name: Upload Web PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-web-pwa
          path: public
          if-no-files-found: error
