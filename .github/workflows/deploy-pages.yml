name: Deploy STAR COMMUNICATION Payment Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare payment page
        shell: bash
        run: |
          set -e
          rm -rf public
          mkdir -p public
          cp pay.html public/pay.html
          cp pay.html public/index.html
          cp app/src/main/assets/logo.svg public/logo.svg
          touch public/.nojekyll
          echo 'STAR COMMUNICATION customer payment page prepared.'
          ls -lh public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
