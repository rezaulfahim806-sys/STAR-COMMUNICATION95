name: Build STAR COMMUNICATION - Edit Fix Only
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-EDIT-FIX-VERIFIED
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
