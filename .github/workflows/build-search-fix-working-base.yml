name: Build STAR COMMUNICATION APK - Current App Search/Edit/SMS Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply current staff and complaints feature patch
        run: python3 tools/patch_staff_accounts_complaints.py

      - name: Verify current app source
        shell: bash
        run: |
          set -e
          grep -q "applicationId 'com.starcommunication.isp'" app/build.gradle
          grep -q "versionCode 6" app/build.gradle
          grep -q 'function applyCustomerSearch' app/src/main/assets/index.html
          grep -q 'function editCustomer' app/src/main/assets/index.html
          grep -q 'function sendCustomerSmsById' app/src/main/assets/index.html
          grep -q 'function loginScreen' app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK and Android alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          python3 - <<'PY'
          import zipfile
          p="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(p) as z:
              assert z.getinfo("resources.arsc").compress_type == zipfile.ZIP_STORED, "resources.arsc is compressed"
          print("APK ZIP/resources checks passed")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-current-app-search-edit-sms
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
