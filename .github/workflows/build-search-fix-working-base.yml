name: Build STAR COMMUNICATION from working APK base - Search Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact working base
        run: |
          git fetch --no-tags origin b4ef0c498ab8c36fdab70954544a31e9ac1dca72
          git checkout --force b4ef0c498ab8c36fdab70954544a31e9ac1dca72

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply ONLY customer search typing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          old="function applyCustomerSearch(v){customerSearchText=String(v||'').trim().toLowerCase();render()}"
          new="function applyCustomerSearch(v){var input=document.getElementById('customerSearch');var start=input&&typeof input.selectionStart==='number'?input.selectionStart:String(v||'').length;var end=input&&typeof input.selectionEnd==='number'?input.selectionEnd:start;customerSearchText=String(v||'').trim().toLowerCase();render();setTimeout(function(){var x=document.getElementById('customerSearch');if(x){x.focus();try{x.setSelectionRange(start,end)}catch(e){}}},0)}"
          if old not in s:
              raise SystemExit("Search function target not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          python3 - <<'PY'
          import zipfile
          p="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(p) as z:
              i=z.getinfo("resources.arsc")
              assert i.compress_type == zipfile.ZIP_STORED, "resources.arsc is compressed"
              assert i.header_offset % 4 == 0, "resources.arsc is not 4-byte aligned"
          print("APK ZIP/resources checks passed")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-search-fix-working-base
          path: app/build/outputs/apk/debug/app-debug.apk
