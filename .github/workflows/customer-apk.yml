name: Build STAR COMMUNICATION Customer APK
on:
  push:
    branches: [customer-apk-bangla-blue]
    paths:
      - 'customer-app/**'
      - 'settings.gradle'
      - '.github/workflows/customer-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build separate Customer APK
        run: gradle :customer-app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s customer-app/build/outputs/apk/debug/customer-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-CUSTOMER-APK
          path: customer-app/build/outputs/apk/debug/customer-app-debug.apk
          if-no-files-found: error
          retention-days: 30
