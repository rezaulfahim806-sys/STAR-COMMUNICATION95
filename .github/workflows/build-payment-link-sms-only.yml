name: Build STAR COMMUNICATION - Payment Link SMS Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/payment-link-sms-composer

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK from Build 184 source pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply the same source patches used by Build 184
        run: |
          python3 tools/patch_payment_flow.py || true
          python3 tools/patch_compact_ui.py || true
          python3 tools/patch_web_payment.py || true
          python3 tools/patch_customer_persistence.py || true
          python3 tools/patch_customer_add_status.py || true
          python3 tools/patch_ui_layout.py || true
          python3 tools/patch_main_activity.py || true
          python3 tools/patch_final_customer_fix.py || true
          python3 tools/patch_growth_expectation.py || true
          python3 tools/patch_customer_view_edit.py || true
          python3 tools/patch_payment_link_actions.py || true
          python3 tools/patch_sms_csv_import.py || true
          python3 tools/patch_native_storage.py || true
          python3 tools/patch_update_data_migration.py || true
          python3 tools/patch_sim2_sms.py || true
          python3 tools/patch_sms_permission_fix.py || true
          python3 tools/patch_default_sms_handler.py || true
          python3 tools/patch_billing_expiry_activation.py || true
          python3 tools/patch_expired_paid_active.py || true
          python3 tools/patch_sms_dedupe.py || true
          python3 tools/patch_sms_method_reference.py || true
          python3 tools/patch_active_line_growth_monitor.py || true
          python3 tools/patch_customer_actions_20260915.py || true
          python3 tools/patch_webview_back_20260915.py || true
          python3 tools/patch_final_payment_actions_20260915.py || true
          python3 tools/patch_payment_link_lookup_fix_20260915.py || true
          python3 tools/patch_customer_sms_option.py || true
          python3 tools/patch_final_customer_buttons_20260918.py || true
          python3 tools/patch_staff_accounts_complaints.py
          python3 tools/patch_edit_direct_sms_final.py || true
          python3 tools/patch_edit_direct_sms_final_v2.py
          python3 tools/patch_edit_sms_hardfix_20260921.py
      - name: Apply only the requested blank-recipient Payment Link SMS behavior
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'window.__starPaymentLinkSmsComposerFix=true;'
          if marker not in s:
              fix = r"""<script>
          window.__starPaymentLinkSmsComposerFix=true;
          window.customerPaymentLink=function(id){
            var obj=(typeof d!=='undefined'&&d)?d:(window.d||{});
            var list=Array.isArray(obj.customers)?obj.customers:[];
            var c=list.find(function(x){return String(x.id)===String(id)||String(x.clientCode||'')===String(id);});
            if(!c){if(typeof toast==='function')toast('Customer not found');return '';}
            var params=new URLSearchParams();
            params.set('code',String(c.clientCode||c.id||''));
            params.set('name',String(c.name||'Customer'));
            params.set('location',String(c.address||c.location||''));
            params.set('package',String(c.pkg||c.packageName||c.package||''));
            params.set('bill',String(Number(c.fee||c.monthlyFee||0)));
            params.set('prev',String(Number(c.prevDue||0)));
            params.set('total',String(typeof due==='function'?due(c):(Number(c.prevDue||0)+Number(c.fee||c.monthlyFee||0))));
            params.set('merchant',String((obj.settings&&obj.settings.merchantNumber)||'01897-099850'));
            var link='https://rezaulfahim806-sys.github.io/STAR-COMMUNICATION95/pay.html?'+params.toString();
            window.__starPay={link:link,phone:'',name:String(c.name||'Customer')};
            var msg='Your bill payment link: '+link;
            if(window.AndroidBridge&&typeof window.AndroidBridge.openSmsComposer==='function'){
              window.AndroidBridge.openSmsComposer('',msg);
            }else{
              window.location.href='smsto:?body='+encodeURIComponent(msg);
            }
            return link;
          };
          </script>"""
              if '</body>' not in s:
                  raise SystemExit('Could not find </body> to safely add the SMS-only override')
              s = s.replace('</body>', fix + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          p = Path('app/src/main/java/com/starcommunication/isp/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          old = 'if(p.isEmpty()||m.isEmpty())return false;'
          if old in s:
              s = s.replace(old, 'if(m.isEmpty())return false;', 1)
          elif 'if(m.isEmpty())return false;' not in s:
              raise SystemExit('Could not safely locate the SMS composer validation; stopping build')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'window.__starPaymentLinkSmsComposerFix=true;' app/src/main/assets/index.html
          grep -q 'if(m.isEmpty())return false;' app/src/main/java/com/starcommunication/isp/MainActivity.java
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-payment-link-sms-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
