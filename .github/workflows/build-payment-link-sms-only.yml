name: Build STAR COMMUNICATION - Payment Link SMS Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/payment-link-sms-composer

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK from selected source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify intended Payment Link behavior
        shell: bash
        run: |
          set -e
          grep -q "AndroidBridge.openSmsComposer('',msg)" app/src/main/assets/index.html
          grep -q "if(m.isEmpty())return false;" app/src/main/java/com/starcommunication/isp/MainActivity.java
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-payment-link-sms-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
