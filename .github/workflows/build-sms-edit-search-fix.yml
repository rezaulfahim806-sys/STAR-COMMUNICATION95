name: Build STAR COMMUNICATION - SMS Edit Search Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix-sms-edit-search-final

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-sms-edit-search-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
