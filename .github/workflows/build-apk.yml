name: Build STAR COMMUNICATION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mikrotik-pppoe-approval

permissions:
  contents: write

jobs:
  build:
    name: Build STAR COMMUNICATION APK
    runs-on: ubuntu-latest
    env:
      STAR_SIGNING_STORE_PASSWORD: ${{ secrets.STAR_SIGNING_STORE_PASSWORD }}
      STAR_SIGNING_KEY_ALIAS: ${{ secrets.STAR_SIGNING_KEY_ALIAS }}
      STAR_SIGNING_KEY_PASSWORD: ${{ secrets.STAR_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install stable signing key when configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STAR_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STAR_SIGNING_STORE_PASSWORD" ] && [ -n "$STAR_SIGNING_KEY_ALIAS" ] && [ -n "$STAR_SIGNING_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/star-release-key.jks
            test -s app/star-release-key.jks
            echo "Stable signing key installed."
          else
            echo "::warning::Stable signing secrets are not configured; APK may not update-install over the currently installed app."
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check server and app JavaScript syntax
        shell: bash
        run: |
          set -e
          node --check server.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
              raise SystemExit('No inline application script found')
          Path('/tmp/star-app-check.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          npm install --no-save acorn
          node - <<'NODE'
          const fs = require('fs');
          const acorn = require('acorn');
          const source = fs.readFileSync('/tmp/star-app-check.js', 'utf8');
          try { acorn.parse(source, {ecmaVersion: 'latest', sourceType: 'script'}); console.log('JavaScript syntax OK'); }
          catch (e) { console.error('Exact JavaScript syntax error:', e.message); console.error('Line:', e.loc && e.loc.line, 'Column:', e.loc && e.loc.column); const lines=source.split('\\n'); const n=(e.loc&&e.loc.line||1)-1; console.error((lines[n]||'').slice(Math.max(0,(e.loc&&e.loc.column||0)-180),(e.loc&&e.loc.column||0)+180)); process.exit(1); }
          NODE

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          gradle projects --no-daemon

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -le 68979 ]; then
            echo "::warning::APK is $SIZE bytes, below the requested original size of 68,979 bytes. Size alone does not prove feature completeness."
          fi
          jarsigner -verify "$APK" >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: star-build-${{ github.run_number }}
          name: STAR COMMUNICATION APK build ${{ github.run_number }}
          body: |
            Android APK built from the main branch.
            Note: size and successful compilation do not certify that every live backend/payment feature is configured.
            Install over an existing app only if signed with the same signing key.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
