name: Build STAR COMMUNICATION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/res/drawable/star_launcher.xml
          echo '=== Gradle projects ==='
          gradle projects --no-daemon
          echo '=== App assembleDebug task ==='
          gradle :app:tasks --all --no-daemon | grep -E 'assembleDebug|assembleRelease' || true
      - name: Apply app source patches
        run: |
          python3 tools/patch_payment_flow.py
          python3 tools/patch_compact_ui.py
          python3 tools/patch_web_payment.py
          python3 tools/patch_customer_persistence.py
          python3 tools/patch_customer_add_status.py
          python3 tools/patch_ui_layout.py
          python3 tools/patch_main_activity.py
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
