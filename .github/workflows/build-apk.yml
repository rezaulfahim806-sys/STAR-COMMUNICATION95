name: Build STAR COMMUNICATION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK with stable signing key
    runs-on: ubuntu-latest
    env:
      STAR_SIGNING_STORE_PASSWORD: ${{ secrets.STAR_SIGNING_STORE_PASSWORD }}
      STAR_SIGNING_KEY_ALIAS: ${{ secrets.STAR_SIGNING_KEY_ALIAS }}
      STAR_SIGNING_KEY_PASSWORD: ${{ secrets.STAR_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require signing secrets and install keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STAR_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "Missing secret STAR_SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$STAR_SIGNING_STORE_PASSWORD" || { echo "Missing secret STAR_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$STAR_SIGNING_KEY_ALIAS" || { echo "Missing secret STAR_SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$STAR_SIGNING_KEY_PASSWORD" || { echo "Missing secret STAR_SIGNING_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > app/star-release-key.jks
          test -s app/star-release-key.jks

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          gradle projects --no-daemon

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          jarsigner -verify "$APK" >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-stable-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
