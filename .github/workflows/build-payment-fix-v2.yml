name: STAR COMMUNICATION Payment Fix APK v2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply app source patches
        run: |
          python3 tools/patch_payment_flow.py
          python3 tools/patch_compact_ui.py
          python3 tools/patch_web_payment.py
          python3 tools/patch_customer_persistence.py
          python3 tools/patch_customer_add_status.py
          python3 tools/patch_ui_layout.py
          python3 tools/patch_main_activity.py
          python3 tools/patch_final_customer_fix.py
          python3 tools/patch_growth_expectation.py
          python3 tools/patch_customer_view_edit.py
          python3 tools/patch_payment_link_actions.py
          python3 tools/patch_sms_csv_import.py
          python3 tools/patch_native_storage.py
          python3 tools/patch_update_data_migration.py
          python3 tools/patch_sim2_sms.py
          python3 tools/patch_sms_permission_fix.py
          python3 tools/patch_default_sms_handler.py
          python3 tools/patch_billing_expiry_activation.py
          python3 tools/patch_expired_paid_active.py
          python3 tools/patch_sms_dedupe.py
          python3 tools/patch_sms_method_reference.py
          python3 tools/patch_active_line_growth_monitor.py
          python3 tools/patch_customer_actions_20260915.py
          python3 tools/patch_webview_back_20260915.py
          python3 tools/patch_final_payment_actions_20260915.py
          python3 tools/patch_payment_link_lookup_fix_20260915.py
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-COMMUNICATION-debug-apk-payment-fix-v2
          path: app/build/outputs/apk/debug/app-debug.apk
