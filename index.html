<style>

ark{background:var(--navy)}.btn.light{background:#eef3fa;color:var(--navy)}.full{width:100%}.searchbox{margin-bottom:11px}.customer{background:#fff;border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:0 4px 13px #0000000a}.cmain{display:flex;gap:11px;align-items:center}.avatar{width:43px;height:43px;border-radius:13px;background:#e8f2ff;color:#0877dc;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}.grow{flex:1;min-width:0}.name{font-weight:900;font-size:16px}.muted{color:#667085;font-size:12px;margin-top:3px}.badge{display:inline-block;padding:5px 8px;border-radius:18px;font-size:10px;font-weight:900}.active,.paid{background:#dcfce7;color:#15803d}.inactive{background:#e5e7eb;color:#475569}.expired{background:#fee2e2;color:#b91c1c}.unpaid{background:#ffedd5;color:#c2410c}.actions{display:flex;gap:6px;margin-top:10px}.small{border:0;border-radius:9px;padding:8px 9px;font-size:12px;font-weight:800}.wa{background:#25d366;color:#fff}.call{background:#e8f1ff;color:#1267c7}.view{background:#edf0f5;color:#334155}.pay{background:var(--green);color:#fff}.back{border:0;background:transparent;color:var(--navy);font-weight:900;padding:0 0 12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{border:0;background:#e9eef6;color:#536176;border-radius:20px;padding:9px 12px;white-space:nowrap}.tab.on{background:var(--blue);color:#fff}.detail{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f4;gap:15px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:78px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:30}.bottom button{flex:1;border:0;background:#fff;color:#555;font-size:12px}.bottom button.on{color:#0877c9;font-weight:900}.bottom span{display:block;font-size:26px;margin-bottom:2px}.drawerShade{display:none;position:fixed;inset:0;background:#0008;z-index:50}.drawerShade.show{display:block}.drawer{width:300px;max-width:84%;height:100%;background:var(--navy);color:#fff;padding:18px 15px;overflow:auto}.drawer h2{font-size:20px;margin:8px 0 2px}.drawer small{color:#ccd6e9}.close{float:right;border:0;background:transparent;color:#fff;font-size:28px}.menu{margin-top:24px}.menu button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:14px 10px;border-radius:10px;font-weight:800}.menu button:hover{background:#ffffff14}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:19px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:11px;display:none;z-index:80}.toast.show{display:block}.empty{text-align:center;padding:20px;color:#667085}.mini{font-size:13px}.divider{height:1px;background:#edf0f4;margin:12px 0}.chart{background:#fff;border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 6px 18px #0000000c}.charthead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.charttitle{font-size:18px;font-weight:900}.chartsub{font-size:12px;color:#667085;margin-top:3px}.chartgrid{height:190px;display:flex;align-items:flex-end;gap:7px;margin-top:18px;padding:0 2px}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.barvalue{font-size:10px;font-weight:900;margin-bottom:4px}.bar{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#2d83cf,#14244b);min-height:3px}.barlabel{font-size:9px;color:#667085;margin-top:7px}.chartbadge{font-size:10px;font-weight:900;background:#e8f2ff;color:#1267c7;padding:6px 8px;border-radius:14px}.chartfoot{font-size:11px;color:#667085;margin-top:12px}.oltStatus{display:flex;align-items:center;gap:8px;font-weight:900}.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}.dot.on{background:#16a34a}.dot.bad{background:#ef1d28}

</style></head><body><div class="app">
<header><div class="top"><button class="icon" onclick="openDrawer()">☰</button><div class="brand" id="brand">STAR COMMUNICATION</div><button class="icon search" onclick="go('customers')">⌕</button></div></header>
<main id="content" class="content"></main>
<nav class="bottom"><button id="nav-dashboard" onclick="go('dashboard')"><span>🏠</span>Dashboard</button><button id="nav-customers" onclick="go('customers')"><span>👥</span>Customer</button><button id="nav-olt" onclick="go('olt')"><span>🌐</span>OLT</button><button id="nav-billing" onclick="go('billing')"><span>💳</span>Billing</button><button id="nav-accounts" onclick="go('accounts')"><span>💰</span>Hesab</button></nav></div>
<div id="shade" class="drawerShade" onclick="closeDrawer()"><aside class="drawer" onclick="event.stopPropagation()"><button class="close" onclick="closeDrawer()">×</button><div style="clear:both"></div><h2 id="drawerBrand">STAR COMMUNICATION</h2><small>ISP Manager</small><div class="menu"><button onclick="go('dashboard');closeDrawer()">🏠 &nbsp; Dashboard</button><button onclick="go('customers');closeDrawer()">👥 &nbsp; Customer</button><button onclick="go('olt');closeDrawer()">🌐 &nbsp; OLT Monitoring</button><button onclick="go('billing');closeDrawer()">💳 &nbsp; Billing & Payment</button><button onclick="go('accounts');closeDrawer()">💰 &nbsp; Hesab</button><button onclick="openCloudLogin()">☁️ &nbsp; Server Login</button><button onclick="openSettings()">⚙️ &nbsp; Settings</button></div></aside></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const API={base:(localStorage.getItem('star_api_url')||''),token:(localStorage.getItem('star_api_token')||'')};
async function apiFetch(path,opt={}){if(!API.base)throw new Error('API URL not set');const h=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(API.token)h.Authorization='Bearer '+API.token;const r=await fetch(API.base.replace(/\/$/,'')+path,{...opt,headers:h});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch(e){data={raw:text}}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));return data}
async function cloudLogin(base,user,pass){API.base=base.replace(/\/$/,'');const x=await apiFetch('/api/auth/login',{method:'POST',body:JSON.stringify({username:user,password:pass})});API.token=x.token;localStorage.setItem('star_api_url',API.base);localStorage.setItem('star_api_token',API.token);return x}
function clearCloud(){API.token='';localStorage.removeItem('star_api_token')}
function mapCustomer(c){return {id:c.id,name:c.name,phone:c.mobile,pkg:c.packageName,fee:Number(c.monthlyFee||0),user:c.pppoeUsername||'',pass:c.pppoePassword||'',onu:c.onuId||'',expiry:c.expiryDate?String(c.expiryDate).slice(0,10):'',status:String(c.status||'ACTIVE').toLowerCase(),prevDue:Number(c.previousDue||0),runningBill:Number(c.runningBill||0),created:String(c.createdAt||'').slice(0,10)}}
async function refreshCloud(){if(!API.token)return false;const [cs,ps,hs,bt]=await Promise.all([apiFetch('/api/customers'),apiFetch('/api/billing/payments'),apiFetch('/api/billing/history'),apiFetch('/api/bkash/transactions')]);d.customers=cs.map(mapCustomer);d.payments=ps.map(x=>({id:x.id,customer:x.customerId,amount:Number(x.amount||0),date:String(x.createdAt||'').slice(0,10),month:x.month,method:x.method==='BKASH'?'bKash':x.method,txid:x.transactionId||''}));d.history=hs.map(x=>({month:x.month,label:monthLabel(x.month),closedAt:x.closedAt,income:Number(x.income||0),expense:Number(x.expense||0),net:Number(x.net||0),customers:[]}));d.bkashIncoming=bt.map(x=>({id:x.id,sender:x.sender,receiver:x.receiver,amount:Number(x.amount||0),txid:x.transactionId,status:String(x.status||'PENDING').toLowerCase(),suggestedCustomer:x.suggestedCustomerId,customer:x.matchedCustomerId,matchFound:!!x.suggestedCustomerId}));save();return true}
async function ensureCloudLogin(){if(API.token)return true;return false}

const KEY='star_communication_final_v1';
const fresh={customers:[],payments:[],expenses:[],history:[],settings:{app:'STAR COMMUNICATION',admin:'admin',password:'1234',olt:{ip:'192.168.8.100',user:'admin',vendor:'vsol',protocol:'ssh',port:22},bkash:{numbers:['01897099850']},api:'',apiKey:''}};
let d=null;
try{
  d=JSON.parse(localStorage.getItem(KEY)||'null');
}catch(e){
  console.warn('Saved app data is invalid; starting with a fresh state.',e);
  try{localStorage.removeItem(KEY)}catch(_){}
}
if(!d){try{d=JSON.parse(localStorage.getItem('ispdb')||'null')||JSON.parse(localStorage.getItem('ispdb_monthly')||'null')}catch(e){}}
d=d||fresh; d.customers=d.customers||[];d.payments=d.payments||[];d.expenses=d.expenses||[];d.history=d.history||[];d.settings=d.settings||fresh.settings;d.settings.olt=d.settings.olt||fresh.settings.olt;d.settings.olt.vendor=d.settings.olt.vendor||'vsol';d.settings.olt.protocol=d.settings.olt.protocol||'ssh';d.settings.olt.port=d.settings.olt.port||((d.settings.olt.protocol==='telnet')?23:22);d.settings.olt.ip=d.settings.olt.ip||((d.settings.olt.vendor==='vsol')?'192.168.8.100':''); d.settings.bkash=d.settings.bkash||{numbers:['01897099850']}; d.settings.bkash.numbers=[d.settings.bkash.numbers?.[0]||'01897099850']; d.customers.forEach(c=>{if(c.prevDue==null)c.prevDue=0});
let page='dashboard', opts={};
const money=n=>'৳'+Number(n||0).toLocaleString('en-US');
function pad2(n){return String(n).padStart(2,'0')}
function today(){const x=new Date();return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate())}
function month(){return today().slice(0,7)}
function monthLabel(m){const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
function ensureMonth(){
 const cur=month(), last=d._currentMonth||cur;
 if(last!==cur){
  const previous=last, prevPayments=d.payments.filter(x=>x.month===previous), prevExpenses=d.expenses.filter(x=>x.month===previous||(!x.month&&String(x.date||'').slice(0,7)===previous));
  const snap=d.customers.map(c=>{const paid=prevPayments.filter(x=>x.customer===c.id).reduce((a,x)=>a+(+x.amount||0),0);const fee=+c.fee||0;const runningDue=Math.max(0,fee-paid);return {id:c.id,name:c.name,fee,status:c.status,paid,runningDue,previousDue:+c.prevDue||0,totalDue:(+c.prevDue||0)+runningDue}});
  const income=prevPayments.reduce((a,x)=>a+(+x.amount||0),0)+prevExpenses.filter(x=>x.type==='income').reduce((a,x)=>a+(+x.amount||0),0);
  const expense=prevExpenses.filter(x=>x.type==='expense').reduce((a,x)=>a+(+x.amount||0),0);
  if(!d.history.some(h=>h.month===previous)) d.history.push({month:previous,label:monthLabel(previous),closedAt:new Date().toISOString(),income,expense,net:income-expense,customers:snap});
  d.customers.forEach(c=>{const s=snap.find(x=>x.id===c.id), paid=s?s.paid:0, fee=+c.fee||0;c.prevDue=s?Math.max(0,(+s.previousDue||0)+Math.max(0,fee-paid)):0;if(c.status!=='inactive') c.status=c.prevDue>0?'expired':'active'});
  d._currentMonth=cur;save();
 }else if(!d._currentMonth){d._currentMonth=cur;save()}
}
ensureMonth();
function save(){localStorage.setItem(KEY,JSON.stringify(d));}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function openDrawer(){document.getElementById('shade').classList.add('show')}function closeDrawer(){document.getElementById('shade').classList.remove('show')}
function go(p,o={}){page=p;opts=o;window.oltList=null;render();window.scrollTo(0,0)}
function setNav(p){['dashboard','customers','olt','billing','accounts'].forEach(x=>document.getElementById('nav-'+x)?.classList.toggle('on',x===p))}
function monthPaid(c){return d.payments.filter(x=>x.customer===c.id&&x.month===month()).reduce((s,x)=>s+x.amount,0)}
function due(c){return Math.max(0,(+c.prevDue||0)+(+c.fee||0)-monthPaid(c))}
function runningDue(c){return Math.max(0,(+c.fee||0)-Math.max(0,monthPaid(c)-Math.max(0,+c.prevDue||0)))}
function paidCustomers(){return d.customers.filter(c=>c.status!=='inactive'&&due(c)<=0&&(+c.fee||0)>0)}
function unpaidCustomers(){return d.customers.filter(c=>c.status!=='inactive'&&due(c)>0)}
function totalPaid(){return d.payments.filter(x=>x.month===month()).reduce((s,x)=>s+x.amount,0)}
function totalUnpaid(){return unpaidCustomers().reduce((s,c)=>s+due(c),0)}
function totalIncome(){return d.payments.reduce((s,x)=>s+x.amount,0)+d.expenses.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0)}
function totalExpense(){return d.expenses.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)}
function lineGrowthData(){let y=String(new Date().getFullYear()),a=Array(12).fill(0);d.customers.forEach(c=>{let raw=c.connectionDate||c.joinDate||c.createdAt||c.created||c.date||'';let m=String(raw).slice(0,7);if(m.startsWith(y+'-')){let n=+m.slice(5,7)-1;if(n>=0&&n<12)a[n]++}});return a}
function lineGrowthChart(){let a=lineGrowthData(),max=Math.max(1,...a),total=a.reduce((x,y)=>x+y,0),best=Math.max(...a),bi=a.indexOf(best);let names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `<div class="chart"><div class="charthead"><div><div class="charttitle">📈 Line Growth</div><div class="chartsub">Monthly new connections — ${new Date().getFullYear()}</div></div><span class="chartbadge">12 MONTHS</span></div><div class="chartgrid">${a.map((v,i)=>`<div class="barcol"><div class="barvalue">${v}</div><div class="bar" style="height:${Math.max(3,Math.round(v/max*150))}px"></div><div class="barlabel">${names[i]}</div></div>`).join('')}</div><div class="chartfoot">Total new lines: <b>${total}</b> • Best month: <b>${names[bi]}</b> (${best})</div></div>`}
function billCollectionGrowthData(){let y=new Date().getFullYear(),a=Array(12).fill(0);d.payments.forEach(x=>{let m=String(x.month||x.date||'').slice(0,7);if(m.startsWith(y+'-')){let n=+m.slice(5,7)-1;if(n>=0&&n<12)a[n]+=Number(x.amount)||0}});return a}
function billCollectionGrowthChart(){let a=billCollectionGrowthData(),max=Math.max(1,...a),total=a.reduce((x,y)=>x+y,0),best=Math.max(...a),bi=a.indexOf(best),names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let last=0;let growth=a.map(v=>{let g=last>0?((v-last)/last*100):null;last=v;return g});return `<div class="chart"><div class="charthead"><div><div class="charttitle">💳 Monthly Bill Collection Growth</div><div class="chartsub">Customer bill collection — ${new Date().getFullYear()}</div></div><span class="chartbadge">12 MONTHS</span></div><div class="chartgrid">${a.map((v,i)=>`<div class="barcol"><div class="barvalue">${money(v)}</div><div class="bar" title="${names[i]} collection: ${money(v)}" style="height:${Math.max(3,Math.round(v/max*150))}px;background:linear-gradient(180deg,var(--green),var(--navy))"></div><div class="barlabel">${names[i]}</div></div>`).join('')}</div><div class="chartfoot">Total collected: <b>${money(total)}</b> • Best month: <b>${names[bi]}</b> (${money(best)})</div><div class="muted" style="margin-top:6px">প্রতি মাসের customer payment অনুযায়ী collection দেখানো হচ্ছে। আগের মাসের তুলনায় growth হিসাবও payment data থেকে হবে।</div></div>`}
function dashboard(){let t=d.customers.length,a=d.customers.filter(c=>c.status==='active').length,i=d.customers.filter(c=>c.status==='inactive').length,e=d.customers.filter(c=>c.status==='expired').length,p=totalPaid(),u=totalUnpaid(),inc=d.payments.filter(x=>x.date===today()).reduce((s,x)=>s+x.amount,0)+d.expenses.filter(x=>x.type==='income'&&x.date===today()).reduce((s,x)=>s+x.amount,0),ex=d.expenses.filter(x=>x.type==='expense'&&x.date===today()).reduce((s,x)=>s+x.amount,0);return `<h1 class="title">Dashboard</h1><div class="muted" style="margin:-6px 6px 12px">Billing Month: <b>${monthLabel(month())}</b> • হিসাব ১ তারিখ থেকে মাসের শেষ দিন পর্যন্ত</div><div class="grid">
<div class="stat blue click" onclick="go('customers',{filter:'all'})"><div class="label">Total Customer</div><div class="num">${t}</div></div><div class="stat green click" onclick="go('customers',{filter:'active'})"><div class="label">Active Customer</div><div class="num">${a}</div></div>
<div class="stat slate click" onclick="go('customers',{filter:'inactive'})"><div class="label">Inactive Customer</div><div class="num">${i}</div></div><div class="stat red click" onclick="go('customers',{filter:'expired'})"><div class="label">Expired</div><div class="num">${e}</div></div>
<div class="stat purple click" onclick="go('customers',{filter:'paid'})"><div class="label">Total Paid</div><div class="num">${money(p)}</div></div><div class="stat orange click" onclick="go('customers',{filter:'unpaid'})"><div class="label">Total Unpaid</div><div class="num">${money(u)}</div></div>
<div class="stat cyan"><div class="label">Today Income</div><div class="num">${money(inc)}</div></div><div class="stat pink"><div class="label">Today Expense</div><div class="num">${money(ex)}</div></div></div>${lineGrowthChart()}${billCollectionGrowthChart()}<div class="profit"><div class="muted">Net Profit / Balance</div><b>${money(inc-ex)}</b><div class="muted">Today: Income − Expense</div></div>`}
function card(c){let duev=due(c),ps=monthPaid(c);return `<div class="customer"><div class="cmain"><div class="avatar">${(c.name||'?').charAt(0).toUpperCase()}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone||'')} • ${esc(c.pkg||'')}</div></div><span class="badge ${c.status}">${c.status.toUpperCase()}</span></div><div class="detail"><span>Bill</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue||0)}</b></div><div class="detail"><span>Running Bill</span><b>${money(runningDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(duev)}</b></div><div class="detail"><span>This Month Paid</span><b>${ps?money(ps):'৳0'}</b></div><div class="actions"><button class="small wa" onclick="whatsapp(${c.id})">WhatsApp</button><button class="small call" onclick="call(${c.id})">Call</button><button class="small view" onclick="go('details',{id:${c.id}})">View</button>${duev&&c.status!=='inactive'?`<button class="small pay" onclick="payOpen(${c.id})">Pay</button>`:''}</div></div>`}
function customers(){let f=opts.filter||'all',arr=d.customers;if(f==='active')arr=arr.filter(c=>c.status==='active');if(f==='inactive')arr=arr.filter(c=>c.status==='inactive');if(f==='expired')arr=arr.filter(c=>c.status==='expired');if(f==='paid')arr=paidCustomers();if(f==='unpaid')arr=unpaidCustomers();let title={all:'Customer List',active:'Active Customers',inactive:'Inactive Customers',expired:'Expired Customers',paid:'Paid Customers',unpaid:'Unpaid Customers'}[f];return `<h1 class="title">${title}</h1><div class="row" style="margin-bottom:10px"><button class="btn green" onclick="go('add')">+ Add Customer</button><button class="btn light" onclick="go('customers',{filter:'all'})">All</button></div><input class="input searchbox" id="cs" placeholder="Search name, mobile, PPPoE username..." oninput="filterCustomers()"><div id="clist">${arr.map(card).join('')||'<div class="section empty">No customer found</div>'}</div>`}
function filterCustomers(){let q=(document.getElementById('cs').value||'').toLowerCase();let f=opts.filter||'all';let arr=d.customers.filter(c=>(f==='all'||(f==='paid'&&paidCustomers().includes(c))||(f==='unpaid'&&unpaidCustomers().includes(c))||c.status===f)&&((c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.user||'').toLowerCase().includes(q)));document.getElementById('clist').innerHTML=arr.map(card).join('')||'<div class="section empty">No customer found</div>'}
function addCustomer(){return `<button class="back" onclick="go('customers',{filter:'all'})">← Back</button><h1 class="title">Add Customer</h1><div class="section"><input id="cn" class="input" placeholder="Customer Name"><br><br><input id="cp" class="input" placeholder="Mobile Number" inputmode="tel"><br><br><div class="row"><input id="cg" class="input" placeholder="Package (e.g. 50 Mbps)"><input id="cf" class="input" type="number" placeholder="Monthly Fee"></div><br><input id="cu" class="input" placeholder="PPPoE Username"><br><br><input id="cw" class="input" placeholder="PPPoE Password" type="text"><br><br><div class="row"><input id="co" class="input" placeholder="ONU ID"><input id="cd" class="input" type="date" title="Connection Date"></div><br><input id="ce" class="input" type="date" title="Expiry Date"><br><select id="cst" class="select"><option value="active">Active</option><option value="inactive">Inactive</option><option value="expired">Expired</option></select><br><br><button class="btn green full" onclick="addCustomerSave()">Save Customer</button></div>`}
async function addCustomerSave(){let name=cn.value.trim(),phone=cp.value.trim(),pkg=cg.value.trim(),fee=+cf.value,user=cu.value.trim(),pass=cw.value,onu=co.value.trim(),connectionDate=cd.value||today(),expiry=ce.value,status=cst.value;if(!name||!fee)return alert('Customer name এবং monthly fee দিন');try{if(API.token){await apiFetch('/api/customers',{method:'POST',body:JSON.stringify({name,mobile:phone,packageName:pkg,monthlyFee:fee,pppoeUsername:user,pppoePassword:pass,onuId:onu,expiryDate:expiry||null,connectionDate,status:status.toUpperCase()})});await refreshCloud()}else{d.customers.push({id:Date.now(),name,phone,pkg,fee,user,pass,onu,expiry,status,prevDue:0,created:today(),connectionDate});save()}toast('Customer added');go('customers',{filter:'all'})}catch(e){alert(e.message)}}
function details(id){let c=d.customers.find(x=>x.id===id);if(!c)return go('customers');let hist=d.payments.filter(x=>x.customer===id).slice().reverse();return `<button class="back" onclick="go('customers',{filter:'all'})">← Back</button><h1 class="title">Customer Details</h1><div class="section"><div class="cmain"><div class="avatar">${c.name.charAt(0).toUpperCase()}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.phone)}</div></div><span class="badge ${c.status}">${c.status.toUpperCase()}</span></div><div class="detail"><span>Package</span><b>${esc(c.pkg)}</b></div><div class="detail"><span>Monthly Fee</span><b>${money(c.fee)}</b></div><div class="detail"><span>Previous Due</span><b>${money(c.prevDue||0)}</b></div><div class="detail"><span>Running Bill</span><b>${money(runningDue(c))}</b></div><div class="detail"><span>Total Due</span><b>${money(due(c))}</b></div><div class="detail"><span>PPPoE Username</span><b>${esc(c.user||'—')}</b></div><div class="detail"><span>PPPoE Password</span><b>${esc(c.pass||'—')}</b></div><div class="detail"><span>ONU ID</span><b>${esc(c.onu||'—')}</b></div><div class="detail"><span>Expiry Date</span><b>${c.expiry||'—'}</b></div><div class="actions"><button class="small wa" onclick="whatsapp(${c.id})">WhatsApp</button><button class="small call" onclick="call(${c.id})">Call</button><button class="small pay" onclick="payOpen(${c.id})">Pay</button><button class="small" style="background:#fee2e2;color:#b91c1c" onclick="deleteCustomer(${c.id})">Delete</button></div></div><div class="section"><b>Payment History</b>${hist.map(x=>`<div class="detail"><span>${x.date}<br><small>${x.method||'Payment'}</small></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">No payment yet</div>'}</div>`}
function billing(){let arr=unpaidCustomers(), pending=(d.bkashIncoming||[]).filter(x=>x.status==='pending');return `<h1 class="title">Billing & Payment</h1><div class="section"><b>This Month: ${month()}</b><div class="muted">Previous Due + Running Bill = Total Due. Full payment হলে customer Active হবে.</div><br><button class="btn green full" onclick="payOpen()">+ Make Payment</button></div><div class="section"><b>📲 bKash Incoming</b><div class="muted">এই দুই নম্বরে টাকা এলে transaction <b>Pending</b> হবে এবং notification দেখাবে। কোনো payment auto-paid হবে না। তুমি Manual Paid বা Cancel করবে.</div><div class="detail"><span>bKash Number 1</span><b>${esc(d.settings.bkash.numbers[0]||'Not set')}</b></div><div class="detail"><span>bKash Number 2</span><b>${esc(d.settings.bkash.numbers[1]||'Not set')}</b></div><button class="btn dark full" onclick="openBkashTest()">+ Add Incoming bKash Transaction</button></div>${pending.length?`<div class="section"><b>⚠️ Unmatched / Pending</b>${pending.map((x,i)=>{let sc=x.suggestedCustomer?d.customers.find(c=>String(c.id)===String(x.suggestedCustomer)):null;return `<div class="customer"><div class="detail"><span>Sender</span><b>${esc(x.sender)}</b></div><div class="detail"><span>Amount</span><b>${money(x.amount)}</b></div><div class="detail"><span>Transaction ID</span><b>${esc(x.txid||'—')}</b></div><div class="detail"><span>Number Match</span><b>${sc?esc(sc.name):'No customer match'}</b></div><div class="muted" style="margin:8px 0">Pending — manual approval required. Personal transaction হলে Cancel করুন.</div><div class="row"><button class="btn green" onclick="manualMatchBkash(${i})">Manual Paid</button><button class="btn" style="background:#fee2e2;color:#b91c1c" onclick="cancelBkash(${i})">Cancel</button></div></div>`}).join('')}</div>`:''}<div class="tabs"><button class="tab on">Unpaid ${arr.length}</button><button class="tab" onclick="go('customers',{filter:'paid'})">Paid ${paidCustomers().length}</button></div>${arr.map(card).join('')||'<div class="section empty">সব bill paid 🎉</div>'}`}
function payOpen(id){let arr=id?[d.customers.find(c=>c.id===id)]:unpaidCustomers();arr=arr.filter(Boolean);openSheet(`<h2>Make Payment</h2><label class="muted">Customer</label><select id="pc" class="select">${arr.map(c=>`<option value="${c.id}">${esc(c.name)} — Due ${money(due(c))}</option>`).join('')}</select><br><br><label class="muted">Amount</label><input id="pa" class="input" type="number" placeholder="Payment amount"><br><br><label class="muted">Method</label><select id="pm" class="select"><option>Cash</option><option>bKash</option><option>Nagad</option><option>Bank/Card</option></select><br><br><button class="btn green full" onclick="makePayment()">Confirm Payment</button>`)}
async function makePayment(){let c=d.customers.find(x=>x.id==pc.value),a=+pa.value;if(!c||!a)return alert('Customer ও amount দিন');let amount=Math.min(a,due(c));if(amount<=0)return alert('এই customer-এর bill paid');try{if(API.token){let method=pm.value==='bKash'?'BKASH':pm.value==='Cash'?'CASH':pm.value==='Nagad'?'OTHER':'BANK';await apiFetch('/api/customers/'+encodeURIComponent(c.id)+'/payment',{method:'POST',body:JSON.stringify({amount,method,note:'Manual payment'})});await refreshCloud()}else{d.payments.push({id:Date.now(),customer:c.id,amount,date:today(),month:month(),method:pm.value});if(due(c)<=0){c.prevDue=0;c.status='active';}save()}closeSheet();toast('Payment saved');go('billing')}catch(e){alert(e.message)}}
function history(){let hs=d.history.slice().sort((a,b)=>b.month.localeCompare(a.month));return `<h1 class="title">Monthly History</h1><button class="back" onclick="go('accounts')">← Back to Hesab</button>${hs.map(h=>`<div class="section"><div class="name">${esc(h.label||monthLabel(h.month))}</div><div class="detail"><span>Income</span><b>${money(h.income)}</b></div><div class="detail"><span>Expense</span><b>${money(h.expense)}</b></div><div class="detail"><span>Net Balance</span><b>${money(h.net)}</b></div><div class="detail"><span>Customers</span><b>${h.customers?.length||0}</b></div><div class="detail"><span>Unpaid at close</span><b>${(h.customers||[]).filter(c=>(+c.runningDue||0)>0).length}</b></div><div class="detail"><span>Due at close</span><b>${money((h.customers||[]).reduce((s,c)=>s+(+c.runningDue||0),0))}</b></div></div>`).join('')||'<div class="section empty">No closed month history yet</div>'}`}
function accounts(){let inc=totalIncome(),exp=totalExpense(),todayInc=d.payments.filter(x=>x.date===today()).reduce((s,x)=>s+x.amount,0)+d.expenses.filter(x=>x.type==='income'&&x.date===today()).reduce((s,x)=>s+x.amount,0),todayExp=d.expenses.filter(x=>x.type==='expense'&&x.date===today()).reduce((s,x)=>s+x.amount,0);return `<h1 class="title">Hesab</h1><button class="btn dark full" onclick="go('history')">📚 Monthly History</button><br><br><div class="grid"><div class="stat green" style="min-height:116px"><div class="label">Total Income</div><div class="num" style="font-size:32px">${money(inc)}</div></div><div class="stat red" style="min-height:116px"><div class="label">Total Expense</div><div class="num" style="font-size:32px">${money(exp)}</div></div></div><div class="profit"><div class="muted">Net Balance</div><b>${money(inc-exp)}</b><div class="muted">Today: ${money(todayInc)} − ${money(todayExp)}</div></div><div class="section"><div class="row"><input id="ad" class="input" placeholder="Description"><input id="am" class="input" type="number" placeholder="Amount"></div><br><div class="row"><select id="at" class="select"><option value="expense">Expense</option><option value="income">Other Income</option></select><button class="btn" onclick="addEntry()">Save</button></div></div><div class="section"><b>Recent Entries</b>${[...d.payments.map(x=>({date:x.date,desc:'Customer Payment',amount:x.amount,type:'income'})),...d.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(x=>`<div class="detail"><span>${esc(x.desc)}<br><small>${x.date}</small></span><b>${x.type==='income'?'+':'-'}${money(x.amount)}</b></div>`).join('')||'<div class="empty">No entries</div>'}</div>`}
async function addEntry(){if(!ad.value||!am.value)return alert('Description ও amount দিন');try{if(API.token){await apiFetch('/api/billing/ledger',{method:'POST',body:JSON.stringify({type:at.value.toUpperCase(),amount:+am.value,category:'Manual',description:ad.value,month:month()})});await refreshCloud()}else{d.expenses.push({id:Date.now(),desc:ad.value,amount:+am.value,type:at.value,date:today(),month:month()});save()}toast('Entry saved');render()}catch(e){alert(e.message)}}
let oltLive={connected:false,raw:'',online:null,offline:null,total:null,error:'',rows:[]};
async function oltTest(){if(!API.token)return alert('আগে Server Login করুন');let cfg={host:d.settings.olt.ip,port:d.settings.olt.port||22,protocol:d.settings.olt.protocol||'ssh',vendor:d.settings.olt.vendor||'generic',user:document.getElementById('ou')?.value||d.settings.olt.user,password:document.getElementById('op')?.value||''};if(!cfg.host||!cfg.user||!cfg.password)return alert('OLT IP, Username, Password দিন');try{let r=await apiFetch('/api/olt/test',{method:'POST',body:JSON.stringify(cfg)});d.settings.olt.user=cfg.user;d.settings.olt.protocol=cfg.protocol;d.settings.olt.vendor=cfg.vendor;d.settings.olt.port=cfg.port;save();oltLive={connected:true,raw:r.output||'',online:null,offline:null,total:null,error:''};closeSheet();render();toast('OLT connected successfully')}catch(e){oltLive={connected:false,error:e.message};alert(e.message)}}
async function oltMonitor(){if(!API.token)return alert('Server Login required');let p=d.settings.olt;if(!p.ip||!p.user)return alert('OLT settings পূরণ করুন');openSheet('<h2>OLT Monitor</h2><div class="muted">Live query চালাতে OLT password আবার দিন।</div><br><input id="omp" class="input" type="password" placeholder="OLT Password"><br><br><button class="btn green full" onclick="oltMonitorRun()">Get Live ONU Status</button>')}
async function oltMonitorRun(){let p=d.settings.olt,pass=omp.value;if(!pass)return alert('OLT password দিন');try{let body={host:p.ip,port:p.port||22,protocol:p.protocol||'ssh',vendor:p.vendor||'generic',user:p.user,password:pass};let r=await apiFetch('/api/olt/monitor',{method:'POST',body:JSON.stringify(body)});let rows=[];if((p.vendor||'').toLowerCase()==='vsol'){try{let x=await apiFetch('/api/olt/onu-list',{method:'POST',body:JSON.stringify(body)});rows=x.rows||[]}catch(e){}}oltLive={connected:true,raw:r.raw||'',online:r.online,offline:r.offline,total:r.total,error:'',rows};closeSheet();render();}catch(e){oltLive={...oltLive,connected:false,error:e.message};alert(e.message)}}
function olt(){let p=d.settings.olt||{},ready=p.ip&&p.user,conn=oltLive.connected;return `<button class="back" onclick="go('dashboard')">← Back</button><h1 class="title">OLT Live Monitoring</h1><div class="grid"><div class="stat blue"><div class="label">Total ONU</div><div class="num">${oltLive.total??'—'}</div></div><div class="stat green"><div class="label">Online</div><div class="num">${oltLive.online??'—'}</div></div><div class="stat slate"><div class="label">Offline</div><div class="num">${oltLive.offline??'—'}</div></div><div class="stat red"><div class="label">Alarm</div><div class="num">—</div></div></div><div class="section"><div class="oltStatus"><span class="dot ${conn?'on':'bad'}"></span>${conn?'OLT CONNECTED':'OLT NOT CONNECTED'}</div><div class="detail"><span>Vendor</span><b>${esc((p.vendor||'generic')==='vsol'?'VSOL V1601E04-DP (EPON)':(p.vendor||'Generic'))}</b></div><div class="detail"><span>IP</span><b>${esc(p.ip||'Not configured')}</b></div><div class="detail"><span>Protocol</span><b>${esc((p.protocol||'SSH').toUpperCase())} : ${esc(p.port||((p.protocol||'ssh')==='telnet'?23:22))}</b></div><div class="detail"><span>Username</span><b>${esc(p.user||'Not configured')}</b></div><div class="muted">Password নিরাপত্তার জন্য app-এ স্থায়ীভাবে রাখা হবে না। Connection time-এ ব্যবহার হবে.</div><br><button class="btn dark full" onclick="openOLTSettings()">⚙️ OLT Connection Settings</button><br><br><button class="btn green full" onclick="oltMonitor()">🔄 Refresh Live ONU Status</button>${(oltLive.rows||[]).length?`<div class="divider"></div><div style="font-weight:900;margin-bottom:8px">Live ONU List</div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><tr><th style="text-align:left;padding:6px;border-bottom:1px solid #edf0f4">ONU</th><th style="padding:6px;border-bottom:1px solid #edf0f4">Status</th><th style="padding:6px;border-bottom:1px solid #edf0f4">MAC</th><th style="padding:6px;border-bottom:1px solid #edf0f4">Distance</th></tr>${oltLive.rows.map(x=>`<tr><td style="padding:6px;border-bottom:1px solid #f1f3f6">${esc(x.onuId)}</td><td style="padding:6px;border-bottom:1px solid #f1f3f6;font-weight:900;color:${x.status==='online'?'#15803d':'#b91c1c'}">${esc(x.status)}</td><td style="padding:6px;border-bottom:1px solid #f1f3f6">${esc(x.mac)}</td><td style="padding:6px;border-bottom:1px solid #f1f3f6">${esc(x.distanceM)} m</td></tr>`).join('')}</table></div>`:''}${oltLive.raw?`<div class="divider"></div><div class="muted">Last OLT response</div><pre style="white-space:pre-wrap;font-size:11px;max-height:240px;overflow:auto;background:#f7f8fb;padding:10px;border-radius:10px">${esc(oltLive.raw)}</pre>`:''}${oltLive.error?`<div class="divider"></div><div class="muted" style="color:#b91c1c">${esc(oltLive.error)}</div>`:''}</div>`}
function showOlt(x){window.oltList=x;render()}
function openSettings(){closeDrawer();openSheet(`<h2>Settings</h2><label class="muted">App Name</label><input id="sn" class="input" value="${esc(d.settings.app)}"><br><br><label class="muted">Admin Username</label><input id="su" class="input" value="${esc(d.settings.admin)}"><br><br><label class="muted">Admin Password</label><input id="sp" class="input" type="password" value="${esc(d.settings.password)}"><br><br><h3>📲 bKash Payment</h3><label class="muted">Customer Payment bKash Number</label><input id="bn1" class="input" inputmode="tel" value="${esc(d.settings.bkash.numbers[0]||'01897099850')}"><br><br><div class="muted">শুধু এই নম্বরে টাকা ঢুকলে Incoming bKash notification/Pending transaction তৈরি হবে। Payment কখনো নিজে থেকে Paid হবে না; Manual Paid করতে হবে।</div><br><button class="btn light full" onclick="enableBkashNotifications()">🔔 Enable bKash Notifications</button><br><br><button class="btn dark full" onclick="openOLTSettings()">🌐 OLT Connection Settings</button><br><br><div class="divider"></div><h3>💾 Data Backup</h3><div class="muted">ফোনের app data হারালে backup file দিয়ে customer, payment ও হিসাব ফিরিয়ে আনতে পারবেন।</div><br><div class="row"><button class="btn light" onclick="exportBackup()">Export Backup</button><button class="btn light" onclick="importBackup()">Import Backup</button></div><br><label class="muted">Backend API URL</label><input id="sa" class="input" value="${esc(d.settings.api||'')}"><br><br><label class="muted">API Token (automatic after login)</label><input id="sk" class="input" type="password" value="${esc(d.settings.apiKey||'')}"><br><br><button class="btn full" onclick="saveSettings()">Save Settings</button>`)}
function saveSettings(){d.settings.app=sn.value.trim()||'STAR COMMUNICATION';d.settings.admin=su.value.trim();d.settings.password=sp.value;d.settings.bkash={numbers:[bn1.value.trim()||'01897099850']};d.settings.api=sa.value.trim();d.settings.apiKey=sk.value;save();closeSheet();applyBrand();toast('Settings saved')}
function openOLTSettings(){let p=d.settings.olt||{};openSheet(`<h2>OLT Connection Settings</h2><div class="muted">VSOL V1601E04-DP হলে Vendor হিসেবে <b>VSOL V1601E04-DP (EPON)</b> দিন। Default management IP সাধারণত <b>192.168.8.100</b>; আপনার OLT-র current IP ব্যবহার করুন। Password app-এ স্থায়ীভাবে save হবে না।</div><br><label class="muted">OLT Vendor</label><select id="ov" class="select"><option value="vsol" ${p.vendor==='vsol'?'selected':''}>VSOL V1601E04-DP (EPON)</option><option value="generic" ${p.vendor==='generic'?'selected':''}>Generic</option><option value="huawei" ${p.vendor==='huawei'?'selected':''}>Huawei</option><option value="zte" ${p.vendor==='zte'?'selected':''}>ZTE</option><option value="fiberhome" ${p.vendor==='fiberhome'?'selected':''}>FiberHome</option></select><br><br><label class="muted">OLT IP Address</label><input id="oi" class="input" placeholder="192.168.8.100" value="${esc(p.ip||'')}"><br><br><div class="row"><select id="pr" class="select"><option value="ssh" ${p.protocol!=='telnet'?'selected':''}>SSH</option><option value="telnet" ${p.protocol==='telnet'?'selected':''}>Telnet</option></select><input id="po" class="input" type="number" placeholder="22 / 23" value="${esc(p.port||'')}"></div><br><label class="muted">OLT Username</label><input id="ou" class="input" placeholder="admin" value="${esc(p.user||'')}"><br><br><label class="muted">OLT Password</label><input id="op" class="input" type="password" placeholder="Enter when connecting"><br><br><button class="btn green full" onclick="saveOLT()">Save & Test Connection</button>`)}
function saveOLT(){const ipEl=document.getElementById('oi'),vendorEl=document.getElementById('ov'),userEl=document.getElementById('ou'),protocolEl=document.getElementById('pr'),portEl=document.getElementById('po'),passEl=document.getElementById('op');let ip=(ipEl?.value||'').trim();const vendor=vendorEl?.value||'vsol';const protocol=protocolEl?.value||'ssh';if(!ip&&vendor==='vsol')ip='192.168.8.100';if(!ip)return alert('OLT IP Address দিন');const port=Number(portEl?.value)||((protocol==='telnet')?23:22);d.settings.olt={ip,user:(userEl?.value||'').trim(),vendor,protocol,port};save();const pass=(passEl?.value||'').trim();if(pass){oltTest()}else{closeSheet();toast('OLT IP/settings saved: '+ip);go('olt')}}
function openSheet(h){document.getElementById('sheet').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="back" onclick="closeSheet()">← Back</button><button class="closeSheetBtn" onclick="closeSheet()" style="border:0;background:#eef2f7;border-radius:50%;width:36px;height:36px;font-size:24px;color:#172033">×</button></div>${h}`;document.getElementById('modal').classList.add('show')}function closeSheet(){document.getElementById('modal').classList.remove('show')}
function normPhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('880'))p='0'+p.slice(3);if(p.length===10&&p.startsWith('1'))p='0'+p;return p.slice(-11)}
function findCustomerByPhone(sender){let p=normPhone(sender);return d.customers.find(c=>normPhone(c.phone)===p)}
async function enableBkashNotifications(){
 if(!('Notification' in window)){alert('এই browser/app notification support করে না');return}
 try{let p=await Notification.requestPermission();toast(p==='granted'?'Notification ON হয়েছে':'Notification permission দেওয়া হয়নি')}catch(e){toast('Notification চালু করা যায়নি')}}
function notifyBkash(tx,match){
 try{let title='STAR COMMUNICATION — bKash Payment', body=`৳${Number(tx.amount||0).toLocaleString('en-US')} এসেছে\nFrom: ${tx.sender||'Unknown'}\n${match?'Customer number matched — Pending':'Pending transaction'}`;if(window.Android&&Android.notifyPayment){Android.notifyPayment(title,body)}else if('Notification' in window && Notification.permission==='granted'){new Notification(title,{body})}}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
// Future bKash API/Webhook will call this function with each real incoming transaction.
function receiveBkashTransaction(tx){let r=autoApplyBkashTransaction(tx);if(r.status==='pending')notifyBkash(tx,r.matchFound);if(page==='billing')render();return r}
function autoApplyBkashTransaction(tx){d.bkashIncoming=d.bkashIncoming||[];let exists=d.bkashIncoming.find(x=>x.txid&&tx.txid&&x.txid===tx.txid);if(exists)return exists;let allowed=(d.settings.bkash.numbers||[]).map(normPhone).filter(Boolean),receiver=normPhone(tx.receiver);if(allowed.length&&receiver&&!allowed.includes(receiver)){let x={...tx,status:'ignored'};d.bkashIncoming.push(x);save();return x}let c=findCustomerByPhone(tx.sender);/* Never auto-post a bKash transaction. Even if sender matches a customer, keep it pending because the configured bKash numbers may also be used for personal transactions. */let x={...tx,status:'pending',suggestedCustomer:c?c.id:null,matchFound:!!c};d.bkashIncoming.push(x);save();return x}
function openBkashTest(){openSheet(`<h2>Incoming bKash</h2><div class="muted">এটা testing/manual incoming entry। পরে bKash webhook/API এখানেই transaction পাঠাবে.</div><br><label class="muted">Sender Mobile</label><input id="bs" class="input" inputmode="tel" placeholder="01XXXXXXXXX"><br><br><label class="muted">Receiver bKash Number</label><select id="br" class="select"><option value="${esc(d.settings.bkash.numbers[0]||'01897099850')}">${esc(d.settings.bkash.numbers[0]||'Number 1')}</option><option value="${esc(d.settings.bkash.numbers[1]||'01897099850')}">${esc(d.settings.bkash.numbers[1]||'Number 2')}</option></select><br><br><label class="muted">Amount</label><input id="ba" class="input" type="number" placeholder="500"><br><br><label class="muted">Transaction ID</label><input id="bt" class="input" placeholder="TXN123"><br><br><button class="btn green full" onclick="submitBkashTest()">Process Transaction</button>`)}
function submitBkashTest(){let tx={sender:bs.value.trim(),receiver:br.value,amount:+ba.value,txid:bt.value.trim(),date:today()};if(!tx.sender||!tx.amount)return alert('Sender number এবং amount দিন');let r=autoApplyBkashTransaction(tx);if(r.status==='pending')notifyBkash(tx,r.matchFound);closeSheet();if(r.status==='pending'){toast(r.matchFound?'Customer number match — Pending for manual approval':'No customer match — Pending for manual matching')}else{toast('Transaction ignored')}go('billing')}
function manualMatchBkash(i){let p=(d.bkashIncoming||[]).filter(x=>x.status==='pending')[i];if(!p)return;let arr=d.customers;let suggested=p.suggestedCustomer||p.customer||'';openSheet(`<h2>Manual bKash Payment</h2><div class="detail"><span>Sender</span><b>${esc(p.sender)}</b></div><div class="detail"><span>Amount</span><b>${money(p.amount)}</b></div><div class="detail"><span>Number Match</span><b>${p.matchFound?'Customer number matched':'No customer match'}</b></div><div class="muted" style="margin:10px 0">⚠️ Money is NOT marked paid automatically. Confirm manually only if this transaction is a customer bill payment.</div><label class="muted">Select Customer</label><select id="mc" class="select">${arr.map(c=>`<option value="${c.id}" ${String(c.id)===String(suggested)?'selected':''}>${esc(c.name)} — Due ${money(due(c))}</option>`).join('')}</select><br><br><button class="btn green full" onclick="confirmManualBkash(${i})">✓ Confirm Paid</button><br><button class="btn full" style="background:#fee2e2;color:#b91c1c" onclick="cancelBkash(${i})">✕ Cancel / Personal Transaction</button>`)}
async function confirmManualBkash(i){let p=(d.bkashIncoming||[]).filter(x=>x.status==='pending')[i],c=d.customers.find(x=>x.id==mc.value);if(!p||!c)return;try{if(API.token){await apiFetch('/api/bkash/transactions/'+encodeURIComponent(p.id)+'/manual-paid',{method:'POST',body:JSON.stringify({customerId:c.id})});await refreshCloud()}else{let amount=Math.min(+p.amount||0,due(c));if(amount<=0)return alert('এই customer-এর বর্তমানে due নেই');d.payments.push({id:Date.now(),customer:c.id,amount,date:today(),month:month(),method:'bKash Manual',txid:p.txid||''});if(due(c)<=0){c.prevDue=0;c.status='active'}p.status='manual_matched';p.customer=c.id;p.applied=amount;save()}closeSheet();toast('Manual payment saved');go('billing')}catch(e){alert(e.message)}}
async function cancelBkash(i){let p=(d.bkashIncoming||[]).filter(x=>x.status==='pending')[i];if(!p)return;if(!confirm('এই bKash transaction-টি Cancel/Personal হিসেবে রাখবেন?'))return;try{if(API.token){await apiFetch('/api/bkash/transactions/'+encodeURIComponent(p.id)+'/cancel',{method:'POST'});await refreshCloud()}else{p.status='cancelled';p.cancelledAt=today();save()}closeSheet();toast('Transaction cancelled — bill payment হয়নি');go('billing')}catch(e){alert(e.message)}}
async function deleteCustomer(id){const c=d.customers.find(x=>x.id===id);if(!c)return;if(!confirm('Delete '+c.name+' permanently?'))return;try{if(API.token){await apiFetch('/api/customers/'+encodeURIComponent(id),{method:'DELETE'});await refreshCloud()}else{d.customers=d.customers.filter(x=>x.id!==id);d.payments=d.payments.filter(x=>x.customer!==id);save()}toast('Customer deleted');go('customers',{filter:'all'})}catch(e){alert(e.message)}}
function whatsapp(id){let c=d.customers.find(x=>x.id===id);if(!c||!c.phone)return alert('Customer mobile number নেই');let p=c.phone.replace(/\D/g,'');if(p.startsWith('0'))p='880'+p.slice(1);let du=due(c);let msg=`Assalamu Alaikum ${c.name}, STAR COMMUNICATION-এর ${c.pkg||'internet'} monthly bill ${du?money(du)+' বাকি আছে।':'paid হয়েছে।'} ধন্যবাদ।`;window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank')}
function call(id){let c=d.customers.find(x=>x.id===id);if(c?.phone)location.href='tel:'+c.phone}
function exportBackup(){try{const payload={version:2,exportedAt:new Date().toISOString(),data:d};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='star-communication-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup file তৈরি হয়েছে')}catch(e){alert('Backup failed: '+e.message)}}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const payload=JSON.parse(r.result);const x=payload?.data||payload;if(!x||!Array.isArray(x.customers)||!Array.isArray(x.payments))throw new Error('Invalid backup file');if(!confirm('বর্তমান data replace করে backup restore করবেন?'))return;d=x;d.customers=d.customers||[];d.payments=d.payments||[];d.expenses=d.expenses||[];d.history=d.history||[];d.settings=d.settings||fresh.settings;d.settings.olt=d.settings.olt||fresh.settings.olt;d.settings.olt.vendor=d.settings.olt.vendor||'vsol';d.settings.olt.protocol=d.settings.olt.protocol||'ssh';d.settings.olt.port=d.settings.olt.port||((d.settings.olt.protocol==='telnet')?23:22);d.settings.olt.ip=d.settings.olt.ip||((d.settings.olt.vendor==='vsol')?'192.168.8.100':'');d.settings.bkash=d.settings.bkash||{numbers:['01897099850']};d.settings.bkash.numbers=[d.settings.bkash.numbers?.[0]||'01897099850'];save();ensureMonth();checkExpiry();render();toast('Backup restore হয়েছে')}catch(e){alert('Restore failed: '+e.message)}};r.readAsText(file)};input.click()}
function applyBrand(){document.getElementById('brand').textContent=d.settings.app||'STAR COMMUNICATION';document.getElementById('drawerBrand').textContent=d.settings.app||'STAR COMMUNICATION';document.title=d.settings.app||'STAR COMMUNICATION'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openCloudLogin(){openSheet(`<h2>Server Login</h2><div class="muted">STAR COMMUNICATION backend-এর সাথে connect করুন।</div><br><label class="muted">Backend API URL</label><input id="lb" class="input" value="${esc(API.base||d.settings.api||'')}" placeholder="https://api.example.com"><br><br><label class="muted">Username</label><input id="lu" class="input" value="${esc(d.settings.admin||'admin')}"><br><br><label class="muted">Password</label><input id="lp" class="input" type="password"><br><br><button class="btn green full" onclick="doCloudLogin()">Connect Server</button>`)}
async function doCloudLogin(){try{await cloudLogin(lb.value.trim(),lu.value.trim(),lp.value);d.settings.api=API.base;d.settings.admin=lu.value.trim();save();await refreshCloud();closeSheet();toast('Server connected');render()}catch(e){alert('Server connection failed: '+e.message)}}
window.addEventListener('error',function(e){
  console.error(e.error||e.message);
  try{ toast('App error: '+(e.message||'Unknown error')); }catch(_){}
});
window.addEventListener('unhandledrejection',function(e){
  console.error(e.reason);
  try{ toast('App error: '+(e.reason?.message||'Unexpected error')); }catch(_){}
});

function render(){try{ensureMonth();setNav(page);applyBrand();let el=document.getElementById('content');if(page==='dashboard')el.innerHTML=dashboard();else if(page==='customers')el.innerHTML=customers();else if(page==='add')el.innerHTML=addCustomer();else if(page==='details')el.innerHTML=details(opts.id);else if(page==='billing')el.innerHTML=billing();else if(page==='olt')el.innerHTML=olt();else if(page==='accounts')el.innerHTML=accounts();else if(page==='history')el.innerHTML=history();}catch(e){console.error('Render failed:',e);let el=document.getElementById('content');if(el)el.innerHTML='<div class="card" style="margin-top:16px;border:1px solid #fca5a5"><b>Dashboard load error</b><div style="margin-top:6px;color:#64748b">Please reopen the app. Your saved data has been protected.</div></div>';}}
// If a customer has an explicit expiry date in the past, mark connection expired.
function checkExpiry(){let changed=false;let now=today();d.customers.forEach(c=>{if(c.expiry&&c.expiry<now&&c.status==='active'){c.status='expired';changed=true}});if(changed)save()}
checkExpiry();ensureMonth();(async()=>{try{if(API.token){await refreshCloud();render()}else render()}catch(e){clearCloud();render()}})();setInterval(()=>{ensureMonth();checkExpiry();if(page==='dashboard'||page==='olt'||page==='billing'||page==='accounts'||page==='history')render()},15000);
</script></body></html>
