<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>STAR COMMUNICATION</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  background:#fff;
  padding:16px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

.header h1{
  font-size:22px;
  margin-bottom:4px;
}

.header p{
  font-size:13px;
  color:#777;
}

.content{
  flex:1;
  padding:15px;
  padding-bottom:85px;
}

.page-title{
  margin-bottom:15px;
}

.page-title h2{
  font-size:20px;
}

.page-title p{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.stat-card{
  background:#fff;
  border-radius:12px;
  padding:18px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;
}

.stat-card h3{
  font-size:13px;
  color:#666;
  margin-bottom:10px;
}

.stat-card strong{
  font-size:26px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-btn{
  border:0;
  background:none;
  font-size:12px;
  color:#555;
  cursor:pointer;
}

.nav-btn.active{
  color:#1565c0;
  font-weight:bold;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
}

.primary{
  background:#1565c0;
  color:#fff;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#777;
}

</style>

</head>

<body>

<div class="app">

  <header class="header">

    <h1>STAR COMMUNICATION</h1>

    <p>ISP Management System</p>

  </header>


  <main id="content"
        class="content">
  </main>


  <nav class="bottom-nav">

    <button class="nav-btn active"
            onclick="go('dashboard')">
      🏠<br>
      Dashboard
    </button>

    <button class="nav-btn"
            onclick="go('customers')">
      👥<br>
      Customers
    </button>

    <button class="nav-btn"
            onclick="go('billing')">
      💰<br>
      Billing
    </button>

    <button class="nav-btn"
            onclick="go('monitoring')">
      📡<br>
      OLT
    </button>

    <button class="nav-btn"
            onclick="go('settings')">
      ⚙️<br>
      Settings
    </button>

  </nav>

</div>


<script>


/* =========================
   CUSTOMER DATA
========================= */

let customers = JSON.parse(
  localStorage.getItem("star_customers") || "[]"
);


/* =========================
   SAVE DATA
========================= */

function saveCustomers(){

  localStorage.setItem(
    "star_customers",
    JSON.stringify(customers)
  );

}


/* =========================
   NAVIGATION
========================= */

function go(page){

  if(page === "dashboard"){
    renderDashboard();
  }

  else if(page === "customers"){
    renderCustomers();
  }

  else if(page === "billing"){
    renderBilling();
  }

  else if(page === "monitoring"){
    renderMonitoring();
  }

  else if(page === "settings"){
    renderSettings();
  }

}


/* =========================
   DASHBOARD
========================= */

function renderDashboard(){function renderCustomers(){

  document.getElementById("content").innerHTML = `

    <div class="page-title">

      <h2>Customers</h2>
      <p>Customer management</p>

    </div>

    <div class="card">

      <button class="primary"
              onclick="addCustomerForm()">
        ➕ Add Customer
      </button>

    </div>

    ${
      customers.length === 0

      ? `
        <div class="card empty">
          No customers added yet.
        </div>
      `

      : customers.map((c,index) => `

        <div class="card">

          <h3>${c.name || "Customer"}</h3>

          <p>📱 Phone: ${c.phone || "-"}</p>

          <p>
            📡 PPPoE:
            ${c.pppoe || "-"}
          </p>

          <p>
            📅 Expiry:
            ${c.expiry || "-"}
          </p>

          <p>
            Status:
            <strong>${c.status || "Active"}</strong>
          </p>

          <p>
            Bill:
            <strong>${c.billStatus || "Unpaid"}</strong>
          </p>

          <br>

          <button
            class="primary"
            onclick="editCustomer(${index})">
            ✏️ Edit
          </button>

          <button
            onclick="deleteCustomer(${index})">
            🗑️ Delete
          </button>

          <button
            onclick="callCustomer('${c.phone || ""}')">
            📞 Call
          </button>

          <button
            onclick="whatsappCustomer('${c.phone || ""}')">
            WhatsApp
          </button>

        </div>

      `).join("")
    }

  `;
}


/* =========================
   ADD CUSTOMER
========================= */

function addCustomerForm(){

  document.getElementById("content").innerHTML = `

    <div class="page-title">

      <h2>Add Customer</h2>

      <p>New customer information</p>

    </div>

    <div class="card">

      <input id="cName"
        placeholder="Customer Name"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="cPhone"
        placeholder="Phone Number"
        type="tel"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="cAddress"
        placeholder="Address"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="cPppoe"
        placeholder="PPPoE Username"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="cPassword"
        placeholder="PPPoE Password"
        type="password"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="cExpiry"
        type="date"
        style="width:100%;padding:12px;margin-bottom:15px">

      <button
        class="primary"
        onclick="saveNewCustomer()">
        💾 Save Customer
      </button>

      <button
        onclick="renderCustomers()">
        Cancel
      </button>

    </div>

  `;
}


/* =========================
   SAVE NEW CUSTOMER
========================= */

function saveNewCustomer(){

  const name =
    document.getElementById("cName").value.trim();

  const phone =
    document.getElementById("cPhone").value.trim();

  const address =
    document.getElementById("cAddress").value.trim();

  const pppoe =
    document.getElementById("cPppoe").value.trim();

  const password =
    document.getElementById("cPassword").value.trim();

  const expiry =
    document.getElementById("cExpiry").value;


  if(!name){

    alert("Customer name required");

    return;
  }


  const customer = {

    id: Date.now(),

    name:name,

    phone:phone,

    address:address,

    pppoe:pppoe,

    password:password,

    expiry:expiry,

    status:"Active",

    billStatus:"Unpaid",

    createdAt:
      new Date().toISOString()

  };


  customers.push(customer);

  saveCustomers();

  alert("Customer added successfully");

  renderCustomers();
}


/* =========================
   EDIT CUSTOMER
========================= */

function editCustomer(index){

  const c = customers[index];

  document.getElementById("content").innerHTML = `

    <div class="page-title">

      <h2>Edit Customer</h2>

      <p>Update customer information</p>

    </div>

    <div class="card">

      <input id="eName"
        value="${c.name || ""}"
        placeholder="Customer Name"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="ePhone"
        value="${c.phone || ""}"
        placeholder="Phone Number"
        type="tel"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="eAddress"
        value="${c.address || ""}"
        placeholder="Address"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="ePppoe"
        value="${c.pppoe || ""}"
        placeholder="PPPoE Username"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="ePassword"
        value="${c.password || ""}"
        placeholder="PPPoE Password"
        type="password"
        style="width:100%;padding:12px;margin-bottom:10px">

      <input id="eExpiry"
        value="${c.expiry || ""}"
        type="date"
        style="width:100%;padding:12px;margin-bottom:15px">

      <button
        class="primary"
        onclick="updateCustomer(${index})">
        💾 Update
      </button>

      <button
        onclick="renderCustomers()">
        Cancel
      </button>

    </div>

  `;
}


/* =========================
   UPDATE CUSTOMER
========================= */

function updateCustomer(index){

  customers[index].name =
    document.getElementById("eName").value.trim();

  customers[index].phone =
    document.getElementById("ePhone").value.trim();

  customers[index].address =
    document.getElementById("eAddress").value.trim();

  customers[index].pppoe =
    document.getElementById("ePppoe").value.trim();

  customers[index].password =
    document.getElementById("ePassword").value.trim();

  customers[index].expiry =
    document.getElementById("eExpiry").value;


  saveCustomers();

  alert("Customer updated");

  renderCustomers();
}


/* =========================
   DELETE CUSTOMER
========================= */

function deleteCustomer(index){

  if(!confirm(
    "Are you sure you want to delete this customer?"
  )){
    return;
  }

  customers.splice(index,1);

  saveCustomers();

  renderCustomers();
}


/* =========================
   PHONE
========================= */

function callCustomer(phone){

  if(!phone){
    alert("Phone number not available");
    return;
  }

  window.location.href =
    "tel:" + phone;
}


/* =========================
   WHATSAPP
========================= */

function whatsappCustomer(phone){

  if(!phone){
    alert("Phone number not available");
    return;
  }

  let number = phone.replace(/\D/g,"");

  if(number.startsWith("01")){
    number = "88" + number;
  }

  window.location.href =
    "https://wa.me/" + number;
}

  const total = customers.length;

  const active = customers.filter(
    c => c.status === "Active"
  ).length;

  const inactive = customers.filter(
    c => c.status === "Inactive"
  ).length;

  const expired = customers.filter(
    c => c.status === "Expired"
  ).length;

  const unpaid = customers.filter(
    c => c.billStatus === "Unpaid"
  ).length;

  const paid = customers.filter(
    c => c.billStatus === "Paid"
  ).length;


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="page-title">

      <h2>Dashboard</h2>

      <p>
        STAR COMMUNICATION </p>

  </div>

  <div class="stats-grid">

    <div class="stat-card" onclick="go('customers')">
      <h3>Total Customer</h3>
      <strong>${total}</strong>
    </div>

    <div class="stat-card" onclick="go('customers')">
      <h3>Active Customer</h3>
      <strong>${active}</strong>
    </div>

    <div class="stat-card" onclick="go('customers')">
      <h3>Inactive Customer</h3>
      <strong>${inactive}</strong>
    </div>

    <div class="stat-card" onclick="go('customers')">
      <h3>Expired Customer</h3>
      <strong>${expired}</strong>
    </div>

    <div class="stat-card" onclick="go('billing')">
      <h3>Total Unpaid</h3>
      <strong>${unpaid}</strong>
    </div>

    <div class="stat-card" onclick="go('billing')">
      <h3>Total Paid</h3>
      <strong>${paid}</strong>
    </div>

  </div>

  `;

}


/* =========================
   CUSTOMER PAGE
========================= */

function renderCustomers(){

  document.getElementById("content").innerHTML = `

    <div class="page-title">
      <h2>Customers</h2>
      <p>Customer management</p>
    </div>

    <div class="card">

      <button class="primary"
              onclick="addCustomerForm()">

        ➕ Add Customer

      </button>

    </div>

    <div class="card empty">
      No customers added yet.
    </div>

  `;

}


/* =========================
   BILLING
========================= */

function renderBilling(){

  const paidCustomers = customers.filter(
    c => c.billStatus === "Paid"
  );

  const unpaidCustomers = customers.filter(
    c => c.billStatus !== "Paid"
  );

  document.getElementById("content").innerHTML = `

    <div class="page-title">

      <h2>Billing</h2>

      <p>Payment & Bill Management</p>

    </div>


    <div class="stats-grid">

      <div class="stat-card"
           onclick="showPaidCustomers()">

        <h3>Total Paid</h3>

        <strong>${paidCustomers.length}</strong>

      </div>


      <div class="stat-card"
           onclick="showUnpaidCustomers()">

        <h3>Total Unpaid</h3>

        <strong>${unpaidCustomers.length}</strong>

      </div>

    </div>


    <br>


    <div class="card">

      <h3>Monthly Billing</h3>

      <br>

      <p>
        Paid Customers:
        <strong>${paidCustomers.length}</strong>
      </p>

      <p>
        Unpaid Customers:
        <strong>${unpaidCustomers.length}</strong>
      </p>

      <br>

      <p>
        Collection:
        <strong>
          ${
            customers.length
            ? Math.round(
                (paidCustomers.length /
                customers.length) * 100
              )
            : 0
          }%
        </strong>
      </p>

    </div>

  `;

}


/* =========================
   PAID CUSTOMER LIST
========================= */

function showPaidCustomers(){

  const list = customers.filter(
    c => c.billStatus === "Paid"
  );

  document.getElementById("content").innerHTML = `

    <div class="page-title">

      <h2>Paid Customers</h2>

      <p>
        Total: ${list.length}
      </p>

    </div>


    ${
      list.length === 0

      ? `
        <div class="card empty">
          No paid customers.
        </div>
      `

      : list.map((c,index) => `

        <div class="card">

          <h3>${c.name || "Customer"}</h3>

          <p>
            📱 ${c.phone || "-"}
          </p>

          <p>
            💰 Bill:
            <strong>Paid</strong>
          </p>

          <br>

          <button
            onclick="renderCustomers()">
            Customer Details
          </button>

        </div>

      `).join("")
    }

  `;

}


/* =========================
   UNPAID CUSTOMER LIST
========================= */

function showUnpaidCustomers(){

  const list = customers.filter(
    c => c.billStatus !== "Paid"
  );

  document.getElementById("content").innerHTML = `

    <div class="page-title">

      <h2>Unpaid Customers</h2>

      <p>
        Total: ${list.length}
      </p>

    </div>


    ${
      list.length === 0

      ? `
        <div class="card empty">
          No unpaid customers.
        </div>
      `

      : list.map(c => {

        const index =
          customers.findIndex(
            x => x.id === c.id
          );

        return `

          <div class="card">

            <h3>
              ${c.name || "Customer"}
            </h3>

            <p>
              📱 ${c.phone || "-"}
            </p>

            <p>
              💰 Status:
              <strong>Unpaid</strong>
            </p>

            <p>
              Previous Due:
              ৳${c.previousDue || 0}
            </p>

            <p>
              Current Bill:
              ৳${c.currentBill || 0}
            </p>

            <p>
              Total Due:
              ৳${
                (Number(c.previousDue) || 0) +
                (Number(c.currentBill) || 0)
              }
            </p>

            <br>

            <button
              class="primary"
              onclick="manualPaid(${index})">

              💵 Manual Paid

            </button>

          </div>

        `;

      }).join("")
    }

  `;

}


/* =========================
   MANUAL PAID
========================= */

function manualPaid(index){

  if(!customers[index]){
    return;
  }

  if(!confirm(
    "Mark this customer's bill as Paid?"
  )){
    return;
  }

  customers[index].billStatus = "Paid";

  customers[index].paidAt =
    new Date().toISOString();

  saveCustomers();

  alert("Payment marked as Paid");

  showUnpaidCustomers();

}
