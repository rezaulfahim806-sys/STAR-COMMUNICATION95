<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>STAR COMMUNICATION</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  background:#fff;
  padding:16px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

.header h1{
  font-size:22px;
  margin-bottom:4px;
}

.header p{
  font-size:13px;
  color:#777;
}

.content{
  flex:1;
  padding:15px;
  padding-bottom:85px;
}

.page-title{
  margin-bottom:15px;
}

.page-title h2{
  font-size:20px;
}

.page-title p{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.stat-card{
  background:#fff;
  border-radius:12px;
  padding:18px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;
}

.stat-card h3{
  font-size:13px;
  color:#666;
  margin-bottom:10px;
}

.stat-card strong{
  font-size:26px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-btn{
  border:0;
  background:none;
  font-size:12px;
  color:#555;
  cursor:pointer;
}

.nav-btn.active{
  color:#1565c0;
  font-weight:bold;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
}

.primary{
  background:#1565c0;
  color:#fff;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#777;
}

</style>

</head>

<body>

<div class="app">

  <header class="header">

    <h1>STAR COMMUNICATION</h1>

    <p>ISP Management System</p>

  </header>


  <main id="content"
        class="content">
  </main>


  <nav class="bottom-nav">

    <button class="nav-btn active"
            onclick="go('dashboard')">
      🏠<br>
      Dashboard
    </button>

    <button class="nav-btn"
            onclick="go('customers')">
      👥<br>
      Customers
    </button>

    <button class="nav-btn"
            onclick="go('billing')">
      💰<br>
      Billing
    </button>

    <button class="nav-btn"
            onclick="go('monitoring')">
      📡<br>
      OLT
    </button>

    <button class="nav-btn"
            onclick="go('settings')">
      ⚙️<br>
      Settings
    </button>

  </nav>

</div>


<script>


/* =========================
   CUSTOMER DATA
========================= */

let customers = JSON.parse(
  localStorage.getItem("star_customers") || "[]"
);


/* =========================
   SAVE DATA
========================= */

function saveCustomers(){

  localStorage.setItem(
    "star_customers",
    JSON.stringify(customers)
  );

}


/* =========================
   NAVIGATION
========================= */

function go(page){

  if(page === "dashboard"){
    renderDashboard();
  }

  else if(page === "customers"){
    renderCustomers();
  }

  else if(page === "billing"){
    renderBilling();
  }

  else if(page === "monitoring"){
    renderMonitoring();
  }

  else if(page === "settings"){
    renderSettings();
  }

}


/* =========================
   DASHBOARD
========================= */

function renderDashboard(){

  const total = customers.length;

  const active = customers.filter(
    c => c.status === "Active"
  ).length;

  const inactive = customers.filter(
    c => c.status === "Inactive"
  ).length;

  const expired = customers.filter(
    c => c.status === "Expired"
  ).length;

  const unpaid = customers.filter(
    c => c.billStatus === "Unpaid"
  ).length;

  const paid = customers.filter(
    c => c.billStatus === "Paid"
  ).length;


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="page-title">

      <h2>Dashboard</h2>

      <p>
        STAR COMMUNICATION </p>

  </div>

  <div class="stats-grid">

    <div class="stat-card" onclick="go('customers')">
      <h3>Total Customer</h3>
      <strong>${total}</strong>
    </div>

    <div class="stat-card" onclick="go('customers')">
      <h3>Active Customer</h3>
      <strong>${active}</strong>
    </div>

    <div class="stat-card" onclick="go('customers')">
      <h3>Inactive Customer</h3>
      <strong>${inactive}</strong>
    </div>

    <div class="stat-card" onclick="go('customers')">
      <h3>Expired Customer</h3>
      <strong>${expired}</strong>
    </div>

    <div class="stat-card" onclick="go('billing')">
      <h3>Total Unpaid</h3>
      <strong>${unpaid}</strong>
    </div>

    <div class="stat-card" onclick="go('billing')">
      <h3>Total Paid</h3>
      <strong>${paid}</strong>
    </div>

  </div>

  `;

}


/* =========================
   CUSTOMER PAGE
========================= */

function renderCustomers(){

  document.getElementById("content").innerHTML = `

    <div class="page-title">
      <h2>Customers</h2>
      <p>Customer management</p>
    </div>

    <div class="card">

      <button class="primary"
              onclick="addCustomerForm()">

        ➕ Add Customer

      </button>

    </div>

    <div class="card empty">
      No customers added yet.
    </div>

  `;

}


/* =========================
   BILLING
========================= */

function renderBilling(){

  document.getElementById("content").innerHTML = `

    <div class="page-title">
      <h2>Billing</h2>
      <p>Payment & bill management</p>
    </div>

    <div class="card">
      <h3>Total Paid</h3>
      <br>
      ${
        customers.filter(
          c => c.billStatus === "Paid"
        ).length
      }
    </div>

    <div class="card">
      <h3>Total Unpaid</h3>
      <br>
      ${
        customers.filter(
          c => c.billStatus === "Unpaid"
        ).length
      }
    </div>

  `;

}


/* =========================
   OLT
========================= */

function renderMonitoring(){

  document.getElementById("content").innerHTML = `

    <div class="page-title">
      <h2>OLT Live Monitoring</h2>
      <p>OLT connection will be added later</p>
    </div>

    <div class="card">

      <h3>OLT Status</h3>

      <br>

      <strong>Not Connected</strong>

    </div>

  `;

}


/* =========================
   SETTINGS
========================= */

function renderSettings(){

  document.getElementById("content").innerHTML = `

    <div class="page-title">
      <h2>Settings</h2>
      <p>App settings</p>
    </div>

    <div class="card">
      <h3>STAR COMMUNICATION</h3>
      <br>
      <p>App Settings</p>
    </div>

  `;

}


/* =========================
   START APP
========================= */

go("dashboard");

</script>

</body>
</html>
